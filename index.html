ish kuni nima qilging keladi? — Kino ko'ramizmi, mazali ovqat yeymizmi — hammasi yoqadi. — Unda men tanlayman. Qayer bo'lsa ham mayli-mi? — Ha, sen bilan bo'lsa, qayer bo'lsa ham yaxshi.","means":[{"h":"Tanlov: qaysi biri bo'lsa ham","ex":[["버스를 타든지 지하철을 타든지 빨리 오세요.","Avtobusgami, metrogami — tezroq keling."],["커피든지 차든지 아무거나 주세요.","Kofemi, choymi — xohlaganini bering."]]},{"h":"So'roq so'zi + 든지: har qanday","ex":[["궁금한 게 있으면 언제든지 물어보세요.","Savol bo'lsa, istalgan vaqtda so'rang."],["뭐든지 잘 먹어요.","Hamma narsani yeyaveraman."]]},{"h":"-든지 말든지: qilsa ham, qilmasa ham (befarqlik)","ex":[["가든지 말든지 마음대로 해.","Borasanmi, bormaysanmi — o'zing bil."]]}],"dq":["-든가 ham xuddi shu ma'noda ishlatiladi: 보든가 먹든가.","-던지 (o'tmish his) bilan adashtirmang: 얼마나 춥던지 = shunday sovuq edi-ki."],"conv":[["Jisu","저녁에 뭐 먹을까요?"],["Malika","한식이든지 중식이든지 상관없어요."],["Aziz","이 일을 누가 할 수 있어요?"],["Jasur","누구든지 할 수 있어요. 쉬워요."]],"ex":[{"ins":"-든지 / (이)든지 bilan yozing.","nam":"전화하든지 문자하든지 연락 주세요. (전화하다)","words":"","items":["피곤하면 __________ 쉬든지 하세요. (자다)","__________ 오세요. 항상 환영해요. (언제)","__________ 빵이든지 아무거나 먹고 싶어요. (밥)","도와줄 수 있는 일이면 __________ 할게요. (뭐)"],"ans":["자든지","언제든지","밥이든지","뭐든지"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["(어디든지 / 어디이든지) 같이 가요.","(가든지 말든지 / 가든지 안 가든지) 네 마음대로 해."],"ans":["어디든지","가든지 말든지 (ikkalasi ham mumkin)"]},{"ins":"Ikki tanlovli maslahat bering (-든지 -든지).","nam":"스트레스를 받으면 운동을 하든지 노래를 부르든지 해 보세요.","words":"","items":[],"ans":[]}]},{"n":35,"title":"만약에 시험에 떨어지더라도 실망하지 마세요","tag":"A/V-더라도","uz":"...-gan taqdirda ham","form":["-더라도 faraz qilingan (ko'pincha salbiy) holat yuz bergan taqdirda ham keyingi harakat","o'zgarmasligini bildiradi. -아/어도 dan kuchliroq. O'zbekchada: \"...-gan taqdirda ham\", \"hatto ...-","sa ham\".","A/V-더라도 O'tgan N","떨어지다 → 떨어지더라도 실수했더라도 N(이)더라도: 학생이더라도","바쁘다 → 바쁘더라도"],"dia":[["Aziz","말리카 씨, 내일 토픽 시험인데 너무 떨려요."],["Malika","열심히 했으니까 잘 볼 거예요. 만약에 떨어지더 라도 실망하지 마세요."],["Aziz","네, 고마워요."],["Malika","아무리 어렵더라도 끝까지 포기하지 마세요."]],"tr":"— Malika, ertaga TOPIK imtihoni, juda hayajondaman. — Qattiq o'qidingiz, yaxshi topshirasiz. Agar yiqilgan taqdiringizda ham hafsalangiz pir bo'lmasin. — Ha, rahmat. — Qanchalik qiyin bo'lsa ham oxirigacha taslim bo'lmang.","means":[{"h":"Faraz: ...-gan taqdirda ham","ex":[["실패하더라도 다시 도전할 거예요.","Muvaffaqiyatsiz bo'lgan taqdirda ham yana urinaman."],["비가 오더라도 행사는 진행합니다.","Yomg'ir yog'sa ham tadbir o'tkaziladi."]]},{"h":"아무리/만약 bilan","ex":[["아무리 바쁘더라도 식사는 꼭 하세요.","Qanchalik band bo'lsangiz ham ovqatlanishni unutmang."],["만약 늦더라도 꼭 연락 주세요.","Agar kechiksangiz ham albatta xabar bering."]]}],"dq":["-아/어도: real yoki umumiy holat / -더라도: ehtimoli kam faraz, kuchliroq.","15-darsdagi -더라고요 (ko'rganini aytish) bilan adashtirmang."],"conv":[["Jasur","이 일 혼자 하기 힘들 것 같아요."],["Jisu","힘들더라도 조금만 더 해 봐요."],["Sardor","그 사람이 거짓말을 했어요."],["Dilnoza","그렇더라도 화내지 마세요."]],"ex":[{"ins":"-더라도 bilan yozing.","nam":"바쁘더라도 연락 좀 해요. (바쁘다)","words":"","items":["돈이 __________ 그 집은 안 살 거예요. (많다)","아무리 __________ 거짓말은 하지 마세요. (화가 나다)","시간이 __________ 끝까지 해야 해요. (오래 걸리다)","__________ 규칙은 지켜야 해요. (외국인)"],"ans":["많더라도","화가 나더라도","오래 걸리더라도","외국인이더라도"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["혹시 길을 (잃더라도 / 잃더라고요) 걱정하지 마세요.","아무리 (힘들더라도 / 힘들어서) 웃으세요."],"ans":["잃더라도","힘들더라도"]},{"ins":"O'zingizga va'da bering (-더라도).","nam":"아무리 피곤하더라도 매일 단어 10개를 외울 거예요.","words":"","items":[],"ans":[]}]},{"n":36,"title":"알람 소리를 못 듣는 바람에 늦잠을 잤어요","tag":"V-는 바람에","uz":"... tufayli (kutilmagan)","form":["-는 바람에 kutilmagan sabab tufayli salbiy natija bo'lganini bildiradi. Natija doim o'tgan zamonda.","O'zbekchada: \"... sababli\", \"... tufayli\".","V-는 바람에","듣다 → 듣는 바람에","오다 → 오는 바람에","놓치다 → 놓치는 바람에"],"dia":[["Jisu","사르도르 씨, 오늘 왜 지각했어요?"],["Sardor","알람 소리를 못 듣는 바람에 늦잠을 잤어요."],["Jisu","어제 늦게 잤어요?"],["Sardor","네, 친구가 갑자기 찾아오는 바람에 새벽에 잤어요."]],"tr":"— Sardor, bugun nega kechikdingiz? — Budilnikni eshitmay qolib, uxlab qolibman. — Kecha kech yotdingizmi? — Ha, do'stim kutilmaganda kelib qolgani sababli tongda yotdim.","means":[{"h":"Kutilmagan sabab → salbiy natija","ex":[["버스를 놓치는 바람에 회의에 늦었어요.","Avtobusdan qolib ketib, majlisga kechikdim."],["갑자기 비가 오는 바람에 옷이 다 젖었어요.","Birdan yomg'ir yog'ib, kiyimim ho'l bo'ldi."]]},{"h":"Kamdan-kam ijobiy natija","ex":[["친구가 도와주는 바람에 일찍 끝났어요.","Do'stim yordam berib yuborib, erta tugatdim."]]}],"dq":["Natija qismi doim o'tgan zamonda: 늦잠을 자는 바람에 늦을 거예요. ✗","Buyruq/taklif bilan ishlatilmaydi.","Faqat fe'l bilan; o'tgan zamon qo'shimchasi olmaydi."],"conv":[["Malika","휴대폰 화면이 왜 그래요?"],["Aziz","계단에서 넘어지는 바람에 깨졌어요."],["Dilnoza","숙제 했어?"],["Jasur","아니, 컴퓨터가 고장 나는 바람에 못 했어."]],"ex":[{"ins":"-는 바람에 bilan yozing.","nam":"길이 막히는 바람에 비행기를 놓쳤어요. (막히다)","words":"","items":["갑자기 손님이 __________ 약속을 취소했어요. (오다)","지갑을 __________ 집에 걸어서 왔어요. (잃어버리다)","옆 사람이 __________ 잠을 못 잤어요. (코를 골다)","정전이 __________ 엘리베이터에 갇혔어요. (되다)"],"ans":["오는 바람에","잃어버리는 바람에","코를 고는 바람에","되는 바람에"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["감기에 걸리는 바람에 학교에 못 갔어요. ( )","시간이 없는 바람에 택시를 타세요. ( )","늦잠을 잔 바람에 지각했어요. ( )"],"ans":["O","X (buyruq)","X (→ 자는 바람에)"]},{"ins":"Kutilmagan voqea tufayli nima bo'lgan? -는 바람에 bilan yozing.","nam":"지하철이 고장 나는 바람에 회사에 지각했어요.","words":"","items":[],"ans":[]}]},{"n":37,"title":"회를 먹는 김에 매운탕도 먹어요","tag":"V-는 김에","uz":"...-ganda fursatdan foydalanib","form":["-는 김에 bir ishni qilayotgan fursatdan foydalanib, yana boshqa ishni ham qilishni bildiradi.","O'zbekchada: \"...-ganda, shu bahona\", \"...-ar ekanman, ...ham\".","V-는 김에 O'tgan","가다 → 가는 김에 V-(으)ㄴ 김에: 온 김에","먹다 → 먹는 김에 나온 김에"],"dia":[["Jasur","말리카 씨, 저 지금 마트에 가요."],["Malika","그래요? 가는 김에 우유 좀 사다 줄래요?"],["Jasur","네, 다른 건 필요 없어요?"],["Malika","아, 말이 나온 김에 계란도 좀 부탁해요."]],"tr":"— Malika, men hozir do'konga ketyapman. — Shunaqami? Borgan bahona sut olib kelib bera olasizmi? — Ha, boshqa narsa kerak emasmi? — Gap ochilgan ekan, tuxum ham olib keling.","means":[{"h":"Fursatdan foydalanib qo'shimcha ish","ex":[["시장에 가는 김에 과일도 사 올게요.","Bozorga borayotganimda meva ham olib kelaman."],["청소하는 김에 창문도 닦았어요.","Yig'ishtirayotib, shu bahona derazani ham artdim."]]},{"h":"Tugagan harakat: -(으)ㄴ 김에","ex":[["부산에 온 김에 친구도 만났어요.","Pusanga kelganim bahona do'stimni ham ko'rdim."],["일어난 김에 물 좀 갖다줘.","Turding-ku, bir stakan suv olib kel."]]}],"dq":["Ikkinchi ish rejalashtirilmagan, qo'shimcha bo'ladi.","Sifat bilan ishlatilmaydi."],"conv":[["Sardor","은행에 갔다 올게요."],["Dilnoza","가는 김에 이 편지 좀 우체국에 보내 줄래요?"],["Aziz","서울에 출장 왔어요."],["Jisu","온 김에 경복궁도 구경하세요."]],"ex":[{"ins":"-는 김에 / -(으)ㄴ 김에 bilan yozing.","nam":"빨래를 하는 김에 이불도 빨았어요. (하다)","words":"","items":["밖에 __________ 쓰레기 좀 버려 줘. (나가다)","머리를 __________ 염색도 했어요. (자르다)","한국에 __________ 여기저기 여행했어요. (오다, o'tgan)","커피를 __________ 내 것도 하나 사 줘. (사다)"],"ans":["나가는 김에","자르는 김에","온 김에","사는 김에"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["(내려가는 김에 / 내려가는 바람에) 이것 좀 경비실에 갖다 주세요.","이사를 (하는 김에 / 한 김에) 가구도 새로 샀어요."],"ans":["내려가는 김에","하는 김에 (한 김에 ham mumkin)"]},{"ins":"Biror ishni qilib, shu bahona yana nima qilasiz?","nam":"마트에 가는 김에 약국에도 들를 거예요.","words":"","items":[],"ans":[]}]},{"n":38,"title":"동물원에 가느니 차라리 박물관이 좋겠어요","tag":"V-느니 차라리","uz":"...-gandan ko'ra yaxshisi","form":["-느니 차라리 ikki yoqimsiz tanlovdan birinchisini qilgandan ko'ra ikkinchisini afzal ko'rishni","bildiradi. O'zbekchada: \"...-gandan ko'ra, yaxshisi ...\".","V-느니 (차라리) Oxiri","가다 → 가느니 -겠어요 / -는 게 낫겠어요 / -(으)ㄹ래요","먹다 → 먹느니","기다리다 → 기다리느니"],"dia":[["Aziz","이번 주말에 동물원에 갈까요?"],["Dilnoza","이렇게 더운 날 동물원에 가느니 차라리 박물관 이 좋겠어요."],["Aziz","박물관도 사람이 많을 텐데요."],["Dilnoza","사람 많은 데서 고생하느니 차라리 집에서 영화 를 보는 게 낫겠어요."]],"tr":"— Shu dam olish kuni hayvonot bog'iga boramizmi? — Bunday issiq kunda hayvonot bog'iga borgandan ko'ra, yaxshisi muzey. — Muzeyda ham odam ko'p bo'lsa kerak. — Odam gavjum joyda qiynalgandan ko'ra, yaxshisi uyda kino ko'rgan ma'qul.","means":[{"h":"Ikki yomondan kamrog'ini tanlash","ex":[["이 음식을 먹느니 차라리 굶겠어요.","Bu ovqatni yegandan ko'ra, yaxshisi och qolaman."],["한 시간 동안 버스를 기다리느니 차라리 걸어갈래요.","Bir soat avtobus kutgandan ko'ra, yaxshisi piyoda boraman."]]},{"h":"Natija: -는 게 낫다","ex":[["비싼 돈 주고 고치느니 새로 사는 게 낫겠어요.","Qimmat pulga tuzattirgandan ko'ra, yangisini olgan ma'qul."]]}],"dq":["Ikkala tanlov ham to'liq yoqmaydi; ikkinchisi \"hech bo'lmasa yaxshiroq\".","차라리 tushib qolishi mumkin, lekin ma'noni kuchaytiradi."],"conv":[["Jisu","그 사람이랑 같이 일할래요?"],["Malika","아니요, 그 사람이랑 일하느니 차라리 혼자 할래요."],["Jasur","택시 기다릴까?"],["Sardor","여기서 기다리느니 지하철 타자."]],"ex":[{"ins":"-느니 차라리 bilan yozing.","nam":"이렇게 사느니 차라리 고향에 돌아가겠어요. (살다 → 사느니)","words":"","items":["줄을 서서 __________ 다른 식당에 가요. (기다리다)","거짓말을 __________ 사실대로 말할래요. (하다)","이 옷을 __________ 안 입는 게 낫겠어요. (입다)"],"ans":["기다리느니 차라리","하느니 차라리","입느니 차라리"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["밥을 먹느니 차라리 너무 맛있어요. ( )","늦게 가느니 차라리 안 가겠어요. ( )"],"ans":["X","O"]},{"ins":"Qaysi birini tanlaysiz? -느니 차라리 bilan yozing.","nam":"만원 버스를 타느니 차라리 일찍 일어나서 걸어가겠어요.","words":"","items":[],"ans":[]}]},{"n":39,"title":"여자친구를 사귀더니 더 멋있어진 것 같아요","tag":"A/V-더니","uz":"avval ... edi, endi ...","form":["-더니 so'zlovchi o'tmishda kuzatgan holatni hozirgi holat bilan solishtiradi yoki uni keyingi","natijaning sababi sifatida ko'rsatadi. Odatda 2-3-shaxs haqida. O'zbekchada: \"avval ... edi, endi","...\", \"...-gan edi, natijada ...\".","A/V-더니 N","춥다 → 춥더니 N(이)더니: 학생이더니","사귀다 → 사귀더니","공부하다 → 공부하더니"],"dia":[["Malika","사르도르 씨 요즘 많이 달라졌죠?"],["Jasur","네, 여자친구를 사귀더니 더 멋있어진 것 같아요."],["Malika","옷도 깔끔하게 입고 다니네요."],["Jasur","작년에는 운동을 안 하더니 요즘은 매일 헬스장 에 가요."]],"tr":"— Sardor keyingi paytda ancha o'zgardi-a? — Ha, qiz bilan uchrasha boshlagach, kelishganroq bo'lib qoldi shekilli. — Kiyimni ham ozoda kiyib yuribdi. — O'tgan yili sport qilmasdi, endi har kuni sport zaliga boryapti.","means":[{"h":"Avvalgi va hozirgi holat solishtirmasi","ex":[["어제는 춥더니 오늘은 따뜻하네요.","Kecha sovuq edi, bugun iliq ekan."],["아침에는 흐리더니 오후에는 맑아졌어요.","Ertalab bulut edi, tushdan keyin ochildi."]]},{"h":"Kuzatilgan harakat → natija","ex":[["민수 씨가 열심히 공부하더니 시험에 합격했어요.","Minsu qattiq o'qidi, natijada imtihondan o'tdi."],["동생이 아이스크림을 많이 먹더니 배탈이 났어요.","Ukam muzqaymoqni ko'p yedi, oqibatda qorni buzildi."]]}],"dq":["Ega odatda 2-3-shaxs. O'zining harakati natijasi uchun -았/었더니 (43-dars): 제가 운동을 했 더니 ...","Ikki qism egasi bir xil bo'ladi."],"conv":[["Aziz","지수 씨가 요즘 한국어 대신 영어로 말해요."],["Dilnoza","미국 유학을 다녀오더니 영어가 편한가 봐요."],["Jisu","아기가 왜 울어요?"],["Malika","아까는 잘 놀더니 지금은 졸린가 봐요."]],"ex":[{"ins":"-더니 bilan yozing.","nam":"어제는 비가 오더니 오늘은 맑네요. (오다)","words":"","items":["동생은 어릴 때 __________ 지금은 키가 커요. (작다)","친구가 매일 __________ 살이 많이 빠졌어요. (운동하다)","아까는 __________ 지금은 조용하네요. (시끄럽다)","지수 씨가 밤새 __________ 감기에 걸렸어요. (일하다)"],"ans":["작더니","운동하더니","시끄럽더니","일하더니"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["제가 어제 공부하더니 오늘 시험을 잘 봤어요. ( )","형이 열심히 돈을 모으더니 차를 샀어요. ( )","아침에는 바람이 불더니 지금은 안 불어요. ( )"],"ans":["X (1-shaxs → 제가 공부했더니)","O","O"]},{"ins":"Tanishingiz qanday o'zgardi? -더니 bilan yozing.","nam":"제 친구는 한국에 오더니 김치를 좋아하게 됐어요.","words":"","items":[],"ans":[]}]},{"n":40,"title":"한국 드라마를 좋아한다면서요?","tag":"A-다면서요? / V-ㄴ/는다면서요?","uz":"...-ar ekansiz-ku?","form":["-다면서요? boshqalardan eshitgan narsani suhbatdoshdan tasdiqlatish uchun ishlatiladi.","O'zbekchada: \"...-ar ekansiz-a?\", \"...-dir deb eshitdim, rostmi?\".","A-다면서요? V-ㄴ/는다면서요? O'tgan N","바쁘다 → 바쁘다면서요? 가다 → 간다면서요? 갔다면서요? N(이)라면서요?","먹다 → 먹는다면서요? 좋았다면서요?"],"dia":[["Jisu","딜노자 씨, 한국 드라마를 정말 좋아한다면서요?"],["Dilnoza","네, 누가 그랬어요?"],["Jisu","말리카 씨가요. 드라마 보면서 한국어를 배웠다면서요?"],["Dilnoza","맞아요. 드라마 덕분에 듣기를 잘하게 됐어요."]],"tr":"— Dilnoza, koreys seriallarini juda yaxshi ko'rar ekansiz-a? — Ha, kim aytdi? — Malika. Serial ko'rib koreys tilini o'rgangan ekansiz-a? — To'g'ri. Seriallar tufayli tinglashni yaxshi o'zlashtirdim.","means":[{"h":"Eshitganni tasdiqlatish","ex":[["다음 달에 결혼한다면서요? 축하해요!","Kelasi oy uylanar ekansiz-a? Tabriklayman!"],["그 식당이 맛있다면서요?","O'sha restoran mazali ekan-a?"]]},{"h":"O'tgan voqea / ot","ex":[["어제 시험을 봤다면서요? 어땠어요?","Kecha imtihon topshiribsiz-a? Qanday o'tdi?"],["지수 씨 동생이 가수라면서요?","Jisuning singlisi qo'shiqchi ekan-a?"]]},{"h":"Ta'na: aytgan gapi bilan harakati mos emas","ex":[["바쁘다면서요? 왜 여기 있어요?","Bandman degandingiz-ku? Nega bu yerdasiz?"]]}],"dq":["Faqat so'roq ohangida; ma'lumotni tasdiqlash uchun.","Qisqa shakli: -다며? (norasmiy)."],"conv":[["Aziz","이사한다면서요?"],["Jasur","네, 회사 근처로 가요."],["Malika","어제 많이 아팠다면서요?"],["Sardor","네, 지금은 괜찮아요."]],"ex":[{"ins":"-다면서요? shaklida yozing.","nam":"민수 씨가 회사를 그만뒀다면서요? (그만뒀다)","words":"","items":["내일 눈이 많이 __________? (오다)","요즘 한국어를 __________? (가르치다)","그 영화가 정말 __________? (무섭다)","저 사람이 새로 온 __________? (선생님이다)"],"ans":["온다면서요","가르친다면서요","무섭다면서요","선생님이라면서요"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["다음 주에 고향에 (간다면서요 / 가다면서요)?","어제 생일(이라면서요 / 이다면서요)?"],"ans":["간다면서요","이라면서요"]},{"ins":"Do'stingiz haqida eshitgan narsalarni tasdiqlating.","nam":"자전거 타고 출근한다면서요?","words":"","items":[],"ans":[]}]},{"n":41,"title":"벚꽃이 예쁘다니까 거기로 갑시다","tag":"A-다니까 / V-ㄴ/는다니까","uz":"...-ar ekan, shuning uchun","form":["-다니까 boshqalardan eshitgan ma'lumotni sabab qilib, keyingi taklif yoki qarorni bildiradi. Gap","oxirida (-다니까요) aytgan gapini ta'kidlab takrorlaydi. O'zbekchada: \"...-ar ekan, shuning","uchun\".","A-다니까 V-ㄴ/는다니까 O'tgan N","예쁘다 → 예쁘다니까 오다 → 온다니까 끝났다니까 N(이)라니까","먹다 → 먹는다니까"],"dia":[["Malika","이번 주말에 꽃구경 어디로 갈까요?"],["Jisu","석촌호수 벚꽃이 정말 예쁘다니까 거기로 갑시다."],["Malika","좋아요. 그런데 비가 온다니까 우산을 챙겨요."],["Jisu","네, 사람이 많다니까 일찍 만나요."]],"tr":"— Shu dam olish kuni gul tomoshaga qayerga boramiz? — Sokchon ko'li sakuralari juda chiroyli ekan, o'sha yoqqa boraylik. — Yaxshi. Lekin yomg'ir yog'arkan, soyabon olaylik. — Ha, odam ko'p ekan, erta uchrashaylik.","means":[{"h":"Eshitilgan ma'lumot → sabab","ex":[["내일 춥다니까 따뜻하게 입으세요.","Ertaga sovuq bo'larkan, issiq kiyining."],["그 영화가 재미있다니까 한번 봐요.","U kino qiziq ekan, bir ko'raylik."]]},{"h":"Gap oxirida: ta'kidlab takrorlash (-다니까요)","ex":[["정말 괜찮다니까요!","Rostdan ham hech narsa qilmaydi deyapman-ku!"],["제가 한다니까요.","Men qilaman deyapman-ku."]]}],"dq":["-(으)니까 (o'z sababi) bilan farqi: 비가 오니까 (o'zim ko'ryapman) / 비가 온다니까 (eshitdim).","-다고 하니까 ning qisqa shakli."],"conv":[["Sardor","저 식당 갈래요?"],["Aziz","오늘 쉰다니까 다른 데 가요."],["Dilnoza","시험 결과 언제 나와요?"],["Jasur","다음 주에 나온다니까 조금만 기다려요."]],"ex":[{"ins":"-다니까 bilan yozing.","nam":"오후에 비가 온다니까 우산을 가져가세요. (오다)","words":"","items":["그 가게가 __________ 거기서 사요. (싸다)","민수 씨가 오늘 __________ 내일 만나요. (바쁘다)","공연이 7시에 __________ 서둘러요. (시작하다)","저 사람이 __________ 물어보세요. (전문가이다)"],"ans":["싸다니까","바쁘다니까","시작한다니까","전문가라니까"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["일기 예보에서 눈이 (온다니까 / 오니까) 일찍 출발해요.","A: 정말 괜찮아? B: 괜찮(다니까 / 니까)!"],"ans":["온다니까","괜찮다니까"]},{"ins":"Eshitgan ma'lumot asosida taklif qiling (-다니까).","nam":"이 책이 시험에 도움이 된다니까 같이 공부해요.","words":"","items":[],"ans":[]}]},{"n":42,"title":"애들치고 안 싸우는 애들이 어디 있어요?","tag":"N치고(는)","uz":"... uchun (nisbatan)","form":["N치고는 shu toifa uchun odatdagidan farqli ekanini, N치고 + inkor esa toifadagi hammasi istisnosiz","shunday ekanini bildiradi. O'zbekchada: \"... uchun (anchagina)\", \"...-lar orasida ... yo'q\".","N치고는 N치고 + inkor Misol","외국인치고는 애들치고 ... 없다 처음치고는 잘했어요","겨울치고는"],"dia":[["Malika","아이들이 또 싸워요. 어떡하죠?"],["Sardor","애들치고 안 싸우는 애들이 어디 있어요? 괜찮아요."],["Malika","그래도 요즘 너무 자주 싸워요."],["Sardor","이 나이치고는 그래도 착한 편이에요."]],"tr":"— Bolalar yana urishyapti. Nima qilsam ekan? — Urishmaydigan bola qayerda bor? Hechqisi yo'q. — Baribir keyingi paytlarda juda tez-tez urishyapti. — Shu yosh uchun baribir yaxshi bolalar.","means":[{"h":"Toifa uchun odatdan tashqari: N치고는","ex":[["외국인치고는 한국어를 정말 잘해요.","Chet ellik uchun koreyschani juda yaxshi biladi."],["겨울치고는 날씨가 따뜻해요.","Qish uchun havo iliq."]]},{"h":"Istisnosiz: N치고 + inkor","ex":[["한국 사람치고 김치 싫어하는 사람 별로 없어요.","Kimchini yoqtirmaydigan koreys deyarli yo'q."],["공짜치고 좋은 거 없어요.","Tekin narsaning yaxshisi bo'lmaydi."]]}],"dq":["N치고는 ko'pincha kutilganidan yaxshi yoki yomon ekanini bildiradi: 처음치고는 잘했어요.","Faqat ot bilan."],"conv":[["Jisu","이 가방 얼마예요?"],["Aziz","3만 원이에요. 가죽 가방치고는 싸요."],["Dilnoza","오늘 첫 출근 어땠어요?"],["Jasur","첫날치고는 괜찮았어요."]],"ex":[{"ins":"N치고는 bilan yozing.","nam":"초보자치고는 운전을 잘하네요. (초보자)","words":"","items":["__________ 바람이 차가워요. (봄)","__________ 키가 정말 커요. (초등학생)","__________ 맛있네요. (학교 식당 음식)","__________ 손님이 별로 없어요. (주말)"],"ans":["봄치고는","초등학생치고는","학교 식당 음식치고는","주말치고는"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["(한국 사람치고 / 한국 사람치고는) 이 노래를 모르는 사람이 없어요.","(처음치고 / 처음치고는) 잘했어요."],"ans":["한국 사람치고","처음치고는"]},{"ins":"Kutilganidan farqli narsa haqida N치고는 bilan yozing.","nam":"이 식당은 서울치고는 값이 싸요.","words":"","items":[],"ans":[]}]},{"n":43,"title":"소리가 들려서 나갔더니 아무도 없는 거야","tag":"V-았/었더니","uz":"...-gan edim, (natija) ekan","form":["-았/었더니 so'zlovchining o'zi qilgan harakatidan keyin kashf etgan holat yoki natijani bildiradi. Ega","odatda 1-shaxs. O'zbekchada: \"...-gan edim, qarasam ...\", \"...-gandim, natijada ...\".","-았더니 -었더니 -했더니","가다 → 갔더니 먹다 → 먹었더니 운동하다 → 운동했더니","자다 → 잤더니 마시다 → 마셨더니"],"dia":[["Aziz","딜노자, 아까 왜 갑자기 밖에 나갔어?"],["Dilnoza","초인종 소리가 들려서 나갔더니 아무도 없는 거야."],["Aziz","무섭다! 택배 아니었어?"],["Dilnoza","응, 경비실에 전화했더니 택배 기사님이 다른 집 에 잘못 왔대."]],"tr":"— Dilnoza, hozir nega birdan tashqariga chiqding? — Qo'ng'iroq ovozi eshitilib chiqqandim, qarasam hech kim yo'q. — Qo'rqinchli! Posilka emasmidi? — Ha, qorovulxonaga qo'ng'iroq qilsam, kuryer boshqa uyga adashib kelgan ekan.","means":[{"h":"O'z harakatidan keyin kashfiyot","ex":[["아침에 일찍 학교에 갔더니 아무도 없었어요.","Ertalab maktabga erta borsam, hech kim yo'q ekan."],["창문을 열었더니 눈이 오고 있었어요.","Derazani ochsam, qor yog'ayotgan ekan."]]},{"h":"O'z harakati → natija","ex":[["약을 먹었더니 감기가 나았어요.","Dori ichgandim, shamollash tuzaldi."],["매일 걸었더니 살이 빠졌어요.","Har kuni yurgandim, ozib ketdim."]]},{"h":"Boshqaning reaksiyasi","ex":[["친구한테 물어봤더니 모른대요.","Do'stimdan so'rasam, bilmas ekan."]]}],"dq":["-더니 (39-dars) — boshqalarni kuzatish; -았/었더니 — o'zining harakati.","Keyingi qism ko'pincha o'tgan zamonda."],"conv":[["Jasur","얼굴이 좋아졌네요."],["Malika","요즘 일찍 잤더니 피부가 좋아졌어요."],["Sardor","그 식당 어땠어요?"],["Jisu","가 봤더니 문을 닫았더라고요."]],"ex":[{"ins":"-았/었더니 bilan yozing.","nam":"커피를 많이 마셨더니 잠이 안 와요. (마시다)","words":"","items":["오랜만에 운동을 __________ 온몸이 아파요. (하다)","고향에 전화를 __________ 어머니가 우셨어요. (하다)","시장에 __________ 과일이 아주 쌌어요. (가다)","소금을 많이 __________ 너무 짜요. (넣다)"],"ans":["했더니","했더니","갔더니","넣었더니"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["친구가 열심히 공부했더니 시험에 합격했어요. ( )","제가 열심히 공부했더니 시험에 합격했어요. ( )","문을 열었더니 고양이가 있었어요. ( )"],"ans":["X (3-shaxs → 공부하더니)","O","O"]},{"ins":"O'zingiz qilgan ish va uning natijasini yozing (-았/었더니).","nam":"한국 친구와 매일 이야기했더니 한국어 실력이 늘었어요.","words":"","items":[],"ans":[]}]},{"n":44,"title":"동네가 너무 시끄럽길래 이사하게 되었어요","tag":"A/V-길래","uz":"... bo'lgani uchun","form":["-길래 so'zlovchi ko'rgan/bilgan holat sababli o'zi biror harakat qilganini bildiradi. Og'zaki nutqda.","O'zbekchada: \"... bo'lgani uchun\", \"...-gani sababli\".","A/V-길래 N So'roq","시끄럽다 → 시끄럽길래 N(이)길래 뭐길래? / 누구길래?","싸다 → 싸길래","오다 → 오길래"],"dia":[["Aziz","자수르 씨, 지난달에 이사했다면서요?"],["Jasur","네, 전에 살던 동네가 너무 시끄럽길래 이사하게 되었어요."],["Aziz","새 집은 어때요?"],["Jasur","조용하고 좋아요. 월세도 싸길래 바로 계약했어요."]],"tr":"— Jasur, o'tgan oy ko'chibsiz-a? — Ha, avval yashagan mahallam juda shovqinli bo'lgani uchun ko'chdim. — Yangi uy qanday? — Tinch, yaxshi. Ijarasi ham arzon ekan, darhol shartnoma qildim.","means":[{"h":"Ko'rgan holat → o'z harakati","ex":[["날씨가 좋길래 산책했어요.","Havo yaxshi bo'lgani uchun sayr qildim."],["친구가 배고프다고 하길래 라면을 끓여 줬어요.","Do'stim qornim och degani uchun ramyon qaynatib berdim."]]},{"h":"So'roqda: ...-ki, nima ekan?","ex":[["그 사람이 누구길래 그렇게 좋아해요?","U kim ekanki, shunchalik yoqtirasiz?"],["뭐길래 이렇게 비싸요?","Bu nima ekanki, bunchalik qimmat?"]]}],"dq":["Keyingi qismda buyruq/taklif ishlatilmaydi: 싸길래 사세요. ✗","Keyingi qism odatda so'zlovchining o'tgan zamondagi harakati.","Yozma uslubda -기에 (51-dars bilan adashtirmang)."],"conv":[["Malika","웬 꽃이에요?"],["Sardor","꽃이 너무 예쁘길래 하나 샀어요."],["Dilnoza","왜 우산을 가져왔어?"],["Jisu","하늘이 흐리길래."]],"ex":[{"ins":"-길래 bilan yozing.","nam":"옷이 싸길래 두 벌 샀어요. (싸다)","words":"","items":["친구가 __________ 같이 울었어요. (울다)","문이 __________ 그냥 들어갔어요. (열려 있다)","너무 __________ 에어컨을 켰어요. (덥다)","사람들이 줄을 __________ 저도 섰어요. (서 있다)"],"ans":["울길래","열려 있길래","덥길래","서 있길래"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["비가 오길래 우산을 가져가세요. ( )","배가 고프길래 빵을 사 먹었어요. ( )","그게 뭐길래 그렇게 웃어요? ( )"],"ans":["X (buyruq bilan emas)","O","O"]},{"ins":"Biror narsani ko'rib nima qildingiz? -길래 bilan yozing.","nam":"세일을 하길래 운동화를 샀어요.","words":"","items":[],"ans":[]}]},{"n":45,"title":"미리 읽었더라면 좋았을 텐데요","tag":"A/V-았/었더라면","uz":"...-ganimda edi (afsus)","form":["-았/었더라면 o'tmishda bo'lmagan holatni faraz qilib, afsus yoki yengillik bildiradi. Ko'pincha -았/었","을 거예요 yoki 좋았을 텐데 bilan tugaydi. O'zbekchada: \"...-ganimda edi\", \"agar ...-ganda edi\".","-았더라면 -었더라면 -했더라면 N","알다 → 알았더라면 읽다 → 읽었더라면 공부했더라면 N이었/였더라면","가다 → 갔더라면"],"dia":[["Jisu","사르도르 씨, 오늘 발표 어땠어요?"],["Sardor","질문에 대답을 잘 못 했어요. 자료를 미리 읽었더 라면 좋았을 텐데요."],["Jisu","다음에는 잘할 거예요."],["Sardor","네, 시간이 좀 더 있었더라면 더 준비했을 거예요."]],"tr":"— Sardor, bugungi taqdimot qanday o'tdi? — Savollarga yaxshi javob bera olmadim. Materiallarni oldindan o'qiganimda edi, yaxshi bo'lardi. — Keyingi safar uddalaysiz. — Ha, vaqt biroz ko'proq bo'lganida, yaxshiroq tayyorlanardim.","means":[{"h":"O'tmishdagi afsus","ex":[["조금 일찍 출발했더라면 비행기를 탔을 거예요.","Biroz erta chiqqanimda edi, samolyotga ulgurardim."],["그때 말했더라면 좋았을 텐데.","O'shanda aytganimda edi, yaxshi bo'lardi."]]},{"h":"Yengillik: xayriyat bo'lmadi","ex":[["네가 없었더라면 큰일 날 뻔했어.","Sen bo'lmaganingda katta ish bo'lishiga oz qolardi."],["안전벨트를 안 맸더라면 크게 다쳤을 거예요.","Xavfsizlik kamarini taqmaganimda qattiq jarohatlanardim."]]}],"dq":["Faqat o'tmish haqida. Kelajak faraz uchun -다면 (46-dars).","-았/었으면 좋았을 텐데 ham o'xshash ma'noda."],"conv":[["Aziz","공연 표가 다 팔렸대요."],["Malika","어제 예매했더라면 볼 수 있었을 텐데요."],["Jasur","길을 잃었어요."],["Dilnoza","지도를 가져왔더라면 좋았을 텐데."]],"ex":[{"ins":"-았/었더라면 bilan yozing.","nam":"우산을 가져왔더라면 비를 안 맞았을 거예요. (가져오다)","words":"","items":["열심히 __________ 합격했을 거예요. (공부하다)","그 사실을 __________ 안 갔을 거예요. (알다)","조금만 더 __________ 그 사람을 만났을 거예요. (기다리다)","내가 __________ 그렇게 하지 않았을 거예요. (너)"],"ans":["공부했더라면","알았더라면","기다렸더라면","너였더라면"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["어제 일찍 (잤더라면 / 자더라면) 피곤하지 않았을 거예요.","그때 그 집을 (샀더라면 / 산다면) 지금 부자가 됐을 거예요."],"ans":["잤더라면","샀더라면"]},{"ins":"O'tmishdagi afsusingizni yozing.","nam":"어렸을 때 피아노를 배웠더라면 좋았을 텐데요.","words":"","items":[],"ans":[]}]},{"n":46,"title":"지금처럼 노력한다면 더 좋아질 거야","tag":"A-다면 / V-ㄴ/는다면","uz":"agar ...-sa (faraz)","form":["-다면 ehtimoli kam yoki xayoliy holatni faraz qiladi; -(으)면 dan ko'ra farazroq. O'zbekchada: \"agar","...-sa\", \"...-ganda edi\".","A-다면 V-ㄴ/는다면 O'tgan N","좋다 → 좋다면 가다 → 간다면 갔다면 N(이)라면: 내가 너라면","바쁘다 → 바쁘다면 먹다 → 먹는다면 했다면"],"dia":[["Sardor","요즘 한국어 실력이 안 느는 것 같아요."],["Malika","아니에요. 지금처럼 노력한다면 더 좋아질 거예요."],["Sardor","고마워요. 만약 토픽 5급을 받는다면 한턱낼게요."],["Malika","좋아요! 제가 사르도르 씨라면 매일 일기를 쓸 거예요."]],"tr":"— Keyingi paytda koreys tilim o'smayotganga o'xshaydi. — Yo'q. Hozirgidek harakat qilsangiz, yanada yaxshilanadi. — Rahmat. Agar TOPIK 5-daraja olsam, mehmon qilaman. — Yaxshi! Men siz bo'lganimda har kuni kundalik yozardim.","means":[{"h":"Faraz qilingan shart","ex":[["복권에 당첨된다면 세계 여행을 하고 싶어요.","Lotereya yutsam, dunyo bo'ylab sayohat qilmoqchiman."],["시간을 되돌릴 수 있다면 대학 때로 가고 싶어요.","Vaqtni orqaga qaytarish mumkin bo'lsa, talabalik davrimga qaytgim keladi."]]},{"h":"N(이)라면: men ... bo'lganimda","ex":[["내가 너라면 그 일을 할 거야.","Men sen bo'lganimda, o'sha ishni qilardim."],["새라면 하늘을 날 수 있을 텐데.","Qush bo'lganimda, osmonda ucha olardim."]]},{"h":"Shart sifatida (rasmiyroq)","ex":[["궁금한 점이 있다면 연락 주세요.","Savollaringiz bo'lsa, bog'laning."]]}],"dq":["Kundalik real shart uchun -(으)면: 비가 오면 집에 있을 거예요.","-았/었더라면 (45-dars) — faqat o'tmishga oid afsus."],"conv":[["Jisu","10억 원이 생긴다면 뭐 할 거예요?"],["Aziz","부모님께 집을 사 드릴 거예요."],["Dilnoza","다시 태어난다면 뭐가 되고 싶어?"],["Jasur","가수가 되고 싶어."]],"ex":[{"ins":"-다면 / -ㄴ/는다면 bilan yozing.","nam":"한 달 휴가가 있다면 제주도에서 살아 보고 싶어요. (있다)","words":"","items":["투명 인간이 __________ 뭘 하고 싶어요? (되다)","내일 지구가 __________ 오늘 뭘 할 거예요? (멸망하다)","외국어를 하나 더 __________ 일본어를 배울 거예요. (배우다)","내가 __________ 그렇게 안 했을 거예요. (사장님이다)"],"ans":["된다면","멸망한다면","배운다면","사장님이라면"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["만약 하늘을 날 수 (있다면 / 있으면) 어디에 가고 싶어요?","내일 비가 (오면 / 온다면) 소풍을 취소할게요. (oddiy shart)"],"ans":["있다면","오면"]},{"ins":"Faraz qiling va javob bering.","nam":"","words":"","items":["대통령이 된다면 ______________________","한국 사람으로 태어났다면 ______________________"],"ans":[]}]},{"n":47,"title":"여자친구가 있을 리가 없어요","tag":"A/V-(으)ㄹ 리가 없다/있다","uz":"...-ishi mumkin emas","form":["-(으)ㄹ 리가 없다 biror narsa bo'lishi mumkin emasligiga qat'iy ishonchni bildiradi. -(으)ㄹ 리가 있어","요? ritorik so'roq ham shu ma'noda. O'zbekchada: \"...-ishi mumkin emas\", \"...-adimi hech?\".","Unli / ㄹ Undosh O'tgan So'roq","하다 → 할 리가 없다 있다 → 있을 리가 없다 끝났을 리가 없다 그럴 리가요? / 그럴 리가 있어요?","알다 → 알 리가 없다"],"dia":[["Jisu","아지즈 씨, 사르도르 씨가 여자친구가 생겼대요."],["Aziz","에이, 사르도르가요? 걔는 매일 게임만 하는데 여자친구가 있을 리가 없어요."],["Jisu","진짜래요. 어제 같이 있는 걸 봤어요."],["Aziz","그럴 리가요! 직접 물어봐야겠어요."]],"tr":"— Aziz, Sardorning qiz do'sti paydo bo'libdi. — E, Sardormi? U har kuni faqat o'yin o'ynaydi, qiz do'sti bo'lishi mumkin emas. — Rost ekan. Kecha birga ko'rishibdi. — Bo'lishi mumkin emas! O'zidan so'rashim kerak.","means":[{"h":"Bo'lishi mumkin emas (qat'iy ishonch)","ex":[["그 사람은 정직해서 거짓말을 할 리가 없어요.","U halol odam, yolg'on gapirishi mumkin emas."],["어제 분명히 넣었는데 지갑이 없을 리가 없어요.","Kecha aniq solgandim, hamyon yo'q bo'lishi mumkin emas."]]},{"h":"O'tgan voqea: -았/었을 리가 없다","ex":[["벌써 끝났을 리가 없어요. 아직 30분 남았어요.","Allaqachon tugagan bo'lishi mumkin emas. Hali 30 daqiqa bor."]]},{"h":"Ritorik so'roq: 그럴 리가요?","ex":[["A: 민수 씨가 회사를 그만뒀대요. B: 그럴 리가요?","— Minsu ishdan ketibdi. — Bo'lishi mumkin emas!"]]}],"dq":["Faqat taxmin/ishonch; kelajakdagi niyat uchun emas.","리 o'rniga 수 ishlatilmaydi: 할 수가 없어요 — bu \"qila olmayman\" ma'nosi."],"conv":[["Dilnoza","이 문제 답이 틀렸대요."],["Jasur","선생님이 틀릴 리가 없어요. 다시 확인해 봐요."],["Malika","오늘 눈이 온대요."],["Sardor","5월인데 눈이 올 리가 있어요?"]],"ex":[{"ins":"-(으)ㄹ 리가 없어요 bilan yozing.","nam":"그 사람이 그런 말을 했을 리가 없어요. (했다)","words":"","items":["이렇게 맛있는 음식이 __________. (싸다)","지수 씨가 약속을 __________. (잊어버리다)","그 가게가 벌써 __________. (닫았다)","민수 씨가 한국 __________. (사람이다 → 사람일)"],"ans":["쌀 리가 없어요","잊어버릴 리가 없어요","닫았을 리가 없어요","사람일 리가 없어요"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["그 착한 사람이 화를 (낼 리가 / 낼 수가) 없어요.","A: 시험이 취소됐대요. B: (그럴 리가요 / 그럴 수가요)?"],"ans":["낼 리가","그럴 리가요"]},{"ins":"Ishonmaydigan gapga -(으)ㄹ 리가 없어요 bilan javob bering.","nam":"","words":"","items":["A: 우리 반 선생님이 가수래요. → B: ______________________","A: 이 가방이 10만 원이래요. → B: ______________________"],"ans":[]}]},{"n":48,"title":"보나 마나 음악회에 늦을 것 같아요","tag":"V-(으)나 마나","uz":"...-sa ham, -masa ham","form":["-(으)나 마나 biror ishni qilish-qilmaslikdan qat'i nazar natija bir xil (ko'pincha aniq) ekanini","bildiradi. O'zbekchada: \"...-sa ham, -masa ham\", \"ko'rmasdan ham ma'lum\".","Unli / ㄹ Undosh Gap oxiri","보다 → 보나 마나 먹다 → 먹으나 마나 -(으)나 마나예요 = foydasiz","하다 → 하나 마나 읽다 → 읽으나 마나","알다 → 아나 마나"],"dia":[["Dilnoza","벌써 7시예요. 음악회가 7시 반에 시작하죠?"],["Jasur","네, 그런데 길이 이렇게 막히니까 보나 마나 음악 회에 늦을 것 같아요."],["Dilnoza","지하철로 갈아탈까요?"],["Jasur","지금 갈아타도 가나 마나예요. 그냥 2부부터 봐요."]],"tr":"— Allaqachon soat 7. Konsert 7:30 da boshlanadi-a? — Ha, lekin yo'l bunchalik tirband, ko'rmasdan ham ma'lum — konsertga kechikamiz shekilli. — Metroga o'taylikmi? — Hozir o'tsak ham farqi yo'q. Mayli, ikkinchi qismdan ko'ramiz.","means":[{"h":"Natija aniq: qilsa ham, qilmasa ham","ex":[["물어보나 마나 안 된다고 할 거예요.","So'rasangiz ham, so'ramasangiz ham — yo'q deydi."],["보나 마나 또 늦잠을 잤을 거예요.","Ko'rmasdan ham ma'lum, yana uxlab qolgan."]]},{"h":"Foydasiz: -(으)나 마나이다","ex":[["이렇게 대충 하면 청소를 하나 마나예요.","Bunday chala qilsangiz, yig'ishtirdingiz nima, yig'ishtirmadingiz nima."],["약을 먹으나 마나 낫지 않아요.","Dori ichsam ham, ic 요?"],["Jasur","네, 학생 때 자주 오곤 했어요."]],"ex":[{"ins":"-곤 해요 / -곤 했어요 bilan yozing.","nam":"잠이 안 오면 따뜻한 우유를 마시곤 해요. (마시다)","words":"","items":["어렸을 때 동생과 자주 __________. (싸우다, o'tgan)","기분이 안 좋으면 혼자 __________. (걷다)","학생 때 도서관에서 __________. (자다, o'tgan)","심심하면 친구에게 __________. (전화하다)"],"ans":["싸우곤 했어요","걷곤 해요","자곤 했어요","전화하곤 해요"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["어렸을 때 할머니가 옛날이야기를 해 주시곤 했어요. ( )","저는 키가 크곤 해요. ( )"],"ans":["O","X (sifat bilan emas)"]},{"ins":"Bolaligingizdagi odatlarni -곤 했어요 bilan yozing.","nam":"여름마다 시골에 가서 수박을 먹곤 했어요.","words":"","items":[],"ans":[]}]},{"n":51,"title":"혼자 공부하기에 쉬운 한국어 문법책 있어요?","tag":"V-기에","uz":"...-ish uchun (baho)","form":["-기에 biror harakatni qilish nuqtai nazaridan baho beradi; keyin 좋다, 나쁘다, 쉽다, 어렵다, 좁다, 충분","하다 kabi sifatlar keladi. O'zbekchada: \"...-ish uchun (qulay/qiyin)\".","V-기에 Keyin","공부하다 → 공부하기에 좋다 / 어렵다 / 쉽다 / 좁다 / 충분하다 / 적당하다","살다 → 살기에","먹다 → 먹기에"],"dia":[["Sardor","말리카 씨, 혼자 공부하기에 쉬운 한국어 문법책있어요?"],["Malika","이 책이 어때요? 설명이 자세해서 혼자 공부하기 에 좋아요."],["Sardor","좀 두꺼워서 들고 다니기에 무겁네요."],["Malika","그럼 집에서 공부하세요. 하하."]],"tr":"— Malika, mustaqil o'qish uchun oson koreys grammatika kitobi bormi? — Mana bu qalay? Tushuntirishi batafsil, mustaqil o'qish uchun qulay. — Biroz qalin ekan, olib yurishga og'ir. — Unda uyda o'qing. Ha-ha.","means":[{"h":"Harakat nuqtai nazaridan baho","ex":[["이 방은 둘이 살기에 좀 좁아요.","Bu xona ikki kishi yashashi uchun biroz tor."],["오늘은 산책하기에 딱 좋은 날씨예요.","Bugun sayr qilish uchun aynan mos havo."]]},{"h":"Yetarli/yetarli emas","ex":[["만 원이면 점심을 먹기에 충분해요. 10 ming von tushlik uchun yetarli.",""],["아이가 보기에 너무 무서운 영화예요.","Bola ko'rishi uchun juda qo'rqinchli kino."]]}],"dq":["Yozma uslubda -기에 \"sabab\" ma'nosida ham keladi (-길래 ga o'xshash): 비가 오기에 우산을 가져왔어요.","-기 좋다 ham o'xshash: 살기 좋은 도시."],"conv":[["Jisu","이 신발 어때요?"],["Jasur","예쁘지만 오래 걷기에 불편해 보여요."],["Aziz","이 노트북 살까요?"],["Dilnoza","가벼워서 들고 다니기에 좋아요."]],"ex":[{"ins":"-기에 bilan yozing.","nam":"이 의자는 앉기에 편해요 도면 서울에서는 __________. (싸다)"],"ans":["가족인 셈이에요","사는 셈이에요","읽은 셈이에요","싼 셈이에요"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["거의 다 왔으니까 (도착한 셈이에요 / 도착하는 셈이에요).","시험이 하나 남았으니까 방학이 (시작된 셈이에요 / 시작될 셈이에요)."],"ans":["도착한 셈이에요","시작된 셈이에요"]},{"ins":"Kundalik hayotingizdan -(으)ㄴ/는 셈이다 bilan yozing.","nam":"매일 한국 드라마를 보니까 한국어를 매일 공부하는 셈이에요.","words":"","items":[],"ans":[]}]},{"n":53,"title":"늦잠을 자는 탓에 자주 지각을 했어요","tag":"A/V-(으)ㄴ/는 탓에","uz":"... aybi bilan","form":["-(으)ㄴ/는 탓에 salbiy natijaning sababini (aybini) ko'rsatadi. O'zbekchada: \"... aybi bilan\", \"...","sababli (yomon natija)\".","A-(으)ㄴ 탓에 V-는 탓에 V o'tgan N","춥다 → 추운 탓에 자다 → 자는 탓에 잔 탓에 N인 탓에 / N 탓","먹은 탓에"],"dia":[["Sardor","아지즈 씨, 어제 과장님한테 혼났어요?"],["Aziz","네, 요즘 밤늦게까지 게임을 하고 늦잠을 자는 탓 에 자주 지각을 했거든요."],["Sardor","이제 일찍 자야겠네요."],["Aziz","네, 다 제 탓이에요. 오늘부터 일찍 잘 거예요."]],"tr":"— Aziz, kecha bo'lim boshlig'idan gap eshitdingizmi? — Ha, keyingi paytda kechgacha o'yin o'ynab, uxlab qolganim aybi bilan tez-tez kechikdim. — Endi erta yotishingiz kerak ekan. — Ha, hammasi o'zimning aybim. Bugundan erta yotaman.","means":[{"h":"Salbiy natija sababi","ex":[["날씨가 추운 탓에 감기 환자가 많아요.","Havo sovuq bo'lgani sababli shamollaganlar ko'p."],["음식을 급하게 먹은 탓에 체했어요.","Ovqatni shoshib yeganim aybi bilan oshqozonim buzildi."]]},{"h":"N 탓 / -(으)ㄴ/는 탓이다","ex":[["남의 탓을 하지 마세요.","Boshqalarni ayblamang."],["시험에 떨어진 건 공부를 안 한 탓이에요.","Imtihondan yiqilganim o'qimaganim aybi."]]}],"dq":["Ijobiy natija uchun 덕분에: 친구 덕분에 합격했어요.","-는 바람에 (36) — kutilmagan sabab; 탓에 — ayb/javobgarlik ohangi."],"conv":[["Malika","과일 값이 왜 이렇게 올랐어요?"],["Jisu","비가 많이 온 탓에 농사가 잘 안 됐대요."],["Jasur","왜 이렇게 피곤해 보여요?"],["Dilnoza","옆집이 시끄러운 탓에 잠을 못 잤어요."]],"ex":[{"ins":"-(으)ㄴ/는 탓에 bilan yozing.","nam":"눈이 많이 온 탓에 비행기가 취소됐어요. (왔다)","words":"","items":["길이 __________ 넘어졌어요. (미끄럽다)","운동을 안 __________ 살이 쪘어요. (하다)","어제 술을 많이 __________ 머리가 아파요. (마셨다)","경험이 __________ 실수를 많이 했어요. (없다)"],"ans":["미끄러운 탓에","하는 탓에 (한 탓에)","마신 탓에","없는 탓에"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["선생님 (덕분에 / 탓에) 한국어를 잘하게 됐어요.","교통사고가 (난 탓에 / 난 덕분에) 길이 막혔어요."],"ans":["덕분에","난 탓에"]},{"ins":"Biror yomon natija va uning sababini yozing.","nam":"늦게 일어난 탓에 아침을 못 먹었어요.","words":"","items":[],"ans":[]}]},{"n":54,"title":"화장실 문이 안 열려요","tag":"피동사","uz":"majhul nisbat fe'llari","form":["피동사 (majhul nisbat) harakat egasi emas, harakatni qabul qiluvchi ega bo'lganda ishlatiladi.","Fe'lga -이-, -히-, -리-, -기- qo'shiladi. O'zbekchada: \"...-ildi\", \"...-indi\" (ochildi, eshitildi).","-이- -히- -리- -기-","보다 → 보이다 닫다 → 닫히다 열다 → 열리다 안다 → 안기다","쓰다 → 쓰이다 잡다 → 잡히다 듣다 → 들리다 끊다 → 끊기다","놓다 → 놓이다 먹다 → 먹히다 팔다 → 팔리다 쫓다 → 쫓기다"],"dia":[["Jisu","말리카 씨, 도와주세요! 화장실 문이 안 열려요."],["Malika","잠깐만요. 문이 잠겼나 봐요."],["Jisu","안에서 문을 닫았는데 갑자기 잠겼어요."],["Malika","관리실에 전화할게요. 제 목소리 들려요?"]],"tr":"— Malika, yordam bering! Hojatxona eshigi ochilmayapti. — Bir daqiqa. Eshik qulflanib qolgan shekilli. — Ichkaridan eshikni yopgandim, birdan qulflanib qoldi. — Boshqaruv xonasiga qo'ng'iroq qilaman. Ovozim eshitilyaptimi?","means":[{"h":"Faol → majhul: ega o'zgaradi","ex":[["제가 문을 열었어요. → 문이 열렸어요.","Men eshikni ochdim. → Eshik ochildi."],["경찰이 도둑을 잡았어요. → 도둑이 경찰에게 잡혔어요.","Politsiya o'g'rini ushladi. → O'g'ri politsiya tomonidan ushlandi."]]},{"h":"Tabiiy, o'z-o'zidan bo'ladigan holat","ex":[["창밖으로 산이 보여요.","Derazadan tog' ko'rinadi."],["옆집에서 음악 소리가 들려요.","Qo'shnidan musiqa ovozi eshitiladi."],["전화가 갑자기 끊겼어요.","Telefon birdan uzilib qoldi."]]},{"h":"Harakat bajaruvchisi: N에게/한테 (odam), N에 (narsa)","ex":[["아이가 엄마에게 안겼어요.","Bola onasining quchog'iga olindi."],["모기에 물렸어요.","Chivin chaqdi."]]},{"h":"Boshqa fe'llar: -아/어지다","ex":[["이 다리는 100년 전에 만들어졌어요.","Bu ko'prik 100 yil oldin qurilgan."],["글씨가 지워졌어요.","Yozuv o'chib ketdi."]]}],"dq":["Har bir fe'lning qo'shimchasi alohida yodlanadi.","Majhul fe'lda to'ldiruvchi (을/를) bo'lmaydi: 문을 열렸어요 ✗ → 문이 열렸어요 ✓","보이다/먹이다 kabi ba'zi so'zlar ham majhul, ham orttirma bo'lishi mumkin (55-dars)."],"conv":[["Aziz","이 책 잘 팔려요?"],["Sardor","네 qladi."]]}],"dq":["Har bir fe'lning qo'shimchasi alohida yodlanadi.","먹이다 (yedirmoq, o'zi bevosita) ≠ 먹게 하다 (yeyishiga yo'l qo'ymoq/majbur qilmoq).","보이다 \"ko'rinmoq\" (majhul) va \"ko'rsatmoq\" (orttirma) bo'lishi mumkin: 사진을 보여 주세 요 (ko'rsating)."],"conv":[["Jasur","이 영화 어때요?"],["Jisu","정말 웃겨요. 계속 웃었어요."],["Aziz","아이가 왜 울어요?"],["Sardor","형이 장난을 쳐서 울렸어요."]],"ex":[{"ins":"Qavsdagi fe'lni orttirma shaklga keltiring.","nam":"엄마가 아기를 재웠어요. (자다)","words":"","items":["아침 7시에 저를 좀 __________ 주세요. (깨다)","아이에게 신발을 __________. (신다)","제 친구는 사람들을 잘 __________. (웃다)","여권을 __________ 주세요. (보다)","이 사실을 모두에게 __________ 주세요. (알다)"],"ans":["깨워","신겨요 (신겼어요)","웃겨요","보여","알려"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["아버지가 아이를 자전거에 (탔어요 / 태웠어요).","물이 (끓으면 / 끓이면) 라면을 넣으세요.","간호사가 환자를 의자에 (앉았어요 / 앉혔어요)."],"ans":["태웠어요","끓으면","앉혔어요"]},{"ins":"Bolaga qanday g'amxo'rlik qilasiz? Orttirma fe'l bilan yozing.","nam":"아이를 씻기고 잠옷을 입혀요.","words":"","items":[],"ans":[]}]}];

<script>
{
let S={name:'',done:{},texts:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('kr55')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('kr55',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[\s.?!,~]/g,'');
const HAN=/[가-힣]/g;
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function shuf(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[✓✗×]/g,''));u.lang='ko-KR';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const pad=n=>String(n).padStart(2,'0');

// build model
L.forEach(o=>{
  const r=rng(o.n*131+7);
  o.words=(VOC[o.n]||'').split(';').filter(Boolean).map(x=>{const [ko,uz]=x.split('|');return{ko,uz}});
  o.vmc=shuf(o.words,r).slice(0,6).map(w=>({p:w.uz,a:w.ko,o:shuf([w.ko,...shuf(o.words.filter(x=>x!==w),r).slice(0,2).map(x=>x.ko)],r)}));
  const exs=o.means.flatMap(m=>m.ex).filter(e=>e[1]&&!/[✓✗]/.test(e[0]));
  o.tr=shuf(exs,r).slice(0,5).map(e=>({p:e[0],a:e[1],o:shuf([e[1],...shuf(exs.filter(x=>x!==e),r).slice(0,2).map(x=>x[1])],r)}));
  const [e1,e2,e3]=o.ex;
  o.e1=e1.items.map((it,i)=>{const a=e1.ans[i]||'';const m=a.match(/^(.*?)\s*\(([^)]*)\)\s*$/);const alts=m?[m[1],m[2]]:[a];return{q:it,alts,a:alts[0]}});
  o.e2=e2.items.map((it,i)=>{const a=e2.ans[i]||'';
    if(/\(\s*\)\s*$/.test(it)){const v=a.trim()[0]==='X'?'X':'O';return{t:'ox',q:it.replace(/\(\s*\)\s*$/,'').trim(),a:v,why:a.replace(/^[OX]\s*/,'').replace(/^\(|\)$/g,'')}}
    const m=it.match(/\(([^()]+\/[^()]+)\)/);const opts=m?m[1].split('/').map(x=>x.trim()):[];
    let hit=opts.find(x=>x===a.trim())||opts.find(x=>norm(x)===norm(a));
    if(!hit){const c=opts.filter(x=>norm(a).endsWith(norm(x))||norm(a).startsWith(norm(x)));c.sort((x,y)=>y.length-x.length);hit=c[0]}
    return{t:'ch',q:it.replace(m?m[0]:'','( ___ )'),opts,a:hit||opts[0]}});
  if(e3.ans.length){o.e3={t:'build',ins:e3.ins,words:e3.words,items:e3.ans.map(s=>({s,t:shuf(s.split(' '),r)}))}}
  else{let n=e3.items.length;if(!n){const m=e3.ins.match(/(\d+)\s*ta/);n=m?+m[1]:3}
    o.e3={t:'free',ins:e3.ins,nam:e3.nam,items:e3.items.length?e3.items:Array.from({length:n},(_,i)=>(i+1)+'-gap')}}
  o.tasks={vm:o.words.length,vq:o.vmc.length,e1:o.e1.length,e2:o.e2.length,e3:o.e3.items.length,tr:o.tr.length};
});
const NT=6,TOTAL=L.length*NT;
const k=(o,t,i)=>`${o.n}-${t}-${i}`;
const isDone=(o,t,i)=>!!S.done[k(o,t,i)];
const taskDone=(o,t)=>{for(let i=0;i<o.tasks[t];i++)if(!isDone(o,t,i))return false;return true};
const cnt=o=>Object.keys(o.tasks).filter(t=>taskDone(o,t)).length;
const all=()=>L.reduce((s,o)=>s+cnt(o),0);
function mark(o,t,i){S.done[k(o,t,i)]=1;save();refresh(o)}
const st=(o,t)=>{const n=o.tasks[t];let d=0;for(let i=0;i<n;i++)if(isDone(o,t,i))d++;return`<span class="st ${d===n?'done':''}" data-st="${o.n}|${t}">${d===n?'✓ Bajarildi':d+' / '+n}</span>`};
function refresh(o){document.querySelectorAll('[data-st]').forEach(el=>{const [n,t]=el.dataset.st.split('|');const tmp=document.createElement('div');tmp.innerHTML=st(L[n-1],t);el.replaceWith(tmp.firstChild)});
  const m=document.getElementById('uprog');if(m)m.textContent=`${cnt(o)} / ${NT} topshiriq bajarildi`}

const head=document.getElementById('head'),app=document.getElementById('app');
function home(){
  head.innerHTML=`<h1>Koreys tili · 55 grammatika <small>한국어 문법</small></h1><p>TOPIK II · KIIP o‘rta bosqich · Qoida, lug‘at va mashqlar</p><p style="font-weight:800">Tuzuvchi: Iroda Normatova · @with_iroda</p>`;
  const c=all();let h=`<div class="card"><label class="h" for="nm">Ismingiz</label><input type="text" id="nm" placeholder="Ismingizni yozing" value="${esc(S.name)}">
  <div class="bar"><i style="width:${c/TOTAL*100}%"></i></div><div class="meta">Umumiy natija: ${c} / ${TOTAL} topshiriq</div></div>`;
  for(let g=0;g<L.length;g+=5){h+=`<div class="sec">${g+1}–${Math.min(g+5,L.length)}-darslar</div>`;
    h+=L.slice(g,g+5).map(o=>{const d=cnt(o);return`<button class="card les" data-n="${o.n}"><span class="num ${d===NT?'done':''}">${pad(o.n)}</span><span style="flex:1">
    <span class="tg ko">${esc(o.tag)}</span><br><span class="uz">${esc(o.uz)}</span><span class="bar"><i style="width:${d/NT*100}%"></i></span><span class="meta">${d} / ${NT} topshiriq</span></span></button>`}).join('')}
  h+=`<div id="sendbox"></div>`;
  h+=`<div style="text-align:center"><button class="reset" id="rs">Natijalarni tozalash</button></div>`;
  app.innerHTML=h;
  const drawH=()=>{const sb=document.getElementById('sendbox');const t=allReport();sb.innerHTML=sendCard(t);bindSend(sb,t)};drawH();
  document.getElementById('nm').oninput=e=>{S.name=e.target.value;save();clearTimeout(window._nt);window._nt=setTimeout(drawH,500)};
  app.querySelectorAll('.les').forEach(b=>b.onclick=()=>location.hash='l'+b.dataset.n+'-rule');
  const rs=document.getElementById('rs');let armed=false;
  rs.onclick=()=>{if(!armed){armed=true;rs.textContent='Ishonchingiz komilmi? Yana bir marta bosing';return}S.done={};S.texts={};save();home()};
}
function lesson(n,tab){
  const o=L[n-1];if(!o){home();return}
  head.innerHTML=`<div class="nav"><button class="pill" id="bk">← Barcha darslar</button>${n>1?`<button class="pill" data-go="${n-1}">‹ ${n-1}</button>`:''}${n<L.length?`<button class="pill" data-go="${n+1}">${n+1} ›</button>`:''}</div>
  <h1>${pad(n)} · <span class="ko">${esc(o.tag)}</span></h1><p>${esc(o.uz)}</p><p id="uprog" style="opacity:.85">${cnt(o)} / ${NT} topshiriq bajarildi</p>`;
  document.getElementById('bk').onclick=()=>location.hash='';
  head.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash='l'+b.dataset.go+'-'+tab);
  app.innerHTML=`<div class="tabs">${[['rule','Qoida'],['vocab','Lug‘at'],['ex','Mashqlar']].map(([t,l])=>`<button class="tab ${tab===t?'on':''}" data-t="${t}">${l}</button>`).join('')}</div><div id="body"></div>`;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>location.hash='l'+n+'-'+b.dataset.t);
  const body=document.getElementById('body');
  ({rule,vocab,ex})[tab](o,body);
  body.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  window.scrollTo(0,0);
}
const sayK=t=>`<button class="say ko" data-say="${esc(t)}">${esc(t)}</button>`;
function fmtForm(l){return esc(l).replace(/ (?=\S+ →)/g,' · ')}
function rule(o,body){
  const isP=l=>(l.match(/[a-z']{3,}/g)||[]).length>=3&&!l.includes('→');const prose=o.form.filter(isP),tbl=o.form.filter(l=>!isP(l));
  body.innerHTML=`<div class="card"><div class="ins">Kirish suhbati — gapni bosing, talaffuzini eshitasiz.</div>
  <div class="big ko">${sayK(o.title)}</div>
  <div class="rule">${esc(prose.join(' '))}<div class="form ko">${tbl.map((l,i)=>`<div class="${i===0?'fh':''}">${fmtForm(l)}</div>`).join('')}</div></div>
  <div class="dl">${o.dia.map(([s,t])=>`<span class="sp">${esc(s)}</span>${sayK(t)}`).join('')}</div>
  ${o.tr?`<details><summary>O‘zbekcha tarjima</summary><p>${esc(o.tr)}</p></details>`:''}</div>
  <div class="card"><h3>Ma’nolari va qoidalari</h3>
  ${o.means.map((m,i)=>`<div class="mh">${i+1}. ${esc(m.h)}</div>${m.ex.map(e=>`<div class="ex"><div class="k">${sayK(e[0])}</div>${e[1]?`<div class="u">${esc(e[1])}</div>`:''}</div>`).join('')}`).join('')}</div>
  ${o.dq.length?`<div class="card warn"><b>⚠ Diqqat!</b><ul>${o.dq.map(d=>`<li class="ko">${esc(d)}</li>`).join('')}</ul></div>`:''}
  ${o.conv.length?`<div class="card"><h3>Suhbatlarda</h3><div class="ins">Kundalik hayotdan qisqa suhbatlar.</div>${chunk(o.conv).map(g=>`<div class="conv dl">${g.map(([s,t])=>`<span class="sp">${esc(s)}</span>${sayK(t)}`).join('')}</div>`).join('')}</div>`:''}
  <button class="btn next" id="nx">Keyingisi: Lug‘at →</button>`;
  document.getElementById('nx').onclick=()=>location.hash='l'+o.n+'-vocab';
}
function chunk(c){const g=[];for(let i=0;i<c.length;i+=2)g.push(c.slice(i,i+2));return g}
function mcQ(o,t,i,num,prompt,opts,ans,cls=''){const done=isDone(o,t,i);
  return`<div class="q" data-mc="${t}|${i}" data-a="${esc(ans)}"><div class="p ko"><b>${num}</b>${esc(prompt)}</div><div class="opts ${cls}">${opts.map(x=>`<button class="opt ko ${done&&x===ans?'ok':''}">${esc(x)}</button>`).join('')}</div><div class="fb"></div></div>`}
function fillQ(o,t,i,prompt){const done=isDone(o,t,i);
  return`<div class="q" data-fill="${t}|${i}"><div class="p ko"><b>${i+1}</b>${esc(prompt)}</div>
  <div class="row"><input type="text" class="ko ${done?'ok':''}" aria-label="Javob" placeholder="Javob" autocomplete="off" spellcheck="false" value="${done?esc(o.e1[i].a):''}"><button class="btn">Tekshirish</button><button class="btn o">Yordam</button></div><div class="fb ${done?'g':''}">${done?'✓ To‘g‘ri':''}</div></div>`}
function bindMC(o,root,why){
  root.querySelectorAll('[data-mc]').forEach(q=>{const [t,i]=q.dataset.mc.split('|');const a=q.dataset.a,fb=q.querySelector('.fb');
    q.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{q.querySelectorAll('.opt').forEach(x=>x.classList.remove('bad'));
      if(b.textContent===a){b.classList.add('ok');mark(o,t,+i);const w=why&&why(t,+i);fb.className='fb g';fb.textContent='✓ To‘g‘ri'+(w?' — '+w:'');if(/[가-힣]/.test(a))speak(a)}
      else{b.classList.add('bad');fb.className='fb r';fb.textContent='✗ Yana urinib ko‘ring'}})});
}
function vocab(o,body){
  const r=rng(o.n*17);const stages=[o.words.slice(0,4).map((w,j)=>({...w,i:j})),o.words.slice(4).map((w,j)=>({...w,i:j+4}))].filter(s=>s.length);
  body.innerHTML=`<div class="card"><h3>So‘zlar banki</h3><div class="ins">So‘zni bosing — talaffuzini eshitasiz.</div>
  <div class="bank">${o.words.map(w=>`<button class="w" data-say="${esc(w.ko)}"><b>${esc(w.ko)}</b><span>${esc(w.uz)}</span></button>`).join('')}</div></div>
  <div class="card"><h3>So‘z va ma’nosini juftlang ${st(o,'vm')}</h3><div class="ins">Chapdan koreyscha so‘zni, o‘ngdan ma’nosini bosing.</div>
  ${stages.map((g,si)=>`<div class="stage">${si+1}-bosqich / ${stages.length}</div><div class="mt" data-stage><div>${shuf(g,r).map(w=>`<button class="mb ko ${isDone(o,'vm',w.i)?'ok':''}" data-l="${w.i}">${esc(w.ko)}</button>`).join('')}</div><div>${shuf(g,r).map(w=>`<button class="mb ${isDone(o,'vm',w.i)?'ok':''}" data-r="${w.i}">${esc(w.uz)}</button>`).join('')}</div></div>`).join('')}</div>
  <div class="card"><h3>O‘zbekchaga mos so‘z ${st(o,'vq')}</h3><div class="ins">To‘g‘ri koreyscha so‘zni tanlang.</div>
  ${o.vmc.map((q,i)=>mcQ(o,'vq',i,i+1,q.p,q.o,q.a,'h')).join('')}</div>
  <button class="btn next" id="nx">Keyingisi: Mashqlar →</button>`;
  body.querySelectorAll('[data-stage]').forEach(m=>{let sel=null;
    m.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;m.querySelectorAll('[data-l]').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');speak(b.textContent)});
    m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(!sel||b.classList.contains('ok'))return;
      if(sel.dataset.l===b.dataset.r){sel.classList.remove('sel');sel.classList.add('ok');b.classList.add('ok');mark(o,'vm',+b.dataset.r);sel=null}
      else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),600)}})});
  bindMC(o,body);
  document.getElementById('nx').onclick=()=>location.hash='l'+o.n+'-ex';
}
function ex(o,body){
  const [e1,e2]=o.ex,E3=o.e3;
  body.innerHTML=`<div class="card"><h3>1-mashq ${st(o,'e1')}</h3><div class="ins ko">${esc(e1.ins)}</div>
  ${e1.nam?`<div class="nam ko"><b>Namuna</b> ${esc(e1.nam)}</div>`:''}
  ${o.e1.map((q,i)=>fillQ(o,'e1',i,q.q)).join('')}</div>
  <div class="card"><h3>2-mashq ${st(o,'e2')}</h3><div class="ins ko">${esc(e2.ins)}</div>
  ${o.e2.map((q,i)=>q.t==='ox'?mcQ(o,'e2',i,i+1,q.q,['O','X'],q.a,'h'):mcQ(o,'e2',i,i+1,q.q,q.opts,q.a,'h')).join('')}</div>
  <div class="card"><h3>3-mashq ${st(o,'e3')}</h3><div class="ins ko">${esc(E3.ins)}</div>
  ${E3.t==='build'?`${E3.words?`<div class="nam ko">${esc(E3.words)}</div>`:''}${E3.items.map((b,i)=>`<div class="q" data-build="${i}"><div class="p"><b>${i+1}</b>So‘zlarni tartib bilan bosing</div>
    <div class="zone">${isDone(o,'e3',i)?b.s.split(' ').map(w=>`<span class="tok">${esc(w)}</span>`).join(''):''}</div>
    <div class="row" style="margin-bottom:8px">${b.t.map((w,j)=>`<button class="tok ${isDone(o,'e3',i)?'used':''}" data-j="${j}">${esc(w)}</button>`).join('')}</div>
    <div class="row"><button class="btn">Tekshirish</button><button class="btn o">Tozalash</button></div><div class="fb ${isDone(o,'e3',i)?'g':''}">${isDone(o,'e3',i)?'✓ To‘g‘ri':''}</div></div>`).join('')}`
  :`${E3.nam?`<div class="nam ko"><b>Namuna</b> ${esc(E3.nam)}</div>`:''}${E3.items.map((it,i)=>`<div class="q" data-free="${i}"><div class="p ko"><b>${i+1}</b>${esc(it)}</div><textarea class="ko" placeholder="Koreys tilida yozing…">${esc((S.texts[o.n]||[])[i]||'')}</textarea><div class="fb"></div></div>`).join('')}
    <div class="meta">Bu erkin mashq: javobingiz shu qurilmada saqlanadi. Kamida 5 ta koreyscha bo‘g‘in yozsangiz, bajarilgan hisoblanadi. Pastdagi «Ustozga yuborish» orqali ustozingizga tekshirtiring.</div>`}</div>
  <div class="card"><h3>Tarjima testi ${st(o,'tr')}</h3><div class="ins">Koreyscha gapning to‘g‘ri tarjimasini tanlang (darsdagi misollar).</div>
  ${o.tr.map((q,i)=>mcQ(o,'tr',i,i+1,q.p,q.o,q.a)).join('')}</div>
  <div id="sendbox"></div>
  ${o.n<L.length?`<button class="btn next" id="nx">Keyingi dars: ${o.n+1} →</button>`:`<button class="btn next" id="nx">← Barcha darslar</button>`}`;
  body.querySelectorAll('[data-fill]').forEach(q=>{const i=+q.dataset.fill.split('|')[1],it=o.e1[i];
    const inp=q.querySelector('input'),fb=q.querySelector('.fb'),[chk,help]=q.querySelectorAll('.btn');
    const check=()=>{const v=norm(inp.value);if(!v)return;const okk=it.alts.some(a=>norm(a)===v);
      inp.classList.toggle('ok',okk);inp.classList.toggle('bad',!okk);fb.className='fb '+(okk?'g':'r');fb.textContent=okk?'✓ To‘g‘ri':'✗ Yana urinib ko‘ring';
      if(okk){mark(o,'e1',i);speak(it.q.replace(/_+/,it.a).replace(/\([^)]*\)\s*$/,''))}};
    chk.onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
    help.onclick=()=>{fb.className='fb';fb.innerHTML='Javob: <b class="ko">'+esc(it.alts.join(' / '))+'</b>'}});
  bindMC(o,body,(t,i)=>t==='e2'&&o.e2[i].t==='ox'&&o.e2[i].why?o.e2[i].why:'');
  body.querySelectorAll('[data-build]').forEach(q=>{const i=+q.dataset.build,b=E3.items[i],zone=q.querySelector('.zone'),fb=q.querySelector('.fb');const [chk,clr]=q.querySelectorAll('.btn');
    q.querySelectorAll('[data-j]').forEach(t=>t.onclick=()=>{if(t.classList.contains('used'))return;t.classList.add('used');const s=document.createElement('button');s.className='tok';s.textContent=t.textContent;s.onclick=()=>{s.remove();t.classList.remove('used')};zone.appendChild(s)});
    chk.onclick=()=>{const v=[...zone.children].map(x=>x.textContent).join(' ');const okk=norm(v)===norm(b.s);fb.className='fb '+(okk?'g':'r');fb.textContent=okk?'✓ To‘g‘ri':'✗ Tartib noto‘g‘ri, qayta urinib ko‘ring';if(okk){mark(o,'e3',i);speak(b.s)}};
    clr.onclick=()=>{zone.innerHTML='';q.querySelectorAll('[data-j]').forEach(t=>t.classList.remove('used'));fb.textContent=''}});
  body.querySelectorAll('[data-free]').forEach(q=>{const i=+q.dataset.free,ta=q.querySelector('textarea'),fb=q.querySelector('.fb');
    const upd=()=>{S.texts[o.n]=S.texts[o.n]||[];S.texts[o.n][i]=ta.value;save();const n=(ta.value.match(HAN)||[]).length;
      if(n>=5){fb.className='fb g';fb.textContent='✓ Saqlandi';if(!isDone(o,'e3',i))mark(o,'e3',i)}else{fb.textContent=''}};
    ta.oninput=upd;if(ta.value)upd()});
  const drawSend=()=>{const sb=document.getElementById('sendbox');if(!sb)return;const t=lessonReport(o);sb.innerHTML=sendCard(t);bindSend(sb,t)};drawSend();
  body.addEventListener('click',e=>{if(!e.target.closest('#sendbox'))setTimeout(drawSend,50)});body.addEventListener('input',()=>{clearTimeout(body._t);body._t=setTimeout(drawSend,600)});
  document.getElementById('nx').onclick=()=>location.hash=o.n<L.length?'l'+(o.n+1)+'-rule':'';
}
const TN={vm:'Lug‘at: juftlash',vq:'Lug‘at: test',e1:'1-mashq',e2:'2-mashq',e3:'3-mashq',tr:'Tarjima testi'};
function lessonReport(o){const lines=Object.keys(o.tasks).map(t=>{const n=o.tasks[t];let d=0;for(let i=0;i<n;i++)if(isDone(o,t,i))d++;return`${d===n?'✅':'▫️'} ${TN[t]}: ${d}/${n}`});
  const tx=(S.texts[o.n]||[]).filter(x=>x&&x.trim());
  return`👤 ${S.name||'(ism yozilmagan)'}\n📘 ${pad(o.n)}-dars · ${o.tag}\nNatija: ${cnt(o)} / ${NT} topshiriq\n${lines.join('\n')}`+(tx.length?`\n\n✍️ 3-mashq javoblarim:\n${tx.map((x,i)=>`${i+1}. ${x.trim()}`).join('\n')}`:'')}
function allReport(){const done=L.filter(o=>cnt(o)>0);
  return`👤 ${S.name||'(ism yozilmagan)'}\n📚 Koreys tili · 55 grammatika\nUmumiy natija: ${all()} / ${TOTAL} topshiriq\n\n`+(done.length?done.map(o=>`${cnt(o)===NT?'✅':'🔸'} ${pad(o.n)} ${o.tag} — ${cnt(o)}/${NT}`).join('\n'):'Hali birorta dars boshlanmagan.')}
function sendCard(txt){return`<div class="card send"><h3>📤 Ustozga yuborish</h3><div class="ins">Natijangiz va yozgan gaplaringiz tayyor. Telegram orqali ustozingizga yuboring yoki nusxa olib, o‘zingiz jo‘nating.</div>
  ${S.name?'':'<div class="fb r" style="margin-bottom:8px">Avval bosh sahifada ismingizni yozing — ustoz kim yuborganini bilishi uchun.</div>'}
  <pre>${esc(txt)}</pre><div class="row"><a class="btn tgb" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(location.href.split('#')[0])}&text=${encodeURIComponent(txt)}">Telegram orqali yuborish</a><button class="btn o" data-copy>📋 Nusxa olish</button></div><div class="meta" data-cpm></div></div>`}
function bindSend(root,txt){root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const m=root.querySelector('[data-cpm]');
  try{navigator.clipboard.writeText(txt).then(()=>m.textContent='✓ Nusxa olindi! Endi Telegram’da ustozingizga yuboring.',()=>m.textContent='Nusxa olinmadi — yuqoridagi matnni belgilab, o‘zingiz nusxalang.')}catch(e){m.textContent='Nusxa olinmadi — matnni belgilab nusxalang.'}})}
function route(){const m=location.hash.match(/^#l(\d+)-(rule|vocab|ex)$/);if(m)lesson(+m[1],m[2]);else home()}
window.addEventListener('hashchange',route);route();
}
</script>
</body>
