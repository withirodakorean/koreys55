<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koreys tili · 55 grammatika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, patient Korean workbook in Uzbek — the teacher's own book made interactive
   IDEA: each grammar lesson as a tear-off worksheet: rule card, word cards, exercises with answers
   PICTURE: the lesson list itself, numbered badges like the book's orange circles
   COLOUR and TYPE: teal (book's accent) + orange number badges; Nunito + Noto Sans KR
   LAYOUT: single 760px column, three tabs per lesson, stacks naturally on phones */
:root{color-scheme:light dark;
--bg:light-dark(#f3f6f6,#0f1618);--card:light-dark(#fff,#172024);--ink:light-dark(#1d2a2e,#e6eef0);
--mute:light-dark(#62737a,#94a6ad);--line:light-dark(#e0e8ea,#28363b);--blue:#178a8f;--blue2:light-dark(#e3f3f3,#16343a);
--or:#f08a3c;--ok:#16a34a;--okbg:light-dark(#e8f7ee,#123222);--bad:#dc2626;--badbg:light-dark(#fdecec,#3a1717);--warn:light-dark(#fff4e5,#3a2a14)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,"Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.ko{font-family:"Noto Sans KR",Nunito,sans-serif}
header{background:var(--blue);color:#fff;padding:24px max(5vw,16px) 26px}
.wrap{max-width:760px;margin:0 auto}
header h1{margin:0;font-size:clamp(23px,4.4vw,31px);line-height:1.2;font-weight:800;text-wrap:balance}
header h1 small{font-weight:600;font-size:.6em;opacity:.9}
header p{margin:6px 0 0;opacity:.92}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:99px;padding:8px 14px;font:700 14px Nunito,sans-serif;cursor:pointer;min-height:36px}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,40,50,.08)}
label.h{font-weight:700;display:block;margin-bottom:8px}
input[type=text],textarea{width:100%;font:16px Nunito,"Noto Sans KR",sans-serif;padding:11px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:46px}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--blue)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.meta{color:var(--mute);font-size:14px}
.sec{font-weight:800;color:var(--mute);font-size:14px;margin:22px 4px 8px}
.les{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit;margin-bottom:10px;padding:14px 16px}
.les:hover{box-shadow:0 4px 14px rgba(20,40,50,.12)}
.num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--or);color:#fff;font-weight:800;display:grid;place-items:center;font-size:16px}
.num.done{background:var(--ok)}
.les .tg{font-weight:700;font-size:17px;line-height:1.3}
.les .uz{color:var(--mute);font-size:14px}
.les .bar{margin:8px 0 0;height:6px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.tab{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:10px;font:800 15px Nunito,sans-serif;cursor:pointer;min-height:44px}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
h3{margin:0 0 2px;font-size:19px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
h3 .st{font-size:13px;color:var(--mute);font-weight:700;white-space:nowrap}
h3 .st.done{color:var(--ok)}
.ins{font-style:italic;color:var(--mute);font-size:14px;margin-bottom:12px}
.big{font-size:22px;font-weight:700;margin:2px 0 10px;line-height:1.4}
.rule{background:var(--blue2);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.form{display:grid;gap:4px;margin-top:8px;font-size:15px}
.form .fh{font-weight:800;color:var(--blue)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:baseline;margin:8px 0}
.dl .sp{font-weight:800;color:#d9534f;font-size:14px;white-space:nowrap}
.say{border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer}
.say:hover{color:var(--blue)}
.conv{border:2px dashed var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px}
details summary{cursor:pointer;color:var(--blue);font-weight:800;margin-top:8px}
details p{color:var(--mute);font-size:15px;margin:6px 0}
.mh{font-weight:800;margin:14px 0 6px}
.ex{padding:6px 0 6px 12px;border-left:3px solid var(--blue2);margin-bottom:6px}
.ex .k{font-size:16.5px}.ex .u{color:var(--mute);font-size:14px}
.warn{background:var(--warn);border:1px solid #f3c58f;border-radius:12px;padding:12px 14px}
.warn b{color:#c2410c}.warn li{margin:4px 0}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.w{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 8px;cursor:pointer;text-align:center;font:inherit;min-height:64px}
.w b{display:block;font-size:17px;font-family:"Noto Sans KR",sans-serif}.w span{font-size:13px;color:var(--mute);display:block;margin-top:2px}
.w:hover{border-color:var(--blue)}
.q{border-top:1px solid var(--line);padding:12px 0 4px}
.q .p{margin-bottom:8px;font-size:16.5px}.q .p b{color:var(--blue);margin-right:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1 1 180px}
.btn{border:2px solid var(--blue);background:var(--blue);color:#fff;border-radius:10px;padding:0 16px;font:800 15px Nunito,sans-serif;cursor:pointer;min-height:46px}
.btn.o{background:var(--card);color:var(--blue)}
.opts{display:grid;gap:8px}.opts.h{display:flex;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;text-align:left;font:16px Nunito,"Noto Sans KR",sans-serif;cursor:pointer;min-height:46px}
.opts.h .opt{min-width:90px;text-align:center}
.opt:hover{border-color:var(--blue)}
.ok{border-color:var(--ok)!important;background:var(--okbg)!important}
.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.fb{font-size:14px;margin-top:6px}.fb.g{color:var(--ok)}.fb.r{color:var(--bad)}
.nam{background:var(--blue2);border-radius:10px;padding:8px 12px;font-size:15px;margin-bottom:6px}
.nam b{color:var(--blue)}
.stage{font-weight:800;font-size:13px;color:var(--mute);margin:14px 0 6px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mt div{display:grid;gap:8px;align-content:start}
.mb{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 10px;font:15px Nunito,"Noto Sans KR",sans-serif;cursor:pointer;min-height:44px;text-align:center}
.mb.sel{border-color:var(--blue);background:var(--blue2)}.mb.ok{opacity:.55;cursor:default}
.zone{min-height:50px;border:2px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tok{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 11px;font:16px "Noto Sans KR",sans-serif;cursor:pointer;min-height:40px}
.zone .tok{border-color:var(--blue);background:var(--blue2)}.tok.used{visibility:hidden}
.next{display:block;width:100%;margin-top:6px}
.send{border:2px solid var(--blue)}.send .row{margin-top:10px}.tgb{background:#229ED9;border-color:#229ED9;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.send pre{white-space:pre-wrap;background:var(--blue2);border-radius:10px;padding:10px 12px;font:14px/1.5 Nunito,'Noto Sans KR',sans-serif;max-height:220px;overflow:auto}
footer{text-align:center;color:var(--mute);font-size:14px;padding:0 16px 30px}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:14px Nunito,sans-serif;margin-top:6px}
@media(max-width:480px){.row input{flex-basis:100%}.q .row .btn{flex:1}.bank{grid-template-columns:1fr 1fr}.mb{font-size:14px;padding:8px 6px}}
</style>
</head>
<body>
<header><div class="wrap" id="head"></div></header>
<main id="app"></main>
<footer><b>Tuzuvchi: Iroda Normatova</b> · Instagram: @with_iroda<br>«55 한국어 문법 · Koreys tili grammatikasi»</footer>
<script>
const L=[{"n":1,"title":"드라마를 보다가 잠이 들었어요","tag":"A/V-다가","uz":"...-ayotib (harakat to'xtab, boshqasiga o'tish)","form":["-다가 bir harakat yoki holat to'xtab, boshqasiga o'tganini bildiradi. O'zbekchada: \"...-ayotib\", \"...-","ib turib\", \"...-ayotganda\".","A-다가 V-다가 V-았/었다가","맑다 → 맑다가 보다 → 보다가 가다 → 갔다가","조용하다 → 조용하다가 읽다 → 읽다가 입다 → 입었다가"],"dia":[["Malika","지수 씨, 어제 왜 전화 안 받았어요?"],["Jisu","미안해요. 소파에서 드라마를 보다가 잠이 들었어요."],["Malika","그랬구나. 저는 걱정했어요."],["Jisu","아침에 답장을 쓰다가 버스가 와서 못 보냈어요."]],"tr":"— Kecha nega telefonni olmadingiz? — Kechirasiz, divanda serial ko'rayotib uxlab qolibman. — Shunaqami, men xavotir oldim. — Ertalab javob yozayotgandim, avtobus kelib qolib yubora olmadim.","means":[{"h":"Harakat yoki holat to'xtab, boshqasiga o'tadi","ex":[["책을 읽다가 커피를 마셨어요.","Kitob o'qiyotib, kofe ichdim."],["날씨가 맑다가 갑자기 흐려졌어요.","Havo ochiq edi-yu, birdan bulut bosdi."]]},{"h":"Harakat davomida kutilmagan narsa sodir bo'ladi","ex":[["학교에 가다가 옛날 친구를 만났어요.","Maktabga ketayotib eski do'stimni uchratdim."],["요리를 하다가 문득 엄마 생각이 났어요.","Ovqat qilayotib birdan onam esimga tushdi."]]},{"h":"Oldingi harakat keyingi (ko'pincha salbiy) natijaga sabab bo'ladi","ex":[["휴대폰을 보면서 걷다가 부딪쳤어요.","Telefonga qarab yurayotib urilib ketdim."],["칼로 양파를 자르다가 손을 베었어요.","Piyoz to'g'rayotib qo'limni kesib oldim."]]},{"h":"Ikki holat almashinib takrorlanadi: -다가 -다가 하다","ex":[["아기가 울다가 웃다가 해요.","Chaqaloq goh yig'laydi, goh kuladi."],["불이 켜졌다가 꺼졌다가 했어요.","Chiroq goh yonib, goh o'chib turdi."]]},{"h":"-았/었다가: birinchi harakat tugagach, boshqasi bo'ladi","ex":[["창문을 열었다가 추워서 다시 닫았어요.","Derazani ochdim, sovuq bo'lgani uchun yopdim."],["은행에 갔다가 문이 닫혀 있어서 그냥 왔어요.","Bankka bordim, yopiq ekan, qaytdim."]]}],"dq":["Fe'l bilan kelganda ikki qismning egasi bir xil bo'ladi: 제가 자다가 동생이 전화했어요. ✗ → 제가 자는데 동생이 전화했어요. ✓","버스를 타다가 = chiqayotib (jarayonda) ≠ 버스를 탔다가 = chiqib olib, keyin"],"conv":[["Jasur","다리가 왜 그래요?"],["Aziz","어제 축구를 하다가 다쳤어요."],["Dilnoza","숙제 다 했어?"],["Sardor","아니. 하다가 너무 졸려서 잤어."],["O'qituvchi","왜 늦었어요?"],["Malika","지갑을 안 가져와서 집에 갔다가 왔어요."]],"ex":[{"ins":"Qavsdagi so'zni -다가 bilan to'ldiring.","nam":"텔레비전을 보다가 전화를 받았어요. (보다)","words":"","items":["길을 __________ 지갑을 주웠어요. (걷다)","아침에는 __________ 오후에 더워졌어요. (쌀쌀하다)","설거지를 __________ 접시를 깨뜨렸어요. (하다)","한국어를 __________ 모르는 단어를 찾았어요. (공부하다)","코트를 __________ 더워서 벗었어요. (입다 — tugagan harakat)"],"ans":["걷다가","쌀쌀하다가","하다가","공부하다가","입었다가"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["밥을 먹다가 친구가 왔어요. ( )","운동을 하다가 물을 마셨어요. ( )","가게에 갔다가 우유를 사서 왔어요. ( )","하늘이 맑았다가 흐렸다가 해요. ( )"],"ans":["X (ega har xil → 밥을 먹는데 친구가 왔어요)","O","O","X (→ 맑다가 흐리다가 해요)"]},{"ins":"Rasmga qarab, berilgan so'zlardan foydalanib gap tuzing.","nam":"","words":"사과를 깎다 · 계단을 내려가다 · 라디오를 듣다 · 자전거를 타다 · 손을 다치다 · 넘어지다 · 좋아하는 노래가 나오 다 · 비가 오다","items":[],"ans":["사과를 깎다가 손을 다쳤어요.","계단을 내려가다가 넘어졌어요.","라디오를 듣다가 좋아하는 노래가 나왔어요.","자전 거를 타다가 비가 와서 버스를 탔어요."]}]},{"n":2,"title":"요즘 한국어가 많이 쉬워졌어요","tag":"A-아/어지다","uz":"...bo'lib qolmoq (holat o'zgarishi)","form":["-아/어지다 sifatga qo'shilib, holat avvalgiga nisbatan o'zgarganini bildiradi. O'zbekchada: \"...bo'lib","qoldi\", \"...lashdi\".","ㅏ, ㅗ → -아지다 boshqa → -어지다 -하다 → -해지다 Noto'g'ri","많다 → 많아지다 길다 → 길어지다 깨끗하다 → 깨끗해지다 춥다 → 추워지다 (ㅂ)","작다 → 작아지다 적다 → 적어지다 조용하다 → 조용해지다 빠르다 → 빨라지다 (르)","좋다 → 좋아지다 슬프다 → 슬퍼지다 크다 → 커지다 (ㅡ)"],"dia":[["Jasur","말리카 씨, 한국에 온 지 1년 됐죠? 요즘 어때요?"],["Malika","처음에는 힘들었는데 지금은 많이 편해졌어요."],["Jasur","한국어 실력도 늘었죠?"],["Malika","네, 듣기가 특히 쉬워졌어요. 그래서 드라마도 더 재미있어졌어요."]],"tr":"— Koreyaga kelganingizga bir yil bo'ldi-a? Hozir qalay? — Boshida qiynalgandim, hozir ancha yengil bo'lib qoldi. — Tilingiz ham oshgandir? — Ha, ayniqsa tinglash osonlashdi, serial ko'rish ham qiziqroq bo'lib qoldi.","means":[{"h":"Avvalgi holatga nisbatan o'zgarish","ex":[["작년에는 말랐는데 요즘 통통해졌어요.","O'tgan yili ozg'in edi, endi to'lishdi."],["청소를 해서 방이 깨끗해졌어요.","Yig'ishtirdim, xona toza bo'lib qoldi."]]},{"h":"Aniq o'zgarish → -아/어졌어요 · umumiy haqiqat → -아/어져요","ex":[["봄이 되면 날씨가 따뜻해져요.","Bahor kelsa havo isiydi."],["저녁이 되면 길이 복잡해져요.","Kechqurun yo'l tirband bo'ladi."]]},{"h":"Kelajakdagi o'zgarish → -아/어질 거예요","ex":[["약을 먹으면 곧 괜찮아질 거예요.","Dori ichsangiz, tez orada tuzalib qolasiz."]]},{"h":"있다 / 없다 alohida: \"paydo bo'ldi\" → 생기다, \"yo'qoldi\" → 없어지다","ex":[["한국 친구가 생겼어요. ✓ 한국 친구가 있어졌어요. ✗",""],["요리가 맛있어졌어요. ✓ 요리가 맛생겼어요. ✗",""]]}],"dq":["-아/어지다 asosan sifatlar bilan keladi. Fe'l bilan boshqa ma'no — majhul nisbat (만들어지 다 \"yasalmoq\") → 54-dars.","좋아지다 (yaxshilanmoq) ≠ 좋아하다 (yoqtirmoq): 날씨가 좋아졌어요 / 한국 음식을 좋아해요.","예쁘다 → 예뻐지다, 바쁘다 → 바빠지다 (ㅡ tushib qoladi)."],"conv":[["Aziz","사르도르 씨, 오늘도 야근해요?"],["Sardor","네, 주문이 갑자기 많아져서 일이 바빠졌어요."],["Dilnoza","도서관이 왜 이렇게 조용해졌어?"],["Jisu","시험 기간이잖아. 끝나면 다시 시끄러워질 거야."],["Malika","머리가 많이 길어졌네요!"],["Dilnoza","네, 일 년 동안 안 잘랐거든요."]],"ex":[{"ins":"Qavsdagi sifatni -아/어졌어요 shakliga keltiring.","nam":"예전에는 집이 가까웠는데 이사해서 멀어졌어요. (멀다)","words":"","items":["하숙비가 올해 더 __________. (비싸다)","낮에는 따뜻했는데 밤이 되니까 __________. (춥다)","매일 달리기를 했더니 걸음이__________. (빠르다)","아이가 작년보다 키가 많이 __________. (크다)","창문을 열었더니 공기가 __________. (상쾌하다)"],"ans":["비싸졌어요","추워졌어요","빨라졌어요","커졌어요","상쾌해졌어요"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["지난달에 고양이가 한 마리 생겼어요. ( )","월급을 받아서 돈이 있어졌어요. ( )","한국어 공부가 요즘 재미생겼어요. ( )","겨울이 되면 해가 짧아져요. ( )","아마 내일은 날씨가 좋아질 거예요. ( )"],"ans":["O","X (→ 돈이 생겼어요)","X (→ 재미있어졌어요)","O","O"]},{"ins":"Koreyaga kelganingizdan (yoki koreys tilini o'rgana boshlaganingizdan) beri nima o'zgardi? 3 ta gap yozing.","nam":"처음에는 한국 음식이 매웠는데 지금은 괜찮아졌어요.","words":"","items":[],"ans":[]}]},{"n":3,"title":"한국 생활을 오래 하면 매운 음식도 먹게 돼요","tag":"V-게 되다","uz":"...-adigan bo'lmoq","form":["-게 되다 fe'lga qo'shilib, o'z xohishidan tashqari vaziyat tufayli yoki vaqt o'tishi bilan biror holatga","kelganini bildiradi. O'zbekchada: \"...-adigan bo'ldi\", \"...-ib qoldi\".","V-게 되다 O'tgan zamon Kelasi zamon","가다 → 가게 되다 가게 됐어요 가게 될 거예요","먹다 → 먹게 되다 알게 됐어요","알다 → 알게 되다"],"dia":[["Jasur","사르도르 씨, 처음엔 김치를 못 먹었잖아요."],["Sardor","네, 그런데 회사 식당에서 매일 먹으니까 이제 잘 먹게 됐어요."],["Jasur","대단해요! 다음 달에 부산으로 이사한다면서요?"],["Sardor","네, 회사 때문에 부산에서 일하게 됐어요."]],"tr":"— Sardor, boshida kimchi yeya olmasdingiz-ku. — Ha, lekin ish joyi oshxonasida har kuni yeganim uchun endi bemalol yeydigan bo'ldim. — Zo'r! Keyingi oy Pusanga ko'char ekansiz-a? — Ha, ish sababli Pusanda ishlaydigan bo'ldim.","means":[{"h":"Vaziyat tufayli (o'z xohishi bilan emas) shunday bo'ldi","ex":[["아버지 일 때문에 한국에 오게 됐어요.","Otamning ishi sababli Koreyaga keladigan bo'ldim."],["갑자기 출장을 가게 됐어요.","Birdaniga xizmat safariga boradigan bo'ldim."]]},{"h":"Vaqt o'tib, o'rganib yoki odatlanib qolish","ex":[["매일 연습해서 수영을 하게 됐어요.","Har kuni mashq qilib, suzadigan bo'ldim."],["한국 드라마를 보고 한국 문화를 좋아하게 됐어요.","Koreys seriallarini ko'rib, madaniyatini yoqtirib qoldim."]]},{"h":"알게 되다 — bilib qolmoq","ex":[["뉴스를 보고 그 사실을 알게 됐어요.","Yangiliklarni ko'rib, bu haqiqatni bilib qoldim."]]},{"h":"Kelajakdagi reja (qaror boshqalar tomonidan) → -게 될 거예요","ex":[["다음 학기부터 장학금을 받게 될 거예요.","Keyingi semestrdan stipendiya oladigan bo'lasiz."]]}],"dq":["Sifatlar bilan odatda -아/어지다 ishlatiladi: 날씨가 춥게 됐어요. ✗ → 날씨가 추워졌어요. ✓","O'z qarori bo'lsa -기로 하다 yaxshiroq: 저는 한국에서 살기로 했어요 (o'zim qaror qildim) / 한 국에서 살게 됐어요 (vaziyat shunday bo'ldi)."],"conv":[["Dilnoza","지수 씨는 어떻게 우즈베키스탄 친구를 사귀었어요?"],["Jisu","같은 반에서 공부하면서 친해지게 됐어요."],["Aziz","요즘 왜 이렇게 바빠요?"],["Malika","다음 달부터 새 프로젝트를 맡게 됐거든요."]],"ex":[{"ins":"Qavsdagi fe'lni -게 됐어요 shakliga keltiring.","nam":"결혼해서 서울에 살게 됐어요. (살다)","words":"","items":["처음엔 싫었는데 지금은 매운 음식을 __________. (좋아하다)","회사 일로 일본에 출장을 __________. (가다)","친구 소개로 지금 남편을 __________. (만나다)","선생님 덕분에 한국어를 잘 __________. (하다)"],"ans":["좋아하게 됐어요","가게 됐어요","만나게 됐어요","하게 됐어요"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["겨울이 되니까 날씨가 (춥게 됐어요 / 추워졌어요).","열심히 연습해서 자전거를 (타게 됐어요 / 타졌어요).","청소를 해서 방이 (깨끗하게 됐어요 / 깨끗해졌어요).","아버지 일 때문에 이사를 (가게 됐어요 / 가졌어요)."],"ans":["추워졌어요","타게 됐어요","깨끗해졌어요","가게 됐어요"]},{"ins":"Koreys tilini o'rganib nima qila oladigan bo'ldingiz? -게 됐어요 bilan 3 ta gap yozing.","nam":"한국어를 배워서 한국 드라마를 자막 없이 보게 됐어요.","words":"","items":[],"ans":[]}]},{"n":4,"title":"요즘 발음 때문에 스트레스를 많이 받거든요","tag":"A/V-거든요","uz":"chunki ...-da (sabab izohi)","form":["-거든요 tinglovchi bilmaydigan sababni yoki vaziyatni tushuntirishda, shuningdek gapni boshlab,","keyin davom ettirishda ishlatiladi. O'zbekchada: \"chunki ...-da\", \"...-ganman-da\".","A/V-거든요 O'tgan zamon N(이)거든요","바쁘다 → 바쁘거든요 갔거든요 학생이거든요","가다 → 가거든요 먹었거든요 의사거든요"],"dia":[["Malika","아지즈 씨, 오늘 왜 이렇게 피곤해 보여요?"],["Aziz","어제 밤 12시까지 일했거든요."],["Malika","그래요? 오늘은 일찍 쉬세요."],["Aziz","그럴 수가 없어요. 내일 발표가 있거든요."]],"tr":"— Aziz, bugun nega bunchalik charchagan ko'rinasiz? — Kecha tungi soat 12 gacha ishladim-da. — Shunaqami? Bugun ertaroq dam oling. — Iloji yo'q. Ertaga taqdimotim bor-da.","means":[{"h":"Sababni tushuntirish (tinglovchi bilmaydi)","ex":[["오늘은 못 가요. 약속이 있거든요.","Bugun bora olmayman. Uchrashuvim bor-da."],["이 식당에 자주 와요. 음식이 맛있거든요.","Bu restoranga tez-tez kelaman. Ovqati mazali-da."]]},{"h":"Gapni boshlash: avval vaziyat, keyin asosiy gap","ex":[["제가 어제 명동에 갔거든요. 그런데 거기서 배우를 봤어요.","Kecha Myondongga borgandim. U yerda aktyorni ko'rdim."],["우리 회사에 새 직원이 왔거든요. 그 사람도 우즈베키스탄 사람이에요.","Kompaniyamizga yangi xodim keldi. U ham o'zbek ekan."]]}],"dq":["So'roq gapda ishlatilmaydi: 왜 늦었거든요? ✗","Faqat og'zaki nutqda. Rasmiy yozuvda -기 때문이다 ishlatiladi.","Tinglovchi allaqachon biladigan sabab uchun -잖아요 (5-dars) ishlatiladi."],"conv":[["Jisu","왜 우산을 가져왔어요?"],["Dilnoza","오후에 비가 온다고 했거든요."],["Sardor","왜 커피를 안 마셔요?"],["Jasur","커피를 마시면 잠이 안 오거든요."]],"ex":[{"ins":"Sababni -거든요 bilan yozing.","nam":"A: 왜 안 먹어요? B: 아까 밥을 먹었거든요. (먹다)","words":"","items":["A: 왜 택시를 타요? B: 시간이 __________. (없다)","A: 왜 한국어를 배워요? B: 한국 회사에서 __________. (일하고 싶다)","A: 왜 기분이 좋아요? B: 오늘 월급을 __________. (받다)","A: 왜 이렇게 잘해요? B: 제가 요리사__________. (이다)"],"ans":["없거든요","일하고 싶거든요","받았거든요","요리사거든요"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["어제 왜 학교에 안 왔거든요? ( )","저는 매운 음식을 못 먹어요. 위가 약하거든요. ( )","내일 못 만나요. 시험이거든요. ( )","주말에 바빴거든요. 그래서 연락을 못 했어요. ( )"],"ans":["X (so'roq gap → 왜 학교에 안 왔어요?)","O","O","O"]},{"ins":"Savollarga -거든요 bilan javob bering.","nam":"","words":"","items":["왜 한국에 왔어요? → ______________________","왜 그 옷을 샀어요? → ______________________","왜 어제 전화 안 받았어요? → ______________________"],"ans":[]}]},{"n":5,"title":"학교에서 현장학습을 가잖아요","tag":"A/V-잖아요","uz":"...-ku (ma'lum narsani eslatish)","form":["-잖아요 tinglovchi ham biladigan narsani eslatish, unga ishora qilib sabab ko'rsatish yoki yumshoq","e'tiroz bildirishda ishlatiladi. O'zbekchada: \"...-ku\", \"axir ...-ku\".","A/V-잖아요 O'tgan zamon N(이)잖아요","가다 → 가잖아요 갔잖아요 학생이잖아요","춥다 → 춥잖아요 말했잖아요 친구잖아요"],"dia":[["Sardor","딜노자, 오늘 저녁에 영화 볼래?"],["Dilnoza","안 돼. 내일 시험이잖아."],["Sardor","아, 맞다! 그럼 같이 도서관에 갈까?"],["Dilnoza","좋아. 넌 문법을 잘하잖아. 좀 가르쳐 줘."]],"tr":"— Dilnoza, bugun kechqurun kino ko'ramizmi? — Bo'lmaydi. Ertaga imtihon-ku. — Ha, to'g'ri! Unda birga kutubxonaga boramizmi? — Mayli. Sen grammatikani yaxshi bilasan-ku. Menga o'rgatib qo'y.","means":[{"h":"Ikkalasi ham biladigan narsani eslatish","ex":[["내일은 토요일이잖아요. 늦게 일어나도 돼요.","Ertaga shanba-ku. Kech tursa ham bo'ladi."],["지난번에 같이 갔잖아요. 그 식당 기억나요?","O'tgan safar birga borgandik-ku. O'sha restoran esingizdami?"]]},{"h":"Ma'lum vaziyatni sabab qilib ko'rsatish","ex":[["지금 비가 오잖아요. 우산 가져가세요.","Hozir yomg'ir yog'yapti-ku. Soyabon olib keting."],["이 길은 항상 막히잖아요. 지하철 타요.","Bu yo'l doim tirband-ku. Metroga chiqaylik."]]},{"h":"Yumshoq e'tiroz / ta'na","ex":[["그러니까 제가 일찍 오라고 했잖아요.","Shuning uchun erta kel degandim-ku."]]}],"dq":["Tinglovchi bilmaydigan yangi ma'lumot uchun ishlatilmaydi — u holda -거든요.","Kattalarga ohangsiz aytilsa qo'pol eshitilishi mumkin. Ehtiyot bo'ling."],"conv":[["Aziz","왜 이렇게 옷을 많이 입었어요?"],["Malika","밖에 바람이 많이 불잖아요."],["Jisu","이 가방 비싸지 않아요?"],["Jasur","지금 세일 기간이잖아요. 30% 싸요."]],"ex":[{"ins":"Qavsdagi so'zni -잖아요 bilan yozing.","nam":"오늘은 일찍 자요. 내일 일찍 일어나야 하잖아요. (일어나야 하다)","words":"","items":["택시 타지 마세요. 택시는 __________. (비싸다)","천천히 먹어. 시간이 많이 __________. (있다)","민수 씨한테 물어보세요. 그 사람은 __________. (선생님이다)","어제 같이 그 영화를 __________. 기억 안 나요? (보다)"],"ans":["비싸잖아요","있잖아요","선생님이잖아요","봤잖아요"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["A: 왜 안 와요? B: 미안해요. 제가 아까 문자를 (보냈잖아요 / 보냈거든요). 못 봤어요?","A: 왜 그렇게 웃어요? B: 사실 오늘 제 (생일이잖아요 / 생일이거든요).","A: 내일 몇 시에 만나요? B: 아까 3시라고 (했잖아요 / 했거든요)."],"ans":["보냈잖아요 (ikkalasi biladi)","생일이거든요 (yangi ma'lumot)","했잖아요"]},{"ins":"Do'stingizga -잖아요 bilan javob bering.","nam":"","words":"","items":["A: 오늘 운동하러 갈까? → B: ______________________","A: 이 옷 어때? → B: ______________________","A: 우리 내일 놀러 갈까? → B: ______________________"],"ans":[]}]},{"n":6,"title":"날씨가 따뜻하기는요","tag":"A/V-기는요","uz":"qayoqda, unchalik emas (kamtarlik)","form":["-기는요 maqtovga kamtarona javob berishda yoki suhbatdoshning gapini yumshoq rad etishda","ishlatiladi. O'zbekchada: \"qayoqda!\", \"qaydam...\", \"unchalik emas\".","A/V-기는요 Qisqa shakli","잘하다 → 잘하기는요 잘하긴요","예쁘다 → 예쁘기는요 예쁘긴요","먹다 → 먹기는요"],"dia":[["Jisu","말리카 씨, 한국어를 정말 잘하시네요!"],["Malika","잘하기는요. 아직 실수를 많이 해요."],["Jisu","발음도 한국 사람 같아요."],["Malika","한국 사람 같기는요. 더 열심히 해야 돼요."]],"tr":"— Malika, koreys tilida juda yaxshi gapirar ekansiz! — Qayoqda. Hali ko'p xato qilaman. — Talaffuzingiz ham koreyslarnikidek. — Qaydam koreyslarnikidek. Hali ko'p ishlashim kerak.","means":[{"h":"Maqtovga kamtarona javob","ex":[["A: 요리를 잘하시네요. B: 잘하기는요. 그냥 따라 했어요.","— Ovqatni yaxshi qilarkansiz. — Qayoqda, shunchaki takrorladim."],["A: 집이 정말 넓네요. B: 넓기는요. 혼자 살기에 딱 좋아요.","— Uyingiz juda keng ekan. — Unchalik emas, bir kishiga to'g'ri keladi."]]},{"h":"Suhbatdosh gapini rad etish","ex":[["A: 날씨가 따뜻하죠? B: 따뜻하기는요. 너무 추워요.","— Havo iliqmi? — Qayoqda iliq, juda sovuq."],["A: 많이 먹었어요? B: 많이 먹기는요. 조금밖에 안 먹었어요.","— Ko'p yedingizmi? — Qayoqda, ozgina yedim."]]}],"dq":["O'tgan zamon qo'shilmaydi: 먹었기는요 ✗ → 먹기는요 ✓ (ma'no kontekstdan tushuniladi).","Faqat javobda ishlatiladi; gap boshida o'z fikrini aytishda emas."],"conv":[["Sardor","딜노자 씨, 노래를 정말 잘하네요."],["Dilnoza","잘하기는요. 그냥 노래방에서 자주 불러요."],["Aziz","요즘 한가하죠?"],["Jasur","한가하기는요. 이사 준비 때문에 정신이 없어요."]],"ex":[{"ins":"Kamtarona javob yozing (-기는요).","nam":"A: 옷이 예쁘네요. B: 예쁘기는요. 오래된 옷이에요.","words":"","items":["A: 일이 쉽죠? B: __________. 매일 야근해요.","A: 한국어 시험 잘 봤어요? B: __________. 많이 틀렸어요.","A: 키가 크시네요. B: __________. 우리 가족 중에서 제일 작아요.","A: 아이가 착하네요. B: __________. 집에서는 말을 잘 안 들어요."],"ans":["쉽기는요","잘 보기는요","크기는요","착하기는요"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["A: 바쁘죠? B: 바쁘기는요. 요즘 좀 한가해요. ( )","A: 많이 잤어요? B: 잤기는요. 두 시간밖에 못 잤어요. ( )","A: 영어를 잘하네요. B: 잘하긴요. 조금 해요. ( )","저는 한국 음식을 좋아하기는요. ( )"],"ans":["O","X (→ 자기는요)","O","X (javob emas, o'z fikri)"]},{"ins":"Sizni maqtashdi. -기는요 bilan kamtarona javob bering.","nam":"","words":"","items":["A: 노래를 잘하시네요! → B: ______________________","A: 요리 정말 맛있어요! → B: ______________________","A: 글씨가 예쁘네요! → B: ______________________"],"ans":[]}]},{"n":7,"title":"여의도에서 벚꽃 축제를 할 텐데 같이 갈까요?","tag":"A/V-(으)ㄹ 텐데","uz":"...-sa kerak, (shuning uchun)","form":["-(으)ㄹ 텐데 so'zlovchining taxminini bildiradi va undan keyin shu taxminga bog'liq taklif, maslahat","yoki his-tuyg'u keladi. O'zbekchada: \"...-sa kerak, (shuning uchun)\".","Unli / ㄹ Undosh O'tgan zamon","가다 → 갈 텐데 먹다 → 먹을 텐데 갔을 텐데","만들다 → 만들 텐데 춥다 → 추울 텐데 먹었을 텐데"],"dia":[["Aziz","이번 주말에 여의도에서 벚꽃 축제를 할 텐데 같 이 갈까요?"],["Dilnoza","좋아요. 그런데 주말에는 사람이 많을 텐데 괜찮아요?"],["Aziz","그럼 아침 일찍 가요."],["Dilnoza","네, 날씨가 좋을 텐데 도시락도 싸 가요."]],"tr":"— Shu dam olish kuni Yoido'da sakura festivali bo'lsa kerak, birga boramizmi? — Mayli. Lekin dam olish kuni odam ko'p bo'lsa kerak, mayli-mi? — Unda ertalab barvaqt boramiz. — Ha, havo yaxshi bo'lsa kerak, ovqat ham olib boramiz.","means":[{"h":"Taxmin + taklif/maslahat","ex":[["배가 고플 텐데 이것 좀 드세요.","Qorningiz ochgan bo'lsa kerak, mana buni yeb oling."],["길이 막힐 텐데 지하철을 타세요.","Yo'l tirband bo'lsa kerak, metroga chiqing."]]},{"h":"Taxmin + tashvish/afsus (gap oxirida -(으)ㄹ 텐데요)","ex":[["벌써 10시인데 아직 안 왔어요. 늦으면 안 될 텐데요.","Soat 10 bo'ldi, hali kelmadi. Kechikmasa yaxshi bo'lardi."],["시간이 있으면 좋을 텐데.","Vaqt bo'lganida yaxshi bo'lardi."]]},{"h":"O'tgan voqea haqida taxmin → -았/었을 텐데","ex":[["어제 많이 피곤했을 텐데 일찍 왔네요.","Kecha juda charchagan bo'lsangiz kerak, erta kelibsiz-ku."]]}],"dq":["-(으)ㄹ 텐데 dan keyin taxminga qarshi yoki unga bog'liq gap keladi; -(으)ㄹ 테니까 (23- dars) esa ko'pincha so'zlovchi niyati + buyruq/taklif.","1-shaxs rejasi uchun emas: 제가 갈 텐데 기다리세요. (niyat) → 제가 갈 테니까 기다리세요. ✓"],"conv":[["Jasur","이 짐 혼자 들 수 있어요."],["Malika","무거울 텐데 같이 들어요."],["Sardor","오늘 시험 결과가 나와요."],["Jisu","열심히 공부했으니까 결과가 좋을 텐데요."]],"ex":[{"ins":"Qavsdagi so'zni -(으)ㄹ 텐데 bilan yozing.","nam":"추울 텐데 코트를 입고 가세요. (춥다)","words":"","items":["밤에 커피를 마시면 잠이 안 __________ 차를 마셔요. (오다)","이 일은 혼자 하기 __________ 도와줄까요? (힘들다)","지금 출발하면 __________ 택시를 타세요. (늦다)","어제 이사하느라 __________ 오늘은 쉬세요. (피곤했다)"],"ans":["올 텐데","힘들 텐데","늦을 텐데","피곤했을 텐데"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["비가 (올 텐데 / 오니까 텐데) 우산을 가져가세요.","친구가 지금쯤 집에 (도착할 텐데 / 도착했을 텐데) 전화해 봐요.","그 식당은 (비쌀 텐데 / 비싸 텐데) 다른 데 갈까요?"],"ans":["올 텐데","도착했을 텐데","비쌀 텐데"]},{"ins":"Do'stingizga taxmin + maslahat yozing (-(으)ㄹ 텐데).","nam":"시험 기간이라 도서관에 자리가 없을 텐데 일찍 가세요.","words":"","items":[],"ans":[]}]},{"n":8,"title":"음악을 듣느라고 벨소리를 못 들었어","tag":"V-느라고","uz":"...-man deb (salbiy natija sababi)","form":["-느라고 bir harakat bilan band bo'lgani sababli boshqa ishni qila olmaganini yoki salbiy natija","bo'lganini bildiradi. O'zbekchada: \"...-man deb\", \"...bilan ovora bo'lib\".","V-느라고","듣다 → 듣느라고","준비하다 → 준비하느라고","만들다 → 만드느라고 (ㄹ tushadi)"],"dia":[["Jasur","사르도르, 어제 왜 전화 안 받았어?"],["Sardor","미안해. 이어폰으로 음악을 듣느라고 벨소리를 못 들었어."],["Jasur","그럼 오늘은 왜 늦었어?"],["Sardor","발표 자료를 만드느라고 늦게 잤거든."]],"tr":"— Sardor, kecha nega telefonni olmading? — Kechir. Quloqchinda musiqa eshitaman deb qo'ng'iroqni eshitmabman. — Bugun-chi, nega kechikding? — Taqdimot tayyorlayman deb kech yotgandim-da.","means":[{"h":"Band bo'lgani uchun boshqa ishni qila olmadi","ex":[["숙제를 하느라고 친구를 못 만났어요.","Uy vazifasi bilan ovora bo'lib do'stimni ko'ra olmadim."],["아이를 키우느라고 일을 쉬었어요.","Bola tarbiyasi bilan band bo'lib ishdan dam oldim."]]},{"h":"Harakat sababli qiyinchilik, vaqt ketishi","ex":[["이사 준비하느라고 정신이 없었어요.","Ko'chishga tayyorgarlik bilan boshim qotdi."],["시험공부를 하느라고 힘들었어요.","Imtihonga tayyorlanaman deb qiynaldim."]]}],"dq":["Ikki qismning egasi bir xil: 제가 공부하느라고 동생이 못 잤어요. ✗","Faqat fe'l; o'tgan zamon qo'shilmaydi: 했느라고 ✗","Buyruq va taklif bilan ishlatilmaydi: 공부하느라고 쉬세요. ✗","Tabiiy hodisalar bilan emas: 비가 오느라고 ✗ → 비가 와서"],"conv":[["Malika","점심 먹었어요?"],["Aziz","아니요, 보고서를 쓰느라고 못 먹었어요."],["Dilnoza","얼굴이 피곤해 보여요."],["Jisu","어젯밤에 드라마를 보느라고 못 잤어요."]],"ex":[{"ins":"Qavsdagi fe'lni -느라고 bilan yozing.","nam":"게임을 하느라고 숙제를 못 했어요. (하다)","words":"","items":["손님을 __________ 하루 종일 바빴어요. (기다리다)","한국어를 __________ 고생 많이 했어요. (배우다)","케이크를 __________ 시간이 오래 걸렸어요. (만들다)","친구와 __________ 버스 정류장을 지나쳤어요. (이야기하다)"],"ans":["기다리느라고","배우느라고","만드느라고","이야기하느라고"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["청소하느라고 전화를 못 받았어요. ( )","눈이 오느라고 길이 미끄러워요. ( )","밥을 먹느라고 텔레비전을 보세요. ( )","어제 일하느라고 피곤했어요. ( )"],"ans":["O","X (→ 눈이 와서)","X (buyruq bilan emas)","O"]},{"ins":"Nega quyidagilarni qila olmadingiz? -느라고 bilan javob bering.","nam":"","words":"","items":["왜 아침을 안 먹었어요? → ______________________","왜 모임에 안 왔어요? → ______________________","왜 답장을 안 했어요? → ______________________"],"ans":[]}]},{"n":9,"title":"아무리 배가 고파도 지금은 못 먹어요","tag":"A/V-아/어도","uz":"...-sa ham","form":["-아/어도 oldingi holatdan qat'i nazar keyingi holat o'zgarmasligini bildiradi. Ko'pincha 아무리 bilan","keladi. O'zbekchada: \"...-sa ham\", \"qanchalik ...-masin\".","ㅏ, ㅗ → -아도 boshqa → -어도 -하다 → 해도 N","가다 → 가도 먹다 → 먹어도 공부하다 → 공부해도 학생이어도","좋다 → 좋아도 춥다 → 추워도 친구여도"],"dia":[["Jisu","말리카 씨, 점심 안 먹어요?"],["Malika","지금은 라마단이라서 아무리 배가 고파도 해가 질 때까지 못 먹어요."],["Jisu","힘들지 않아요?"],["Malika","힘들어도 괜찮아요. 저녁에 가족과 같이 먹으면 정말 맛있어요."]],"tr":"— Malika, tushlik qilmaysizmi? — Hozir Ramazon, qanchalik qornim och bo'lsa ham quyosh botguncha yeya olmayman. — Qiyin emasmi? — Qiyin bo'lsa ham mayli. Kechqurun oila bilan yesak, juda mazali bo'ladi.","means":[{"h":"Qarama-qarshi holat: ...-sa ham","ex":[["비가 와도 경기는 해요.","Yomg'ir yog'sa ham o'yin bo'ladi."],["이 옷은 비싸도 사고 싶어요.","Bu kiyim qimmat bo'lsa ham olgim keladi."]]},{"h":"아무리 -아/어도: qanchalik ...-masin","ex":[["아무리 바빠도 아침은 꼭 먹어요.","Qanchalik band bo'lmay, nonushtani albatta qilaman."],["아무리 불러도 대답을 안 해요.","Qancha chaqirsam ham javob bermaydi."]]},{"h":"O'tgan zamon: -았/었어도","ex":[["어제 일찍 잤어도 피곤해요.","Kecha erta yotgan bo'lsam ham charchaganman."]]}],"dq":["아무리 bilan -(으)면 emas: 아무리 바쁘면 ✗ → 아무리 바빠도 ✓","-아/어도 되다 = ruxsat (\"...-sa bo'ladi\"): 여기 앉아도 돼요?"],"conv":[["Aziz","이 문제 너무 어려워요."],["Sardor","어려워도 포기하지 마세요."],["Dilnoza","오늘 운동 갈 거야?"],["Jasur","응, 피곤해도 갈 거야."]],"ex":[{"ins":"Qavsdagi so'zni -아/어도 bilan yozing.","nam":"추워도 창문을 열어 놓을게요. (춥다)","words":"","items":["아무리 __________ 이해가 안 돼요. (읽다)","약을 __________ 감기가 안 나아요. (먹었다)","돈이 __________ 행복하지 않아요. (많다)","아무리 __________ 숙제는 해야 해요. (피곤하다)"],"ans":["읽어도","먹었어도","많아도","피곤해도"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["아무리 (바쁘면 / 바빠도) 연락은 해 주세요.","밤에 커피를 (마셔도 / 마시면) 잠을 잘 자요.","그 사람은 (학생이어도 / 학생이라도) 아는 것이 많아요."],"ans":["바빠도","마셔도","학생이어도 (ikkalasi ham mumkin, 학생이어도 tabiiyroq)"]},{"ins":"아무리 -아/어도 bilan o'zingiz haqingizda yozing.","nam":"아무리 바빠도 어머니께 매일 전화해요.","words":"","items":[],"ans":[]}]},{"n":10,"title":"일이 끝나자마자 공항에 가야 해요","tag":"V-자마자","uz":"...-ishi bilanoq","form":["-자마자 bir harakat tugashi bilanoq keyingisi darhol boshlanganini bildiradi. O'zbekchada: \"...-ishi","bilanoq\", \"...-gan zahoti\".","V-자마자","끝나다 → 끝나자마자","먹다 → 먹자마자","도착하다 → 도착하자마자"],"dia":[["Malika","사르도르 씨, 오늘 고향에 간다면서요?"],["Sardor","네, 일이 끝나자마자 공항에 가야 해요."],["Malika","도착하면 연락해요."],["Sardor","네, 도착하자마자 문자 보낼게요."]],"tr":"— Sardor, bugun yurtga ketar ekansiz-a? — Ha, ish tugashi bilanoq aeroportga borishim kerak. — Yetib borsangiz xabar bering. — Ha, yetib borishim bilanoq SMS yozaman.","means":[{"h":"Birinchi harakatdan keyin darhol ikkinchisi","ex":[["집에 오자마자 잤어요.","Uyga kelishim bilanoq uxladim."],["졸업하자마자 취직했어요.","O'qishni bitirgan zahoti ishga kirdim."]]},{"h":"Kutilmagan tez o'zgarish","ex":[["버스에서 내리자마자 비가 오기 시작했어요.","Avtobusdan tushishim bilanoq yomg'ir boshlandi."],["누우자마자 잠이 들었어요.","Yotishim bilanoq uxlab qoldim."]]}],"dq":["O'tgan zamon qo'shilmaydi: 왔자마자 ✗ → 오자마자 ✓","Sifat bilan ishlatilmaydi: 예쁘자마자 ✗","-는 대로 o'xshash, lekin u o'tmish voqealarida ishlatilmaydi: 도착하는 대로 연락할게요 (kelajak)."],"conv":[["Aziz","왜 그렇게 급하게 나가요?"],["Jisu","수업이 끝나자마자 아르바이트하러 가야 돼요."],["Dilnoza","새 휴대폰 샀어?"],["Jasur","응, 그런데 사자마자 떨어뜨렸어."]],"ex":[{"ins":"Qavsdagi fe'lni -자마자 bilan yozing.","nam":"아침에 일어나자마자 물을 마셔요. (일어나다)","words":"","items":["월급을 __________ 다 썼어요. (받다)","한국에 __________ 휴대폰을 샀어요. (도착하다)","그 노래를 __________ 좋아하게 됐어요. (듣다)","문을 __________ 고양이가 들어왔어요. (열다)"],"ans":["받자마자","도착하자마자","듣자마자","열자마자"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["집에 왔자마자 손을 씻었어요. ( )","수업이 끝나자마자 집에 갔어요. ( )","날씨가 따뜻하자마자 꽃이 피었어요. ( )","영화가 시작하자마자 잠이 들었어요. ( )"],"ans":["X (→ 오자마자)","O","X (sifat bilan emas)","O"]},{"ins":"Kun tartibingiz haqida -자마자 bilan 3 ta gap yozing.","nam":"집에 오자마자 샤워를 해요.","words":"","items":[],"ans":[]}]},{"n":11,"title":"기초반 수업을 받으려면 빨리 신청하세요","tag":"V-(으)려면","uz":"...-moqchi bo'lsangiz","form":["-(으)려면 \"...-moqchi bo'lsangiz\" ma'nosida niyatni shart qilib qo'yadi; keyin shu niyat uchun","kerakli narsa aytiladi. O'zbekchada: \"...-moqchi bo'lsangiz\", \"...-ish uchun\".","Unli / ㄹ Undosh Noto'g'ri","가다 → 가려면 받다 → 받으려면 듣다 → 들으려면","만들다 → 만들려면 먹다 → 먹으려면 돕다 → 도우려면"],"dia":[["Dilnoza","사회통합프로그램 기초반 수업을 듣고 싶어요."],["Aziz","수업을 들으려면 먼저 인터넷으로 신청해야 해요."],["Dilnoza","언제까지 신청해야 돼요?"],["Aziz","이번 주까지예요. 자리가 없을 수 있으니까 빨리하세요."]],"tr":"— KIIP boshlang'ich kursida o'qimoqchiman. — O'qimoqchi bo'lsangiz, avval internet orqali ro'yxatdan o'tishingiz kerak. — Qachongacha? — Shu haftagacha. Joy qolmasligi mumkin, tezroq qiling.","means":[{"h":"Niyat + kerakli shart: -(으)려면 -아/어야 하다","ex":[["한국 대학에 들어가려면 토픽 3급이 필요해요.","Koreya universitetiga kirmoqchi bo'lsangiz TOPIK 3- daraja kerak."],["살을 빼려면 운동을 해야 해요.","Ozmoqchi bo'lsangiz sport qilishingiz kerak."]]},{"h":"Niyat + maslahat/yo'l-yo'riq","ex":[["명동에 가려면 4호선을 타세요.","Myondongga bormoqchi bo'lsangiz 4-liniyaga chiqing."],["한국어를 잘 하려면 한국 친구를 사귀는 게 좋아요.","Koreyschani yaxshi gapirmoqchi bo'lsangiz koreys do'st orttirgan yaxshi."]]}],"dq":["-(으)면 bilan farqi: 가면 (borsangiz — shart), 가려면 (bormoqchi bo'lsangiz — niyat).","Sifat bilan ishlatilmaydi: 건강하려면 → 건강해지려면 ✓"],"conv":[["Jasur","외국인 등록증을 받으려면 어디로 가요?"],["Jisu","출입국 사무소에 가려면 먼저 예약해야 돼요."],["Sardor","이 케이크를 만들려면 시간이 얼마나 걸려요?"],["Malika","두 시간쯤 걸려요."]],"ex":[{"ins":"Qavsdagi fe'lni -(으)려면 bilan yozing.","nam":"은행 계좌를 만들려면 여권이 필요해요. (만들다)","words":"","items":["운전면허를 __________ 시험을 봐야 해요. (따다)","한국 노래를 잘 __________ 많이 들으세요. (부르다)","비행기 표를 싸게 __________ 일찍 예약하세요. (사다)","라디오를 잘 __________ 조용한 곳에 가세요. (듣다)"],"ans":["따려면","부르려면","사려면","들으려면"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["감기가 빨리 (나으려면 / 나으면) 푹 쉬어야 해요.","서울역에 (가면 / 가려면) 몇 번 버스를 타야 돼요?","시험에 (합격하려면 / 합격하면) 열심히 공부하세요."],"ans":["나으려면","가려면","합격하려면"]},{"ins":"Maslahat bering (-(으)려면).","nam":"한국 친구를 사귀려면 동아리에 가입하세요.","words":"","items":["한국어 발음을 잘 하려면 ______________________","돈을 모으려면 ______________________","건강해지려면 ______________________"],"ans":[]}]},{"n":12,"title":"그 배우는 연기를 잘하니까 상을 받을 만해요","tag":"V-(으)ㄹ 만하다","uz":"...-sa arziydi","form":["-(으)ㄹ 만하다 biror narsa qilishga arzishini yoki qoniqarli darajada ekanini bildiradi. O'zbekchada:","\"...-sa arziydi\", \"...-sa bo'ladi\".","Unli / ㄹ Undosh N oldidan","보다 → 볼 만하다 먹다 → 먹을 만하다 볼 만한 영화","살다 → 살 만하다 읽다 → 읽을 만하다 가 볼 만한 곳"],"dia":[["Jasur","지수 씨, 어제 본 영화 어땠어요?"],["Jisu","정말 볼 만했어요. 주인공 연기가 최고였어요."],["Jasur","그 배우가 이번에 상을 받았다면서요?"],["Jisu","네, 연기를 잘하니까 상을 받을 만해요."]],"tr":"— Jisu, kecha ko'rgan kinongiz qanday edi? — Haqiqatan ko'rishga arziydigan ekan. Bosh qahramon o'yini zo'r edi. — O'sha aktyor mukofot olibdi-ku? — Ha, yaxshi o'ynaydi, mukofotga arziydi.","means":[{"h":"Qilishga arziydi (tavsiya)","ex":[["경주는 한번 가 볼 만해요.","Kyonjuga bir borib ko'rishga arziydi."],["이 책은 읽을 만한 책이에요.","Bu o'qishga arziydigan kitob."]]},{"h":"Qoniqarli, chidasa bo'ladigan darajada","ex":[["조금 맵지만 먹을 만해요.","Biroz achchiq, lekin yesa bo'ladi."],["집이 작지만 혼자 살 만해요.","Uy kichik, lekin bir kishi yashasa bo'ladi."]]},{"h":"Sabab bo'lishga yetarli","ex":[["그렇게 열심히 했으니까 칭찬을 받을 만해요.","Shunchalik harakat qilgani uchun maqtovga loyiq."]]}],"dq":["Sifat bilan ishlatilmaydi: 예쁠 만해요 ✗","N oldidan -(으)ㄹ 만한 shaklida: 가 볼 만한 곳, 먹을 만한 음식."],"conv":[["Aziz","부산에 처음 가는데 어디가 좋아요?"],["Malika","해운대가 가 볼 만해요."],["Sardor","새 회사 일은 어때요?"],["Dilnoza","처음엔 힘들었는데 이제는 할 만해요."]],"ex":[{"ins":"Qavsdagi fe'lni -(으)ㄹ 만해요 bilan yozing.","nam":"이 식당 비빔밥은 먹을 만해요. (먹다)","words":"","items":["그 드라마는 한번 __________. (보다)","이 노트북은 오래됐지만 아직 __________. (쓰다)","이 정도 추위는 __________. (참다)","제주도는 꼭 __________. (가 보다)"],"ans":["볼 만해요","쓸 만해요","참을 만해요","가 볼 만해요"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["서울에서 (가 볼 만한 / 가 볼 만해) 곳을 추천해 주세요.","이 옷은 싸지만 (입을 만해요 / 입을 만하요).","그 가수는 노래를 잘하니까 인기가 (많을 만해요 / 많은 만해요)."],"ans":["가 볼 만한","입을 만해요","많을 만해요"]},{"ins":"O'z shahringizdagi joy/ovqat/kitobni tavsiya qiling (-(으)ㄹ 만하다).","nam":"사마르칸트의 레기스탄 광장은 꼭 가 볼 만해요.","words":"","items":[],"ans":[]}]},{"n":13,"title":"옷을 입은 채로 잤어요?","tag":"V-(으)ㄴ 채로","uz":"...-gan holda","form":["-(으)ㄴ 채로 oldingi harakat natijasidagi holat saqlangan holda keyingi harakat bo'lganini bildiradi.","Ko'pincha odatdagidan farqli holat. O'zbekchada: \"...-gan holda\", \"...-gancha\".","Unli Undosh ㄹ","켜다 → 켠 채로 입다 → 입은 채로 열다 → 연 채로","자다 → 잔 채로 신다 → 신은 채로 살다 → 산 채로"],"dia":[["Jisu","딜노자, 옷이 왜 이렇게 구겨졌어?"],["Dilnoza","어젯밤에 너무 피곤해서 옷을 입은 채로 잤어."],["Jisu","불은 껐어?"],["Dilnoza","아니, 불도 켠 채로 잤어."]],"tr":"— Dilnoza, kiyiming nega bunchalik g'ijim? — Kecha juda charchab, kiyimimni kiygancha uxlab qolibman. — Chiroqni o'chirdingmi? — Yo'q, chiroqni ham yoqqancha uxlabman.","means":[{"h":"Holat saqlangan holda keyingi harakat","ex":[["창문을 연 채로 나갔어요.","Derazani ochiq qoldirgancha chiqib ketdim."],["텔레비전을 켠 채로 잠이 들었어요.","Televizorni yoqqancha uxlab qoldim."]]},{"h":"Taqiq va qoidalarda","ex":[["신발을 신은 채로 들어가면 안 돼요.","Poyabzal kiygan holda kirish mumkin emas."],["모자를 쓴 채로 인사하지 마세요.","Shlyapa kiygan holda salomlashmang."]]}],"dq":["Faqat fe'l bilan: 예쁜 채로 ✗","-고 bilan farqi: 모자를 쓰고 나갔어요 (oddiy ketma-ketlik) / 모자를 쓴 채로 잤어요 (g'ayritabiiy holat).","가다, 오다 kabi harakat fe'llari bilan kam ishlatiladi."],"conv":[["Aziz","왜 이렇게 추워요?"],["Sardor","에어컨을 켠 채로 문을 닫았거든요."],["Malika","휴대폰이 왜 고장 났어요?"],["Jasur","바지 주머니에 넣은 채로 빨래를 했어요."]],"ex":[{"ins":"Qavsdagi fe'lni -(으)ㄴ 채로 bilan yozing.","nam":"불을 켠 채로 잤어요. (켜다)","words":"","items":["안경을 __________ 세수를 했어요. (쓰다)","문을 __________ 외출했어요. (열다)","화장을 __________ 잠이 들었어요. (하다)","고기를 __________ 먹으면 안 돼요. (얼다)"],"ans":["쓴 채로","연 채로","한 채로","언 채로"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["신발을 신은 채로 방에 들어왔어요. ( )","배가 고픈 채로 잤어요. ( )","입을 벌린 채로 사진을 찍었어요. ( )","숙제를 하는 채로 잤어요. ( )"],"ans":["O","X (sifat → 배가 고픈 상태로)","O","X (→ 숙제를 하다가)"]},{"ins":"-(으)ㄴ 채로 bilan o'zingiz qilgan kulgili/g'alati holatni yozing.","nam":"바빠서 앞치마를 맨 채로 가게에 갔어요.","words":"","items":[],"ans":[]}]},{"n":14,"title":"맛있어서 다 먹어 버렸어","tag":"V-아/어 버리다","uz":"...-ib qo'ymoq (butunlay)","form":["-아/어 버리다 harakat butunlay tugaganini va shu bilan bog'liq afsus yoki yengillik hissini bildiradi.","O'zbekchada: \"...-ib qo'ydi\", \"...-ib yubordi\".","ㅏ, ㅗ boshqa -하다","가다 → 가 버리다 먹다 → 먹어 버리다 말하다 → 말해 버리다","팔다 → 팔아 버리다 잊다 → 잊어버리다"],"dia":[["Dilnoza","사르도르, 냉장고에 있던 케이크 못 봤어?"],["Sardor","미안해. 너무 맛있어서 내가 다 먹어 버렸어."],["Dilnoza","뭐? 내일 친구 생일 선물이었는데!"],["Sardor","정말 미안해. 내가 새로 사 올게."]],"tr":"— Sardor, muzlatkichdagi tortni ko'rmadingmi? — Kechir. Juda mazali ekan, hammasini yeb qo'ydim. — Nima? Ertaga do'stimning tug'ilgan kuniga sovg'a edi! — Kechir, yangisini olib kelaman.","means":[{"h":"Harakat butunlay tugadi","ex":[["숙제를 한 시간 만에 다 해 버렸어요.","Uy vazifasini bir soatda bajarib tashladim."],["월급을 일주일 만에 다 써 버렸어요.","Maoshni bir haftada sarflab yubordim."]]},{"h":"Afsus, kutilmagan salbiy natija","ex":[["버스가 그냥 가 버렸어요.","Avtobus ketib qoldi."],["비밀을 친구에게 말해 버렸어요.","Sirni do'stimga aytib qo'ydim."]]},{"h":"Yengillik (yukdan qutulish)","ex":[["고민을 다 잊어버리고 푹 쉬세요.","Tashvishlarni unutib, yaxshilab dam oling."]]}],"dq":["잃어버리다, 잊어버리다 bitta so'z — qo'shib yoziladi.","-고 말다 ham o'xshash ma'noda, lekin ko'proq afsus/oxir-oqibat ma'nosida."],"conv":[["Jisu","왜 울어요?"],["Malika","친구랑 싸워서 친구가 화가 나서 가 버렸어요."],["Aziz","그 오래된 옷 어떻게 했어요?"],["Jasur","다 버려 버렸어요. 이제 방이 넓어요."]],"ex":[{"ins":"Qavsdagi fe'lni -아/어 버렸어요 bilan yozing.","nam":"동생이 제 과자를 다 먹어 버렸어요. (먹다)","words":"","items":["비행기가 벌써 __________. (떠나다)","지하철에 가방을 놓고 __________. (내리다)","화가 나서 편지를 __________. (찢다)","약속을 깜빡 __________. (잊다)"],"ans":["떠나 버렸어요","내려 버렸어요","찢어 버렸어요","잊어버렸어요"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["지갑을 잃어 버렸어요. ( )","열심히 해서 일을 일찍 끝내 버렸어요. ( )","친구가 화가 나서 집에 가 버렸어요. ( )"],"ans":["X (→ 잃어버렸어요, qo'shib)","O","O"]},{"ins":"Afsus qilgan holatingizni -아/어 버렸어요 bilan yozing.","nam":"택시에 휴대폰을 두고 내려 버렸어요.","words":"","items":[],"ans":[]}]},{"n":15,"title":"시장에 갔는데 싸게 팔더라고요","tag":"A/V-더라고요","uz":"...-ekan (ko'rganini aytish)","form":["-더라고요 so'zlovchi o'zi ko'rgan, eshitgan yoki his qilgan narsani eslab, boshqaga yetkazishda","ishlatiladi. O'zbekchada: \"...-ekan\", \"...-arkan\".","A/V-더라고요 O'tgan (tugagan) N(이)더라고요","싸다 → 싸더라고요 끝났더라고요 학생이더라고요","팔다 → 팔더라고요 왔더라고요 부자더라고요"],"dia":[["Aziz","말리카 씨, 어제 동대문 시장에 갔다면서요?"],["Malika","네, 가 보니까 옷을 정말 싸게 팔더라고요."],["Aziz","사람도 많았어요?"],["Malika","네, 밤인데도 사람이 정말 많더라고요."]],"tr":"— Malika, kecha Tondemun bozoriga boribsiz-a? — Ha, borib ko'rsam, kiyimni juda arzon sotarkan. — Odam ham ko'pmidi? — Ha, kechasi bo'lsa ham odam juda ko'p ekan.","means":[{"h":"O'zi ko'rgan/bilgan narsani yetkazish","ex":[["그 식당 음식이 정말 맛있더라고요.","O'sha restoran ovqati juda mazali ekan."],["지수 씨는 영어도 잘하더라고요.","Jisu ingliz tilini ham yaxshi bilarkan."]]},{"h":"Kutilmagan kashfiyot","ex":[["도착해 보니까 가게가 벌써 닫았더라고요.","Borib qarasam, do'kon allaqachon yopilgan ekan."],["알고 보니 그 사람이 제 친구 동생이더라고요.","Bilsam, u odam do'stimning ukasi ekan."]]},{"h":"O'z his-tuyg'usi (1-shaxs ham mumkin)","ex":[["그 영화를 보고 저도 모르게 눈물이 나더라고요.","U kinoni ko'rib, beixtiyor ko'zimdan yosh chiqdi."]]}],"dq":["O'zining ixtiyoriy harakati haqida ishlatilmaydi: 제가 밥을 먹더라고요. ✗","O'zi bevosita ko'rmagan narsa uchun emas — eshitganini aytishda -대요/-다고 해요."],"conv":[["Jasur","제주도 여행 어땠어?"],["Jisu","바다가 정말 예쁘더라고."],["Sardor","새로 온 선생님 어때요?"],["Dilnoza","친절하고 설명도 쉽게 해 주시더라고요."]],"ex":[{"ins":"Qavsdagi so'zni -더라고요 bilan yozing.","nam":"한국 겨울은 정말 춥더라고요. (춥다)","words":"","items":["그 카페 커피가 생각보다 __________. (비싸다)","민수 씨가 노래를 정말 잘 __________. (부르다)","집에 가 보니까 동생이 벌써 __________. (자고 있다)","그 사람이 우리 회사 __________. (사장님이다)"],"ans":["비싸더라고요","부르더라고요","자고 있더라고요","사장님이더라고요"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["어제 제가 운동을 열심히 하더라고요. ( )","부산에 가 보니까 사람들이 친절하더라고요. ( )","그 영화를 보면서 저도 웃음이 나더라고요. ( )"],"ans":["X (o'z ixtiyoriy harakati)","O","O (his-tuyg'u)"]},{"ins":"Borgan joyingiz haqida -더라고요 bilan 3 ta gap yozing.","nam":"서울에 가 보니까 지하철이 정말 편리하더라고요.","words":"","items":[],"ans":[]}]},{"n":16,"title":"운동화를 신을 걸 그랬어요","tag":"V-(으)ㄹ 걸 그랬다","uz":"...-sam bo'lar ekan (afsus)","form":["-(으)ㄹ 걸 그랬다 o'tmishda qilmagan ishiga afsus bildiradi. Inkor shakli -지 말 걸 그랬다.","O'zbekchada: \"...-sam bo'lar ekan\", \"...-sam yaxshi bo'lardi\".","Unli / ㄹ Undosh Inkor Qisqa","오다 → 올 걸 그랬다 신다 → 신을 걸 그랬다 가지 말 걸 그랬다 올걸. / 먹을걸.","살다 → 살 걸 그랬다 먹다 → 먹을 걸 그랬다"],"dia":[["Malika","자수르 씨, 왜 이렇게 천천히 걸어요?"],["Jasur","구두를 신고 왔는데 발이 너무 아파요. 운동화를 신을 걸 그랬어요."],["Malika","등산하는 날인데 구두를 신었어요?"],["Jasur","네, 어제 미리 물어볼 걸 그랬어요."]],"tr":"— Jasur, nega bunchalik sekin yuryapsiz? — Tufli kiyib kelgandim, oyog'im juda og'riyapti. Krossovka kiysam bo'lar ekan. — Tog'ga chiqish kuni tufli kiydingizmi? — Ha, kecha oldindan so'rasam bo'lar ekan.","means":[{"h":"Qilmagan ishiga afsus","ex":[["비가 오네요. 우산을 가져올 걸 그랬어요.","Yomg'ir yog'yapti. Soyabon olsam bo'lar ekan."],["시험이 어려웠어요. 공부를 더 할 걸 그랬어요.","Imtihon qiyin bo'ldi. Ko'proq o'qisam bo'lar ekan."]]},{"h":"Qilgan ishiga afsus: -지 말 걸 그랬다","ex":[["너무 많이 먹었어요. 먹지 말 걸 그랬어요.","Juda ko'p yedim. Yemasam bo'lar ekan."],["그 말을 하지 말 걸 그랬어요.","U gapni aytmasam bo'lar ekan."]]},{"h":"Qisqa shakl (o'z-o'ziga gapirganda)","ex":[["아, 택시 탈걸.","Eh, taksiga chiqsam bo'lardi."]]}],"dq":["O'tgan zamon qo'shilmaydi: 왔을 걸 그랬어요 ✗ → 올 걸 그랬어요 ✓","Sifat bilan ishlatilmaydi."],"conv":[["Aziz","공연 표가 다 팔렸대요."],["Dilnoza","아, 어제 예매할 걸 그랬어요."],["Sardor","머리 잘랐는데 너무 짧아요."],["Jisu","조금만 자를걸."]],"ex":[{"ins":"Qavsdagi fe'lni -(으)ㄹ 걸 그랬어요 bilan yozing.","nam":"길이 막혀요. 지하철을 탈 걸 그랬어요. (타다)","words":"","items":["배가 고파요. 아침을 __________. (먹다)","감기에 걸렸어요. 옷을 따뜻하게 __________. (입다)","눈이 아파요. 게임을 오래 __________. (하지 말다)","이 옷은 너무 작아요. 큰 걸 __________. (사다)"],"ans":["먹을 걸 그랬어요","입을 걸 그랬어요","하지 말 걸 그랬어요","살 걸 그랬어요"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["늦잠을 잤어요. 어젯밤에 일찍 (잘 걸 / 잤을 걸) 그랬어요.","돈을 다 썼어요. 쇼핑을 (하지 말 걸 / 안 할 걸) 그랬어요."],"ans":["잘 걸","하지 말 걸"]},{"ins":"O'tgan hafta afsus qilgan narsalaringizni yozing.","nam":"주말에 집에만 있었어요. 친구를 만날 걸 그랬어요.","words":"","items":[],"ans":[]}]},{"n":17,"title":"내가 먹던 사과 어떻게 했어요?","tag":"A/V-던","uz":"...-ayotgan edi (tugallanmagan o'tgan)","form":["-던 o'tmishda boshlanib tugallanmagan harakatni, o'tmishda takrorlangan odatni yoki o'tgan","holatni eslab, otni aniqlaydi. O'zbekchada: \"...-ayotgan\", \"...-adigan edi\".","A/V-던 Tugallangan N","먹다 → 먹던 -았/었던: 갔던 곳 학생이던 시절","가다 → 가던 먹었던 음식","작다 → 작던"],"dia":[["Aziz","사르도르, 내가 먹던 사과 어떻게 했어?"],["Sardor","아, 그거 네가 먹던 거였어? 버린 줄 알고 내가 먹었어."],["Aziz","아이고. 그럼 내가 읽던 책은?"],["Sardor","책은 책상 위에 있어."]],"tr":"— Sardor, men yeyayotgan olmani nima qilding? — E, u sen yeyayotgan olma edimi? Tashlab ketgan deb o'ylab, yeb qo'ydim. — Voy. Unda men o'qiyotgan kitob-chi? — Kitob stol ustida.","means":[{"h":"Tugallanmagan o'tgan harakat","ex":[["어제 보던 드라마를 마저 봤어요.","Kecha ko'rayotgan serialimni oxirigacha ko'rdim."],["쓰던 편지를 다 썼어요.","Yozayotgan xatimni tugatdim."]]},{"h":"O'tmishda takrorlangan odat","ex":[["어렸을 때 자주 가던 공원이에요.","Bolaligimda tez-tez boradigan bog'im."],["대학 때 살던 집이 없어졌어요.","Talabalik paytimda yashagan uyim yo'q bo'lib ketdi."]]},{"h":"O'tgan holat (sifat bilan)","ex":[["그렇게 작던 아이가 벌써 대학생이에요.","O'shanda kichkina bo'lgan bola allaqachon talaba."]]}],"dq":["먹은 사과 = yeb bo'lingan olma / 먹던 사과 = yarim yeyilgan olma.","Bir marta bo'lib tugagan voqea uchun -았/었던: 작년에 갔던 제주도."],"conv":[["Malika","이 컵 써도 돼요?"],["Jisu","그건 제가 쓰던 거예요. 새 컵 드릴게요."],["Jasur","이 노래 알아요?"],["Dilnoza","네, 학생 때 자주 듣던 노래예요."]],"ex":[{"ins":"Qavsdagi so'zni -던 bilan yozing.","nam":"이건 제가 입던 옷이에요. (입다)","words":"","items":["고등학교 때 자주 __________ 떡볶이 집에 갔어요. (가다)","동생이 __________ 숙제를 제가 도와줬어요. (하다)","__________ 날씨가 갑자기 추워졌어요. (따뜻하다)","아까 __________ 이야기를 계속해 주세요. (하다)"],"ans":["가던","하던","따뜻하던","하던"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["제가 (마시던 / 마신) 커피를 누가 버렸어요? (yarim ichilgan)","작년에 (갔던 / 가던) 식당에 또 갔어요. (bir marta)","어릴 때 (살던 / 살) 동네에 가 보고 싶어요."],"ans":["마시던","갔던","살던"]},{"ins":"Bolaligingiz haqida -던 bilan 3 ta gap yozing.","nam":"어렸을 때 자주 놀던 놀이터가 지금은 없어요.","words":"","items":[],"ans":[]}]},{"n":18,"title":"운전면허를 받기 위해서 열심히 하네요","tag":"V-기 위해서 / N을/를 위해서","uz":"... uchun (maqsad)","form":["-기 위해서 / N을/를 위해서 harakatning maqsadini bildiradi. O'zbekchada: \"...-ish uchun\", \"...","uchun\".","V-기 위해서 N을/를 위해서 N oldidan","받다 → 받기 위해서 건강을 위해서 V-기 위한 N","가다 → 가기 위해서 가족을 위해서 N을/를 위한 N"],"dia":[["Malika","자수르 씨, 요즘 주말마다 운전 연습을 하네요."],["Jasur","네, 운전면허를 받기 위해서 열심히 하고 있어요."],["Malika","왜 갑자기 운전을 배워요?"],["Jasur","가족을 위해서요. 아이를 학교에 데려다주고 싶어요."]],"tr":"— Jasur, keyingi paytlarda har dam olish kuni haydash mashq qilyapsiz. — Ha, haydovchilik guvohnomasini olish uchun harakat qilyapman. — Nega birdan haydashni o'rganyapsiz? — Oilam uchun. Bolamni maktabga olib borgim keladi.","means":[{"h":"V-기 위해서: ...-ish uchun","ex":[["한국 회사에 취직하기 위해서 한국어를 배워요.","Koreya kompaniyasiga ishga kirish uchun koreys tilini o'rganyapman."],["살을 빼기 위해서 매일 걸어요.","Ozish uchun har kuni yuraman."]]},{"h":"N을/를 위해서: ... uchun / ... manfaati uchun","ex":[["건강을 위해서 담배를 끊었어요.","Sog'ligim uchun chekishni tashladim."],["아이들을 위해서 열심히 일해요.","Bolalar uchun tinmay ishlayman."]]},{"h":"Ot oldidan: -기 위한 / -을/를 위한","ex":[["외국인을 위한 한국어 수업이에요.","Chet elliklar uchun koreys tili darsi."]]}],"dq":["Sifat bilan ishlatilmaydi: 건강하기 위해서 ✗ → 건강해지기 위해서 ✓","-(으)러 faqat 가다/오다/다니다 bilan: 공부하러 가요. -기 위해서 har qanday fe'l bilan."],"conv":[["Aziz","왜 이렇게 일찍 일어나요?"],["Dilnoza","아침 운동을 하기 위해서요."],["Jisu","이 선물은 누구 거예요?"],["Sardor","어머니를 위해서 준비했어요."]],"ex":[{"ins":"-기 위해서 yoki -을/를 위해서 bilan yozing.","nam":"장학금을 받기 위해서 열심히 공부해요. (받다)","words":"","items":["좋은 대학에 __________ 매일 도서관에 가요. (들어가다)","__________ 채소를 많이 먹어요. (건강)","한국 문화를 __________ 한국 영화를 봐요. (이해하다)","__________ 돈을 모으고 있어요. (미래)"],"ans":["들어가기 위해서","건강을 위해서","이해하기 위해서","미래를 위해서"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["예쁘기 위해서 화장을 해요. ( )","부모님을 위해서 선물을 샀어요. ( )","책을 사기 위해서 서점에 갔어요. ( )","외국인 위한 행사예요. ( )"],"ans":["X (→ 예뻐지기 위해서)","O","O","X (→ 외국인을 위한)"]},{"ins":"O'z maqsadlaringiz haqida -기 위해서 bilan yozing.","nam":"한국에서 일하기 위해서 토픽 시험을 준비하고 있어요.","words":"","items":[],"ans":[]}]},{"n":19,"title":"구경도 할 겸 너도 한번 가 봐","tag":"V-(으)ㄹ 겸 / N 겸","uz":"ham ..., ham ...","form":["-(으)ㄹ 겸 bitta harakat bilan ikki (yoki ko'proq) maqsadga erishishni bildiradi. N 겸 N — bir","narsaning ikki vazifasi. O'zbekchada: \"ham ..., ham ...\", \"... ham bo'lsin deb\".","V-(으)ㄹ 겸 -도 -(으)ㄹ 겸 -도 -(으)ㄹ 겸 N 겸 N","하다 → 할 겸 운동도 할 겸 친구도 만날 겸 아침 겸 점심","먹다 → 먹을 겸 거실 겸 서재"],"dia":[["Dilnoza","지수야, 주말에 뭐 해?"],["Jisu","남대문 시장에 가려고. 구경도 할 겸 선물도 살겸."],["Dilnoza","나도 가고 싶다!"],["Jisu","그래, 같이 가자. 맛있는 것도 많아서 너도 한번 가 봐야 해."]],"tr":"— Jisu, dam olish kuni nima qilasan? — Namdemun bozoriga bormoqchiman. Ham tomosha qilay, ham sovg'a olay deb. — Men ham borgim kelyapti! — Mayli, birga boramiz. Mazali narsalar ko'p, sen ham bir borib ko'rishing kerak.","means":[{"h":"Bir harakat — ikki maqsad","ex":[["운동도 할 겸 경치도 볼 겸 등산을 해요.","Ham sport qilay, ham manzara ko'ray deb tog'ga chiqaman."],["한국어 연습도 할 겸 아르바이트를 시작했어요.","Koreyschani ham mashq qilay deb part-time ish boshladim."]]},{"h":"N 겸 N: ikki vazifali narsa","ex":[["늦게 일어나서 아침 겸 점심을 먹었어요.","Kech turib, nonushta-tushlikni birga qildim."],["이 방은 거실 겸 서재예요.","Bu xona ham mehmonxona, ham kabinet."]]}],"dq":["Asosiy maqsaddan tashqari qo'shimcha maqsad borligini bildiradi; bitta maqsad bo'lsa - (으)러 yoki -기 위해서.","Sifat bilan ishlatilmaydi."],"conv":[["Sardor","왜 걸어서 출근해요?"],["Malika","운동도 할 겸 돈도 아낄 겸요."],["Aziz","이번 여행은 어디로 가요?"],["Jasur","부산이요. 친구도 만날 겸 바다도 볼 겸요."]],"ex":[{"ins":"-(으)ㄹ 겸 bilan gapni to'ldiring.","nam":"산책도 할 겸 우유도 살 겸 밖에 나갔어요. (하다, 사다)","words":"","items":["책도 __________ 공부도 __________ 도서관에 가요. (빌리다, 하다)","바람도 __________ 기분 전환도 __________ 여행을 가요. (쐬다, 하다)","늦게 일어나서 __________ 점심을 먹었어요. (아침)"],"ans":["빌릴 겸, 할 겸","쐴 겸, 할 겸","아침 겸"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["얼굴도 (볼 겸 / 보는 겸) 이야기도 할 겸 놀러 와.","이 소파는 (침대 겸 / 침대 같이) 소파예요."],"ans":["볼 겸","침대 겸"]},{"ins":"Nima uchun bu ishni qilasiz? Ikki maqsad bilan yozing.","nam":"한국 친구도 사귈 겸 한국어도 배울 겸 동아리에 가입했어요.","words":"","items":[],"ans":[]}]},{"n":20,"title":"밥은 없는데 라면이라도 끓일까요?","tag":"N(이)라도","uz":"hech bo'lmasa ...","form":["N(이)라도 eng yaxshi tanlov bo'lmasa ham, hech bo'lmasa shu narsani tanlashni bildiradi. So'roq","so'zlari bilan \"har qanday\" ma'nosini beradi. O'zbekchada: \"hech bo'lmasa ...\", \"... bo'lsa ham\".","Unli Undosh So'roq so'zi","차 → 차라도 라면 → 라면이라도 언제라도","우유 → 우유라도 빵 → 빵이라도 누구라도","어디라도"],"dia":[["Sardor","아지즈, 배고픈데 밥 있어?"],["Aziz","밥은 없는데 라면이라도 끓일까?"],["Sardor","좋아. 김치는 있어?"],["Aziz","김치는 없어. 단무지라도 줄까?"]],"tr":"— Aziz, qornim och, guruch bormi? — Guruch yo'q, hech bo'lmasa ramyon qaynataymi? — Yaxshi. Kimchi bormi? — Kimchi yo'q. Hech bo'lmasa tuzlangan turp beraymi?","means":[{"h":"Eng yaxshisi emas, lekin hech bo'lmasa","ex":[["시간이 없으면 커피라도 한잔해요.","Vaqt bo'lmasa, hech bo'lmasa bir piyola kofe ichaylik."],["직접 못 가면 전화라도 하세요.","O'zingiz bora olmasangiz, hech bo'lmasa qo'ng'iroq qiling."]]},{"h":"So'roq so'zi + (이)라도: har qanday","ex":[["궁금한 게 있으면 언제라도 연락하세요.","Savol bo'lsa, istalgan vaqtda bog'laning."],["누구라도 할 수 있어요.","Har kim qila oladi."]]}],"dq":["N도 bilan farqi: 라면도 먹어요 (ramyonni ham yeyman) / 라면이라도 먹어요 (boshqa yo'q, hech bo'lmasa ramyon).","Fe'l bilan -아/어도 ishlatiladi (9-dars)."],"conv":[["Malika","주말에 바빠요?"],["Jisu","네, 그런데 일요일 저녁이라도 만날까요?"],["Dilnoza","선물을 못 샀어요."],["Jasur","그럼 카드라도 써서 주세요."]],"ex":[{"ins":"N(이)라도 bilan yozing.","nam":"택시가 없으면 버스라도 타세요. (버스)","words":"","items":["비싼 선물은 못 하니까 __________ 사 갈게요. (꽃)","물이 없는데 __________ 드릴까요? (주스)","바쁘면 __________ 보내 주세요. (문자)","__________ 괜찮으니까 도와주세요. (누구)"],"ans":["꽃이라도","주스라도","문자라도","누구라도"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["많이 못 먹으면 (조금이라도 / 조금도) 드세요.","잠이 안 와서 (책이라도 / 책도) 읽으려고요."],"ans":["조금이라도","책이라도"]},{"ins":"Hech bo'lmasa nima qilasiz? N(이)라도 bilan yozing.","nam":"운동할 시간이 없으면 산책이라도 해요.","words":"","items":[],"ans":[]}]},{"n":21,"title":"뮤지컬 공연도 예약해 놓았어","tag":"V-아/어 놓다/두다","uz":"oldindan qilib qo'ymoq","form":["-아/어 놓다/두다 harakatni oldindan bajarib, uning natijasi saqlanib turishini bildiradi. 두다 natija","uzoqroq saqlanishini ta'kidlaydi. O'zbekchada: \"...-ib qo'ymoq\".","-아 놓다 -어 놓다 -해 놓다 Qisqa","사다 → 사 놓다 열다 → 열어 놓다 예약하다 → 예약해 놓다 놓아요 → 놔요","닫다 → 닫아 놓다 만들다 → 만들어 놓다 놓았어요 → 놨어요"],"dia":[["Dilnoza","자수르, 내일 엄마 생신인데 준비 다 했어?"],["Jasur","응, 식당은 어제 예약해 놨어. 뮤지컬 공연도 예약 해 놓았어."],["Dilnoza","와, 선물은?"],["Jasur","선물도 사 놨어. 내 방에 숨겨 뒀어."]],"tr":"— Jasur, ertaga onamning tug'ilgan kuni, hammasini tayyorladingmi? — Ha, restoranni kecha band qilib qo'ydim. Myuzikl chiptasini ham band qildim. — Voy, sovg'a-chi? — Sovg'ani ham olib qo'ydim. Xonamga yashirib qo'ydim.","means":[{"h":"Oldindan tayyorlab qo'yish","ex":[["손님이 오기 전에 음식을 만들어 놓았어요.","Mehmonlar kelishidan oldin ovqat tayyorlab qo'ydim."],["시험 전에 단어를 다 외워 두세요.","Imtihondan oldin so'zlarni yodlab qo'ying."]]},{"h":"Natija holatini saqlab qo'yish","ex":[["더우니까 창문을 열어 놓으세요.","Issiq, derazani ochib qo'ying."],["에어컨을 켜 둔 채로 나갔어요.","Konditsionerni yoqib qo'ygancha chiqib ketdim."]]}],"dq":["놓다/두다 deyarli bir xil; 두다 uzoqroq saqlash ma'nosida ko'proq: 중요한 서류는 금고에 넣어 두세요.","Sifat bilan ishlatilmaydi."],"conv":[["Aziz","내일 아침에 일찍 출발해요."],["Malika","그럼 오늘 밤에 짐을 싸 놓으세요."],["Jisu","이 우유 마셔도 돼요?"],["Sardor","네, 아까 사 놨어요."]],"ex":[{"ins":"Qavsdagi fe'lni -아/어 놓았어요 bilan yozing.","nam":"친구가 와서 방을 깨끗하게 청소해 놓았어요. (청소하다)","words":"","items":["여행 가기 전에 호텔을 __________. (예약하다)","추워서 창문을 __________. (닫다)","내일 입을 옷을 미리 __________. (꺼내다)","회의 자료를 __________. (복사하다)"],"ans":["예약해 놓았어요","닫아 놓았어요","꺼내 놓았어요","복사해 놓았어요"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["손님이 오니까 과일을 씻어 놓았어요. ( )","날씨가 좋아 놓았어요. ( )","이 책은 제가 읽어 둘게요. ( )"],"ans":["O","X (sifat bilan emas)","O"]},{"ins":"Safar oldidan nimalarni qilib qo'yasiz? 3 ta gap yozing.","nam":"비행기 표를 미리 사 놓아요.","words":"","items":[],"ans":[]}]},{"n":22,"title":"담배를 많이 피우는 데다가 술도 많이 마시지요?","tag":"A-(으)ㄴ 데다가 / V-는 데다가","uz":"ustiga-ustak","form":["-(으)ㄴ/는 데다가 bir holat ustiga yana shunga o'xshash ikkinchi holat qo'shilishini bildiradi.","O'zbekchada: \"ustiga-ustak\", \"...-dan tashqari yana\".","A-(으)ㄴ 데다가 V-는 데다가 V o'tgan N","싸다 → 싼 데다가 피우다 → 피우는 데다가 잔 데다가 N인 데다가","많다 → 많은 데다가 오다 → 오는 데다가 먹은 데다가"],"dia":[["Malika","아지즈 씨, 회사 근처에 새로 생긴 식당 가 봤어요?"],["Aziz","네, 값이 싼 데다가 양도 많아요."],["Malika","그래요? 맛은요?"],["Aziz","맛있는 데다가 사장님도 친절해서 매일 가요."]],"tr":"— Aziz, ish yonida yangi ochilgan restoranga bordingizmi? — Ha, narxi arzon, ustiga porsiyasi ham katta. — Shunaqami? Ta'mi-chi? — Mazali, ustiga xo'jayini ham xushmuomala, har kuni boraman.","means":[{"h":"Ijobiy + ijobiy","ex":[["이 아파트는 넓은 데다가 역에서 가까워요.","Bu kvartira keng, ustiga stansiyaga yaqin."],["지수 씨는 예쁜 데다가 성격도 좋아요.","Jisu chiroyli, ustiga fe'li ham yaxshi."]]},{"h":"Salbiy + salbiy","ex":[["비가 오는 데다가 바람도 많이 불어요.","Yomg'ir yog'yapti, ustiga shamol ham kuchli."],["늦잠을 잔 데다가 길까지 막혀서 지각했어요.","Uxlab qolganim ustiga yo'l ham tirband bo'lib, kechikdim."]]}],"dq":["Ikki qism bir xil yo'nalishda bo'lishi kerak: 맛있는 데다가 비싸요. ✗ (ijobiy + salbiy) → 맛있 지만 비싸요.","Ikkinchi qismda ko'pincha 도/까지 keladi: 양도 많아요."],"conv":[["Sardor","요즘 왜 이렇게 힘들어 보여요?"],["Jisu","일이 많은 데다가 이사까지 해야 해서요."],["Jasur","그 휴대폰 어때요?"],["Dilnoza","가벼운 데다가 배터리도 오래 가요."]],"ex":[{"ins":"-(으)ㄴ/는 데다가 bilan yozing.","nam":"그 가게는 물건이 싼 데다가 품질도 좋아요. (싸다)","words":"","items":["감기에 __________ 열도 나요. (걸렸다)","이 영화는 __________ 음악도 좋아요. (재미있다)","그 사람은 일을 잘 __________ 성실해요. (하다)","오늘은 __________ 눈까지 와요. (춥다)"],"ans":["걸린 데다가","재미있는 데다가","하는 데다가","추운 데다가"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["이 식당은 깨끗한 데다가 친절해요. ( )","그 옷은 예쁜 데다가 너무 비싸요. ( )","시험이 어려운 데다가 시간도 부족했어요. ( )"],"ans":["O","X (yo'nalish har xil)","O"]},{"ins":"Uyingiz/shahringiz haqida -(으)ㄴ/는 데다가 bilan yozing.","nam":"우리 동네는 조용한 데다가 공원도 많아요.","words":"","items":[],"ans":[]}]},{"n":23,"title":"추울 테니까 따뜻하게 입고 가","tag":"A/V-(으)ㄹ 테니(까)","uz":"...-adi, shuning uchun","form":["-(으)ㄹ 테니(까) so'zlovchining taxmini yoki niyatini asos qilib, keyin buyruq, taklif yoki maslahat","beradi. O'zbekchada: \"...-sa kerak, shuning uchun\", \"men ...-aman, siz esa\".","Unli / ㄹ Undosh O'tgan","하다 → 할 테니까 춥다 → 추울 테니까 도착했을 테니까","만들다 → 만들 테니까 먹다 → 먹을 테니까"],"dia":[["Sardor","누나, 나 친구 만나러 나갈게."],["Dilnoza","밤에는 추울 테니까 따뜻하게 입고 가."],["Sardor","응. 늦게 들어올 것 같아."],["Dilnoza","그럼 내가 문을 열어 놓을 테니까 조용히 들어와."]],"tr":"— Opa, do'stim bilan uchrashgani chiqyapman. — Kechasi sovuq bo'lsa kerak, issiq kiyinib ket. — Xo'p. Kech qaytsam kerak. — Unda men eshikni ochiq qoldiraman, sen jimgina kir.","means":[{"h":"Taxmin + maslahat/buyruq","ex":[["길이 막힐 테니까 지하철을 타세요.","Yo'l tirband bo'lsa kerak, metroga chiqing."],["피곤할 테니까 푹 쉬어.","Charchagan bo'lsang kerak, yaxshilab dam ol."]]},{"h":"So'zlovchi niyati (1-shaxs) + iltimos/taklif","ex":[["제가 청소할 테니까 요리 좀 해 주세요.","Men yig'ishtiraman, siz ovqat qilib bering."],["내가 기다릴 테니까 천천히 와.","Men kutib turaman, shoshilmay kel."]]}],"dq":["-(으)ㄹ 텐데 (7-dars) bilan farqi: 텐데 — vaziyat haqida ma'lumot + har xil davom; 테니까 — sabab, keyin ko'pincha buyruq/taklif.","2-ma'noda ega faqat 1-shaxs (나/제가)."],"conv":[["Aziz","오늘 회의 자료를 못 만들었어요."],["Malika","제가 도와줄 테니까 걱정하지 마세요."],["Jisu","공항에 몇 시에 가야 돼요?"],["Jasur","주말이라 사람이 많을 테니까 일찍 가요."]],"ex":[{"ins":"-(으)ㄹ 테니까 bilan yozing.","nam":"곧 비가 올 테니까 우산을 가져가세요. (오다)","words":"","items":["내가 설거지를 __________ 너는 좀 쉬어. (하다)","그 영화는 __________ 꼭 보세요. (재미있다)","배가 __________ 이거라도 먹어요. (고프다)","지금쯤 집에 __________ 전화해 보세요. (도착했다)"],"ans":["할 테니까","재미있을 테니까","고플 테니까","도착했을 테니까"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["제가 표를 (살 테니까 / 살 텐데) 여기서 기다리세요.","오늘 날씨가 (좋을 텐데 / 좋을 테니까) 비가 오네요."],"ans":["살 테니까","좋을 텐데 (kutilganga qarshi)"]},{"ins":"Do'stingizga yordam taklif qiling (1-shaxs -(으)ㄹ 테니까).","nam":"내가 장을 볼 테니까 너는 청소해 줘.","words":"","items":[],"ans":[]}]},{"n":24,"title":"돈이 없는 척했어요","tag":"A-(으)ㄴ 척하다 / V-는 척하다","uz":"...-gandek ko'rsatmoq","form":["-(으)ㄴ/는 척하다 aslida bunday bo'lmasa ham shunday ko'rinishga harakat qilishni bildiradi.","O'zbekchada: \"...-gandek ko'rsatmoq\", \"...-gan bo'lmoq\".","A-(으)ㄴ 척하다 V-는 척하다 V o'tgan N","바쁘다 → 바쁜 척하다 자다 → 자는 척하다 먹은 척하다 N인 척하다","아프다 → 아픈 척하다 모르다 → 모르는 척하다 못 본 척하다"],"dia":[["Jasur","아지즈 씨, 어제 친구가 돈 빌려 달라고 했다면서요?"],["Aziz","네, 그런데 그 친구가 돈을 잘 안 갚아서 없는 척했어요."],["Jasur","친구가 눈치챘어요?"],["Aziz","모르겠어요. 저는 그냥 바쁜 척하고 나왔어요."]],"tr":"— Aziz, kecha do'stingiz qarz so'rabdi-ku? — Ha, lekin u qarzini yaxshi qaytarmaydi, shuning uchun pulim yo'qdek ko'rsatdim. — Do'stingiz sezdimi? — Bilmadim. Men shunchaki band bo'lgandek chiqib ketdim.","means":[{"h":"Aslida emas, lekin shunday ko'rsatish","ex":[["엄마가 들어오시자 동생이 자는 척했어요.","Onam kirishi bilan ukam uxlagandek ko'rsatdi."],["아는 사람을 만났는데 못 본 척했어요.","Tanish odamni uchratib, ko'rmagandek bo'ldim."]]},{"h":"Sifat bilan","ex":[["그는 항상 바쁜 척해요.","U doim band bo'lgandek ko'rinadi."],["괜찮은 척했지만 사실은 많이 아팠어요.","Hech narsa qilmagandek ko'rsatdim, aslida juda og'rigan edi."]]}],"dq":["아는 척하다 = bilgandek ko'rsatmoq (bilmasa ham) / 아는 척하다 = tanigandek salomlashmoq ham bo'lishi mumkin — kontekstga qarang.","-(으)ㄴ/는 체하다 ham xuddi shu ma'noda."],"conv":[["Malika","왜 대답을 안 했어요?"],["Dilnoza","못 들은 척했어요. 대답하기 싫었거든요."],["Sardor","그 사람 진짜 부자예요?"],["Jisu","아니요, 그냥 부자인 척하는 거예요."]],"ex":[{"ins":"-(으)ㄴ/는 척하다 bilan yozing.","nam":"숙제를 안 했는데 한 척했어요. (하다, o'tgan)","words":"","items":["맛이 없었지만 __________. (맛있다)","아는 문제였지만 __________. (모르다)","동생은 공부하기 싫어서 __________. (아프다)","전화가 왔는데 __________. (자다)"],"ans":["맛있는 척했어요","모르는 척했어요","아픈 척했어요","자는 척했어요"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["그는 아는 척하는 걸 좋아해요. ( )","배가 고픈 척해서 밥을 먹었어요. ( )","저는 정말 피곤한 척해요. ( )"],"ans":["O","X (rostdan och bo'lsa — 배가 고파서)","X (rostdan charchagan bo'lsa — 정말 피곤해요)"]},{"ins":"Qachon nimadir qilgandek ko'rsatgansiz? 2 ta gap yozing.","nam":"어렸을 때 학교에 가기 싫어서 아픈 척했어요.","words":"","items":[],"ans":[]}]},{"n":25,"title":"넘어질 뻔했는데 안 넘어졌어","tag":"V-(으)ㄹ 뻔하다","uz":"...-shiga oz qoldi","form":["-(으)ㄹ 뻔하다 biror (ko'pincha yomon) voqea sodir bo'lishiga oz qolganini, lekin bo'lmaganini","bildiradi. Doim o'tgan zamonda: -(으)ㄹ 뻔했다. O'zbekchada: \"...-shiga oz qoldi\", \"sal bo'lmasa","...\".","Unli / ㄹ Undosh Kuchaytirish","넘어지다 → 넘어질 뻔했다 잊다 → 잊을 뻔했다 죽을 뻔했다 = juda ham","늦다 → 늦을 뻔했다"],"dia":[["Aziz","지수 씨, 괜찮아요? 얼굴이 하얘요."],["Jisu","길이 얼어서 넘어질 뻔했는데 다행히 안 넘어졌어요."],["Aziz","조심하세요. 저도 아까 계단에서 미끄러질 뻔했어요."],["Jisu","오늘은 천천히 걸어야겠어요."]],"tr":"— Jisu, yaxshimisiz? Yuzingiz oqarib ketibdi. — Yo'l muzlab, yiqilishimga oz qoldi, xayriyat yiqilmadim. — Ehtiyot bo'ling. Men ham hozirgina zinada sirpanib ketishimga oz qoldi. — Bugun sekin yurishim kerak ekan.","means":[{"h":"Oz qoldi, lekin bo'lmadi","ex":[["늦잠을 자서 비행기를 놓칠 뻔했어요.","Uxlab qolib, samolyotdan qolishimga oz qoldi."],["친구 생일을 잊을 뻔했어요.","Do'stimning tug'ilgan kunini unutishimga oz qoldi."]]},{"h":"Mubolag'a: 죽을 뻔했다","ex":[["너무 웃겨서 죽을 뻔했어요.","Kulaverib o'lishimga oz qoldi."],["배고파서 죽을 뻔했어요.","Ochlikdan o'lay dedim."]]}],"dq":["Faqat o'tgan zamon: 넘어질 뻔해요 ✗ → 넘어질 뻔했어요 ✓","Ko'pincha 하마터면 (sal bo'lmasa) bilan keladi: 하마터면 사고가 날 뻔했어요."],"conv":[["Sardor","왜 이렇게 숨이 차요?"],["Malika","뛰어왔어요. 버스를 놓칠 뻔했거든요."],["Jasur","시험 어땠어?"],["Dilnoza","이름을 안 쓸 뻔했어. 마지막에 봤어."]],"ex":[{"ins":"-(으)ㄹ 뻔했어요 bilan yozing.","nam":"하마터면 지갑을 잃어버릴 뻔했어요. (잃어버리다)","words":"","items":["차가 갑자기 와서 __________. (부딪히다)","알람이 안 울려서 회사에 __________. (지각하다)","너무 슬퍼서 __________. (울다)","계단에서 __________. (떨어지다)"],"ans":["부딪힐 뻔했어요","지각할 뻔했어요","울 뻔했어요","떨어질 뻔했어요"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["어제 길에서 넘어질 뻔해요. ( )","하마터면 약속을 잊을 뻔했어요. ( )","친구 덕분에 길을 잃을 뻔했어요. ( )"],"ans":["X (→ 넘어질 뻔했어요)","O","X (덕분에 bilan ma'no mos emas → 친구가 없었으면 길을 잃을 뻔했어요)"]},{"ins":"Yaqinda nimaga oz qoldi? -(으)ㄹ 뻔했어요 bilan yozing.","nam":"지하철에서 졸다가 역을 지나칠 뻔했어요.","words":"","items":[],"ans":[]}]},{"n":26,"title":"시험에 떨어질까 봐 열심히 공부하고 있어","tag":"A/V-(으)ㄹ까 봐","uz":"...-masin deb (xavotir)","form":["-(으)ㄹ까 봐 biror yomon narsa sodir bo'lishidan xavotirlanib, shunga qarshi harakat qilishni yoki","tashvishni bildiradi. O'zbekchada: \"...-masin deb\", \"...-sa-chi deb qo'rqib\".","Unli / ㄹ Undosh O'tgan Tashvish","늦다 → 늦을까 봐 많다 → 많을까 봐 잊었을까 봐 -(으)ㄹ까 봐 걱정이다","떨어지다 → 떨어질까 봐 춥다 → 추울까 봐"],"dia":[["Jasur","사르도르, 요즘 매일 도서관에 가네."],["Sardor","응, 다음 달 토픽 시험에 떨어질까 봐 열심히 공 부하고 있어."],["Jasur","넌 잘할 거야. 걱정 마."],["Sardor","고마워. 시험 날 늦을까 봐 벌써 알람도 세 개 맞췄어."]],"tr":"— Sardor, keyingi paytda har kuni kutubxonaga boryapsan. — Ha, kelasi oy TOPIK'dan yiqilmay deb qattiq o'qiyapman. — Sen uddalaysan. Xavotir olma. — Rahmat. Imtihon kuni kechikmay deb hozirdan uchta budilnik qo'ydim.","means":[{"h":"Xavotir sababli harakat","ex":[["길이 막힐까 봐 일찍 출발했어요.","Yo'l tirband bo'lmasin deb erta yo'lga chiqdim."],["아기가 깰까 봐 조용히 들어왔어요.","Chaqaloq uyg'onmasin deb jimgina kirdim."]]},{"h":"Tashvish: -(으)ㄹ까 봐 걱정이다","ex":[["면접에서 실수할까 봐 걱정이에요.","Suhbatda xato qilib qo'yamanmi deb xavotirdaman."],["비가 올까 봐 걱정했어요.","Yomg'ir yog'masin deb xavotir oldim."]]}],"dq":["Buyruq/taklif bilan ishlatilmaydi: 늦을까 봐 빨리 가세요. ✗ → 늦지 않게 빨리 가세요.","Keyingi gap odatda o'tgan yoki hozirgi zamonda bo'ladi."],"conv":[["Malika","왜 우산을 두 개나 가져왔어요?"],["Aziz","지수 씨가 우산이 없을까 봐 하나 더 가져왔어요."],["Dilnoza","왜 말 안 했어?"],["Jisu","네가 화낼까 봐 못 했어."]],"ex":[{"ins":"-(으)ㄹ까 봐 bilan yozing.","nam":"감기에 걸릴까 봐 옷을 따뜻하게 입었어요. (걸리다)","words":"","items":["약속을 __________ 메모해 놓았어요. (잊어버리다)","음식이 __________ 많이 만들었어요. (부족하다)","친구가 __________ 거짓말을 했어요. (실망하다)","표가 다 __________ 미리 샀어요. (팔리다)"],"ans":["잊어버릴까 봐","부족할까 봐","실망할까 봐","팔릴까 봐"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["늦을까 봐 택시를 탔어요. ( )","비가 올까 봐 우산을 가져가세요. ( )","시험이 어려울까 봐 걱정이에요. ( )"],"ans":["O","X (buyruq bilan emas)","O"]},{"ins":"Nimadan xavotirlanasiz? -(으)ㄹ까 봐 걱정이에요 bilan yozing.","nam":"한국어를 잊어버릴까 봐 걱정이에요.","words":"","items":[],"ans":[]}]},{"n":27,"title":"한국 사람들과 편하게 대화할 정도로 해","tag":"A/V-(으)ㄹ 정도로","uz":"...-adigan darajada","form":["-(으)ㄹ 정도로 keyingi holatning darajasini misol orqali ko'rsatadi. O'zbekchada: \"...-adigan","darajada\", \"...-gudek\".","Unli / ㄹ Undosh Gap oxiri N","대화하다 → 대화할 정도로 먹다 → 먹을 정도로 -(으)ㄹ 정도예요 N 정도 = taxminan","울다 → 울 정도로 춥다 → 추울 정도로"],"dia":[["Dilnoza","말리카, 네 동생도 한국어 잘해?"],["Malika","응, 한국 사람들과 편하게 대화할 정도로 해."],["Dilnoza","와, 대단하다! 얼마나 공부했어?"],["Malika","하루에 5시간 정도 공부했어. 잠을 못 잘 정도로 열심히 했어."]],"tr":"— Malika, ukang ham koreyschani yaxshi biladimi? — Ha, koreyslar bilan bemalol suhbatlasha oladigan darajada biladi. — Voy, zo'r! Qancha o'qigan? — Kuniga taxminan 5 soat. Uyqusi kelmaydigan darajada qattiq o'qigan.","means":[{"h":"Daraja: ...-adigan darajada","ex":[["배가 아플 정도로 웃었어요.","Qornim og'riydigan darajada kuldim."],["발이 안 보일 정도로 눈이 많이 왔어요.","Oyoq ko'rinmaydigan darajada ko'p qor yog'di."]]},{"h":"Gap oxirida: -(으)ㄹ 정도이다","ex":[["이 음식은 눈물이 날 정도예요.","Bu ovqat ko'zdan yosh chiqaradigan darajada (achchiq)."],["너무 피곤해서 서 있기 힘들 정도예요.","Shunchalik charchadimki, tik turish qiyin."]]},{"h":"N 정도: taxminan","ex":[["집에서 회사까지 30분 정도 걸려요.","Uydan ishgacha taxminan 30 daqiqa ketadi."]]}],"dq":["-(으)ㄹ 만큼 ham o'xshash ma'noda: 배가 아플 만큼 웃었어요.","Daraja ko'pincha mubolag'a bilan beriladi."],"conv":[["Jasur","그 영화 슬퍼요?"],["Jisu","네, 휴지 한 통을 다 쓸 정도로 울었어요."],["Aziz","서울 여름 더워요?"],["Sardor","네, 밖에 못 나갈 정도로 더워요."]],"ex":[{"ins":"-(으)ㄹ 정도로 bilan yozing.","nam":"목이 아플 정도로 노래를 불렀어요. (아프다)","words":"","items":["다리가 __________ 많이 걸었어요. (붓다 → 부을)","옆 사람 말이 안 __________ 시끄러웠어요. (들리다)","배가 __________ 많이 먹었어요. (터지다)","모든 사람이 다 __________ 큰 소리로 말했어요. (듣다)"],"ans":["부을 정도로","들릴 정도로","터질 정도로","들을 정도로"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["너무 피곤해서 눈을 뜰 수 없을 (정도예요 / 정도로).","공항까지 1시간 (정도 / 정도로) 걸려요."],"ans":["정도예요","정도"]},{"ins":"Juda ... bo'lgan vaziyatni -(으)ㄹ 정도로 bilan yozing.","nam":"잠을 못 잘 정도로 긴장했어요.","words":"","items":[],"ans":[]}]},{"n":28,"title":"치킨이야말로 맥주하고 어울리는 음식이지요","tag":"N(이)야말로","uz":"aynan ... (ta'kid)","form":["N(이)야말로 boshqalar orasidan aynan shu narsani ajratib, kuchli ta'kidlaydi. O'zbekchada: \"aynan","...\", \"chinakam ...\", \"... -ku haqiqiy\".","Unli Undosh","저 → 저야말로 지금 → 지금이야말로","너 → 너야말로 건강 → 건강이야말로"],"dia":[["Jisu","말리카 씨, 오늘 플로프를 만들어 줘서 정말 고마워요."],["Malika","아니에요. 저야말로 와 줘서 고마워요."],["Jisu","플로프는 정말 맛있네요. 우즈베키스탄을 대표하 는 음식이에요?"],["Malika","네, 플로프야말로 우즈베키스탄의 대표 음식이에요."]],"tr":"— Malika, bugun palov qilib berganingiz uchun katta rahmat. — Arzimaydi. Asl rahmatni men aytishim kerak, kelganingiz uchun. — Palov juda mazali ekan. O'zbekistonning ramziy taomimi? — Ha, aynan palov O'zbekistonning ramziy taomi.","means":[{"h":"Aynan shu — boshqalardan ajratib ta'kidlash","ex":[["건강이야말로 가장 중요한 재산이에요.","Aynan sog'liq eng muhim boylik."],["지금이야말로 새로 시작할 때예요.","Aynan hozir yangidan boshlash vaqti."]]},{"h":"Javobda: 저야말로 / 너야말로","ex":[["A: 도와줘서 고마워. B: 너야말로 고마워.","— Yordaming uchun rahmat. — Asl rahmatni men aytishim kerak."],["A: 미안해요. B: 저야말로 미안해요.","— Kechirasiz. — Aslida men kechirim so'rashim kerak."]]}],"dq":["Faqat ot bilan; ijobiy yoki muhim narsani ta'kidlashda ko'proq ishlatiladi.","N은/는 dan kuchliroq ta'kid beradi."],"conv":[["Aziz","한국에서 어디가 제일 좋았어요?"],["Dilnoza","제주도야말로 꼭 가 봐야 하는 곳이에요."],["Sardor","늦어서 미안해."],["Jasur","아니야, 나야말로 연락 못 해서 미안해."]],"ex":[{"ins":"N(이)야말로 bilan yozing.","nam":"가족이야말로 제 힘의 원천이에요. (가족)","words":"","items":["__________ 진짜 친구예요. (너)","__________ 한국의 대표 음식이에요. (김치)","__________ 공부하기 좋은 계절이에요. (가을)"],"ans":["너야말로","김치야말로","가을이야말로"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["A: 축하해요! B: (저야말로 / 저도요) 고마워요.","(사랑이야말로 / 사랑야말로) 가장 소중해요."],"ans":["저야말로","사랑이야말로"]},{"ins":"Siz uchun eng muhim narsa nima? N(이)야말로 bilan yozing.","nam":"저에게는 건강이야말로 가장 중요해요.","words":"","items":[],"ans":[]}]},{"n":29,"title":"등산 날짜를 잡으려던 참이에요","tag":"V-(으)려던 참이다","uz":"endi ...-moqchi edim","form":["-(으)려던 참이다 aynan shu payt biror ishni qilmoqchi bo'lib turganini bildiradi. Ko'pincha 마침, 막","bilan keladi. O'zbekchada: \"endi ...-moqchi bo'lib turgandim\".","Unli / ㄹ Undosh Zamon","하다 → 하려던 참이다 잡다 → 잡으려던 참이다 -(으)려던 참이에요 / 참이었어요","만들다 → 만들려던 참이다 먹다 → 먹으려던 참이다"],"dia":[["Sardor","아지즈 씨, 다음 달 동아리 등산은 언제 가요?"],["Aziz","마침 지금 등산 날짜를 잡으려던 참이에요."],["Sardor","잘됐네요. 저는 둘째 주 토요일이 좋아요."],["Aziz","알겠어요. 회원들에게 문자를 보내려던 참이었는 데 같이 물어볼게요."]],"tr":"— Aziz, kelasi oy to'garakdagi tog' sayri qachon? — Aynan hozir sanasini belgilamoqchi bo'lib turgandim. — Juda yaxshi. Menga ikkinchi hafta shanbasi qulay. — Tushundim. A'zolarga SMS yubormoqchi edim, birga so'rab ko'raman.","means":[{"h":"Aynan shu payt qilmoqchi edim","ex":[["마침 전화하려던 참이었어요.","Aynan qo'ng'iroq qilmoqchi bo'lib turgandim."],["지금 막 밥을 먹으려던 참이에요. 같이 먹을래요?","Hozirgina ovqat yemoqchi edim. Birga yeymizmi?"]]}],"dq":["Faqat fe'l bilan.","Asosan suhbatdosh taklifi/so'rovi bilan vaqt mos kelganda ishlatiladi.","-(으)려고 하다 (oddiy niyat) dan farqi: -(으)려던 참 — aynan shu daqiqa."],"conv":[["Malika","커피 한잔할래요?"],["Jisu","좋아요. 저도 마시려던 참이었어요."],["Jasur","창문 좀 닫아 줄래요?"],["Dilnoza","네, 저도 닫으려던 참이에요."]],"ex":[{"ins":"-(으)려던 참이에요 bilan yozing.","nam":"A: 같이 점심 먹을까요? B: 좋아요. 저도 먹으려던 참이에요. (먹다)","words":"","items":["A: 산책 갈래요? B: 마침 __________. (나가다)","A: 숙제 다 했어? B: 아니, 지금 __________. (시작하다)","A: 빨리 자! B: 네, 지금 __________. (자다)"],"ans":["나가려던 참이에요","시작하려던 참이야","자려던 참이에요"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["마침 너한테 연락하려던 참이었어. ( )","날씨가 좋으려던 참이에요. ( )"],"ans":["O","X (sifat bilan emas)"]},{"ins":"Do'stingiz taklif qildi. -(으)려던 참이에요 bilan javob bering.","nam":"","words":"","items":["A: 영화 볼래요? → B: ______________________","A: 이것 좀 도와줄래요? → B: ______________________"],"ans":[]}]},{"n":30,"title":"자동차가 이렇게 많을 줄 몰랐어요","tag":"A/V-(으)ㄹ 줄 몰랐다/알았다","uz":"...-ishini bilmagandim / o'ylagandim","form":["-(으)ㄹ 줄 몰랐다 kutilmagan holatga hayratni, -(으)ㄹ 줄 알았다 esa o'ylagan narsa (ko'pincha xato","chiqqan taxmin)ni bildiradi. O'zbekchada: \"...-ishini bilmagandim\", \"...-adi deb o'ylagandim\".","Unli / ㄹ Undosh O'tgan Hozirgi (fe'l)","오다 → 올 줄 몰랐다 많다 → 많을 줄 몰랐다 끝났을 줄 알았다 V-는 줄 몰랐다: 오는 줄 몰랐어요","길다 → 길 줄 알았다 어렵다 → 어려울 줄"],"dia":[["Jisu","자수르 씨, 서울에 처음 와 보니까 어때요?"],["Jasur","자동차가 이렇게 많을 줄 몰랐어요. 길이 너무 막혀요."],["Jisu","하하, 출퇴근 시간이라서 그래요."],["Jasur","저는 지하철도 한가할 줄 알았는데 사람이 정말많네요."]],"tr":"— Jasur, Seulga birinchi kelib ko'rdingiz, qalay? — Mashina bunchalik ko'p bo'lishini bilmagandim. Yo'l juda tirband. — Ha-ha, ishga borish-qaytish vaqti-da. — Men metro bo'sh bo'ladi deb o'ylagandim, odam juda ko'p ekan.","means":[{"h":"-(으)ㄹ 줄 몰랐다: kutmagan edim","ex":[["시험이 이렇게 어려울 줄 몰랐어요.","Imtihon bunchalik qiyin bo'lishini bilmagandim."],["네가 올 줄 몰랐어. 정말 반가워!","Kelishingni kutmagandim. Juda xursandman!"]]},{"h":"-(으)ㄹ 줄 알았다: shunday deb o'ylagandim (lekin unday emas)","ex":[["오늘 비가 올 줄 알았는데 안 왔어요.","Bugun yomg'ir yog'adi deb o'ylagandim, yog'madi."],["벌써 끝났을 줄 알았어요.","Allaqachon tugagan deb o'ylagandim."]]},{"h":"Hozirgi holat: A-(으)ㄴ/V-는 줄 몰랐다","ex":[["여기가 금연 구역인 줄 몰랐어요.","Bu yer chekish taqiqlangan joy ekanini bilmabman."]]}],"dq":["V-(으)ㄹ 줄 알다/모르다 (\"...-ishni bilmoq / bilmaslik\" — qobiliyat) bilan aralashtirmang: 수 영할 줄 알아요 = suza olaman.","몰랐다/알았다 odatda o'tgan zamonda."],"conv":[["Malika","이 케이크 직접 만들었어요?"],["Dilnoza","네! 맛있어요? 저도 이렇게 잘 될 줄 몰랐어요."],["Aziz","왜 우산을 가져왔어요?"],["Sardor","비가 올 줄 알았거든요."]],"ex":[{"ins":"-(으)ㄹ 줄 몰랐어요 / 알았어요 bilan yozing.","nam":"한국 겨울이 이렇게 추울 줄 몰랐어요. (춥다)","words":"","items":["그 사람이 그렇게 __________. 정말 친절했어요. (착하다 — bilmagandim)","시험이 쉬울 __________ 정말 어려웠어요. (알다)","민수 씨가 __________. 벌써 결혼했대요. (결혼했다 — bilmagandim)","오늘이 일요일__________. (이다, o'ylagandim)"],"ans":["착할 줄 몰랐어요","줄 알았는데","결혼했을 줄 몰랐어요","일 줄 알았어요"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["저는 수영을 (할 줄 몰라요 / 할 줄 몰랐어요). (qobiliyat)","네가 한국에 (온 줄 / 올 줄) 몰랐어. (allaqachon kelgan)"],"ans":["할 줄 몰라요","온 줄"]},{"ins":"Koreyaga kelib nimani kutmagan edingiz? 2 ta gap.","nam":"한국 사람들이 이렇게 빨리 걸을 줄 몰랐어요.","words":"","items":[],"ans":[]}]},{"n":31,"title":"수업이 끝난 후에 회의를 열도록 하겠습니다","tag":"V-도록","uz":"...-adigan qilib","form":["-도록 maqsad yoki natija darajasini (\"...-adigan qilib\"), vaqt chegarasini (\"...-guncha\") va -도록 하다","shaklida buyruq/qarorni bildiradi.","V-도록 -도록 하다","열다 → 열도록 하도록 하세요 / 하도록 하겠습니다","늦다 → 늦도록","안 잊어버리다 → 잊어버리지 않도록"],"dia":[["Malika","반장님, 다음 주 행사 회의는 언제 해요?"],["Sardor","수업이 끝난 후에 회의를 열도록 하겠습니다."],["Malika","모두 알 수 있도록 단체 방에 공지해 주세요."],["Sardor","네, 잊어버리지 않도록 지금 바로 올릴게요."]],"tr":"— Starosta, keyingi haftadagi tadbir yig'ilishi qachon? — Darsdan keyin yig'ilish o'tkazamiz. — Hamma bilsin deb guruh chatiga e'lon qiling. — Ha, unutib qo'ymaslik uchun hoziroq joylayman.","means":[{"h":"Maqsad: ...-adigan qilib, ...-sin deb","ex":[["감기에 걸리지 않도록 손을 자주 씻으세요.","Shamollamaslik uchun qo'lingizni tez-tez yuving."],["뒤에서도 잘 들리도록 크게 말해 주세요.","Orqada ham yaxshi eshitiladigan qilib baland gapiring."]]},{"h":"Vaqt/daraja chegarasi: ...-guncha","ex":[["밤늦도록 공부했어요.","Kechgacha o'qidim."],["목이 터지도록 응원했어요.","Tomog'im yirtilguncha qo'llab-quvvatladim."]]},{"h":"-도록 하다: rasmiy buyruq yoki qaror","ex":[["내일까지 제출하도록 하세요.","Ertagacha topshiring."],["다음부터는 늦지 않도록 하겠습니다.","Bundan keyin kechikmaslikka harakat qilaman."]]}],"dq":["Ikki qism egasi har xil bo'lishi mumkin: 아이가 잘 자도록 엄마가 노래를 불러요.","-게 bilan juda o'xshash: 늦지 않게 = 늦지 않도록."],"conv":[["Jisu","이 약은 어떻게 먹어요?"],["Aziz","잊지 않도록 식사 후에 바로 드세요."],["Jasur","과장님, 보고서는 언제까지 드릴까요?"],["Dilnoza","금요일까지 내도록 하세요."]],"ex":[{"ins":"-도록 bilan yozing.","nam":"잘 보이도록 글씨를 크게 써 주세요. (보이다)","words":"","items":["아기가 __________ 조용히 하세요. (깨지 않다)","눈이 __________ 컴퓨터를 했어요. (빨개지다)","길을 __________ 지도를 보내 줄게요. (잃지 않다)","다음부터 일찍 __________ 하겠습니다. (오다)"],"ans":["깨지 않도록","빨개지도록","잃지 않도록","오도록"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["모든 사람이 이해할 수 있도록 쉽게 설명했어요. ( )","밤새도록 이야기를 했어요. ( )","늦지 않도록 빨리 갔도록 했어요. ( )"],"ans":["O","O","X (→ 늦지 않도록 빨리 갔어요)"]},{"ins":"O'qituvchi sifatida talabalarga -도록 하세요 bilan 3 ta ko'rsatma bering.","nam":"수업 시간에 휴대폰을 사용하지 않도록 하세요.","words":"","items":[],"ans":[]}]},{"n":32,"title":"어려움이 많을수록 더욱 사랑하게 되지요","tag":"A/V-(으)ㄹ수록","uz":"qanchalik ..., shunchalik","form":["-(으)ㄹ수록 birinchi holat kuchaygan sari ikkinchisi ham kuchayishini bildiradi. Ko'pincha -(으)면 -","(으)ㄹ수록 shaklida. O'zbekchada: \"qanchalik ..., shunchalik\", \"...-gan sari\".","Unli / ㄹ Undosh Kuchaytirilgan N","보다 → 볼수록 많다 → 많을수록 보면 볼수록 N일수록: 어려운 때일수록","만들다 → 만들수록 먹다 → 먹을수록 배우면 배울수록"],"dia":[["Jasur","딜노자 씨, 한국어 공부 힘들지 않아요?"],["Dilnoza","처음엔 힘들었는데 배우면 배울수록 재미있어요."],["Jasur","저는 문법이 배울수록 어려워요."],["Dilnoza","그래도 포기하지 마세요. 어려울수록 천천히 하 면 돼요."]],"tr":"— Dilnoza, koreys tili qiyin emasmi? — Boshida qiyin edi, o'rgangan sari qiziqarli bo'lyapti. — Menga grammatika o'rgangan sari qiyinlashyapti. — Baribir taslim bo'lmang. Qanchalik qiyin bo'lsa, shunchalik sekin qilish kerak.","means":[{"h":"Qanchalik ..., shunchalik","ex":[["이 노래는 들을수록 좋아요.","Bu qo'shiq eshitgan sari yoqadi."],["사람이 많을수록 재미있어요.","Odam qancha ko'p bo'lsa, shuncha qiziq."]]},{"h":"-(으)면 -(으)ㄹ수록: kuchaytirish","ex":[["그 사람은 보면 볼수록 멋있어요.","U odam qancha ko'rsangiz, shuncha kelishgan."],["생각하면 생각할수록 화가 나요.","O'ylagan sari jahlim chiqyapti."]]},{"h":"N일수록","ex":[["바쁠 때일수록 건강을 챙기세요.","Qancha band bo'lsangiz, sog'lig'ingizga shuncha e'tibor bering."]]}],"dq":["O'tgan zamon qo'shilmaydi: 봤을수록 ✗","Ikkinchi qismda o'zgarish/daraja bildiruvchi so'z keladi: 더, 좋아지다, 늘다."],"conv":[["Aziz","한국 음식 좋아해요?"],["Malika","네, 먹을수록 맛있어요."],["Jisu","집이 크면 좋겠어요."],["Sardor","집은 클수록 청소가 힘들어요."]],"ex":[{"ins":"-(으)ㄹ수록 bilan yozing.","nam":"이 책은 읽을수록 재미있어요. (읽다)","words":"","items":["나이가 __________ 건강이 중요해요. (들다)","높이 __________ 공기가 차가워져요. (올라가다)","연습을 많이 __________ 실력이 늘어요. (하다)","가까운 __________ 예의를 지켜야 해요. (사이)"],"ans":["들수록","올라갈수록","할수록","사이일수록"]},{"ins":"Qavs ichidan to'g'risini tanlang.","nam":"","words":"","items":["한국어는 (배우면 배울수록 / 배우면 배웠을수록) 재미있어요.","값이 (쌀수록 / 싸수록) 사람들이 많이 사요."],"ans":["배우면 배울수록","쌀수록"]},{"ins":"-(으)면 -(으)ㄹ수록 bilan 2 ta gap yozing.","nam":"한국 드라마는 보면 볼수록 빠져들어요.","words":"","items":[],"ans":[]}]},{"n":33,"title":"기분이 안 좋아 보이는데 무슨 일이 있나 봐요","tag":"A-(으)ㄴ가 보다 / V-나 보다","uz":"...-sa kerak, shekilli","form":["-(으)ㄴ가/-나 보다 ko'rgan-eshitgan dalil asosida taxmin qilishni bildiradi. O'zbekchada: \"...-sa","kerak\", \"shekilli\", \"...-ga o'xshaydi\".","A-(으)ㄴ가 보다 V-나 보다 O'tgan N","바쁘다 → 바쁜가 보다 오다 → 오나 보다 왔나 보다 N인가 보다","좋다 → 좋은가 보다 있다 → 있나 보다 아팠나 보다"],"dia":[["Malika","지수 씨가 오늘 하루 종일 말이 없네요."],["Aziz","그러게요. 기분이 안 좋아 보이는데 무슨 일이 있 나 봐요."],["Malika","아까 전화하면서 울던데 집에 무슨 일이 생겼나봐요."],["Aziz","이따가 같이 이야기해 봐요."]],"tr":"— Jisu bugun kun bo'yi indamay yuribdi. — Ha-ya. Kayfiyati yo'qqa o'xshaydi, nimadir bo'lgan shekilli. — Hozir telefonda gaplashib yig'layotgandi, uyida biror narsa bo'lgan bo'lsa kerak. — Keyinroq birga gaplashib ko'raylik.","means":[{"h":"Dalil asosida taxmin","ex":[["사람들이 우산을 쓰고 있어요. 밖에 비가 오나 봐요.","Odamlar soyabon ushlab yuribdi. Tashqarida yomg'ir yog'yapti shekilli."],["줄이 길어요. 이 식당이 맛있나 봐요.","Navbat uzun. Bu restoran mazali bo'lsa kerak."]]},{"h":"Sifat bilan: -(으)ㄴ가 보다","ex":[["계속 하품을 하네요. 많이 피곤한가 봐요.","Tinmay esnayapti. Juda charchagan bo'lsa kerak."],["저 사람이 선생님인가 봐요.","U kishi o'qituvchi bo'lsa kerak."]]}],"dq":["O'zi haqida ishlatilmaydi: 제가 배가 고픈가 봐요. ✗ (faqat hazil/o'zini kuzatganda mumkin).","Aniq dalil bo'lmasa -(으)ㄹ 것 같다 ishlatiladi.","있다/없다 bilan doim -나 보다: 맛있나 봐요."],"conv":[["Jasur","민수 씨 집에 불이 꺼져 있어요."],["Dilnoza","벌써 자나 봐요."],["Sardor","지수 씨가 웃고 있어요."],["Aziz","좋은 소식이 있나 봐요."]],"ex":[{"ins":"-(으)ㄴ가/-나 봐요 bilan yozing.","nam":"창문이 열려 있어요. 누가 왔나 봐요. (왔다)","words":"","items":["얼굴이 빨개요. 열이 __________. (나다)","친구가 밥을 세 그릇이나 먹어요. 배가 많이 __________. (고프다)","책을 많이 읽어요. 책을 __________. (좋아하다)","교실에 아무도 없어요. 수업이 __________. (끝났다)"],"ans":["나나 봐요","고픈가 봐요","좋아하나 봐요","끝났나 봐요"]},{"ins":"To'g'ri bo'lsa O, noto'g'ri bo'lsa X qo'ying.","nam":"","words":"","items":["길이 젖어 있어요. 밤에 비가 왔나 봐요. ( )","저는 오늘 피곤한가 봐요. ( )","저 식당은 사람이 많아요. 유명한가 봐요. ( )"],"ans":["O","X (o'zi haqida)","O"]},{"ins":"Rasmni tasavvur qiling va taxmin qiling (-나 보다).","nam":"친구가 가방을 싸고 있어요. → 여행을 가나 봐요.","words":"","items":["동생이 계속 거울을 봐요. → ______________________","옆집에서 음악 소리가 크게 나요. → ______________________"],"ans":[]}]},{"n":34,"title":"영화를 보든지 맛있는 음식을 먹든지 다 좋아해","tag":"V-든지 / N(이)든지","uz":"...mi, ...mi (farqi yo'q)","form":["-든지 bir nechta tanlovdan qaysi biri bo'lsa ham farqi yo'qligini bildiradi. So'roq so'zlari bilan \"har","qanday\" ma'nosini beradi. O'zbekchada: \"...-adimi, ...-adimi\", \"yoki ..., yoki ...\".","V-든지 N(이)든지 So'roq so'zi -든지 말든지","보다 → 보든지 커피든지 언제든지 가든지 말든지","먹다 → 먹든지 빵이든지 뭐든지","어디든지","누구든지"],"dia":[["Sardor","딜노자, 이번 주말에 뭐 하고 싶어?"],["Dilnoza","나는 영화를 보든지 맛있는 음식을 먹든지 다 좋아."],["Sardor","그럼 내가 정할게. 어디든지 괜찮아?"],["Dilnoza","응, 너랑 같이 가면 어디든지 좋아."]],"tr":"— Dilnoza, shu dam ol
